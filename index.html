 help loving – pure emotion is love\nTeachers must try to ignite as many sparks as possible – a catalyst is created\nWorkings of the guru is to prod and push\nGururaj can handle the Forms and Mantras for the increased numbers\n8. No faith or belief is necessary for gurushakti to work\nJesus taught Bhakti Yoga - to develop belief – finding reality\nUsing the power of belief in positivity\n9. The universal force knows our needs – you don’t have to ask\nQualities of the teacher and his teaching coming through on the Forms\n10. Prep teacher feels the power of gurushakti – is pulling out tensions from the Initiate\nThe more you teach the more that flow of power is received by you."}, {"ref": "UK78-20", "summary": "2. Explanation of the Gap Practice\nBlockages – Chakras - Chakra is a level a person has passed through\nHeightening the vibrations of the lower Chakras pushes the energy upwards\nThe Pranayama Practice which involves moving prana between the Chakras\nMan only becomes 'man' from the Manipura Chakra upwards.\n3. Man can never be devoid of animal samskaras – but they can be sublimated\nMan has dominant animal qualities superimposed on the man qualities.\nThe Swirling Practice and the Gap Practice explained.\nAwareness of the Gap – centred on yourself at that moment\n4. The Void - gap - reaching the Void, the nothingness which is the everythingness\nThe Night Practice –\nAssociating colour with part of the body\nEffect on the Chakras - sending forth soothing energies throughout the system\n5. How can we make our active life a meditation?\nFeeling the stillness all day - everything is enjoyable – non-attached to it\nHow every act is to be a meditation.\nYogis always happy - find the joy in everything - no expectations, no disappointments\n6. Vibrations from meditation linger - swirling the mantra\nThe practices are systematically worked out, and are interrelated.\nWhat happens to the Full Counsellor when initiating - becomes a channel\nWhy a person’s mantra should not be divulged - can cause a jam in your meditation\nSending negative thoughts\n7. How is it that a healer does not abuse the mantra?\nThe link between the healer and the meditator"}, {"ref": "UK78-21", "summary": "2. Gururaj being responsible for each chela - spiritual, physical aspects etc.\nHe has developed that closeness - knows what you really are - always with you\nThe link through Gurushakti can never be broken - no separation ever\n3. When you love with the intensity of universal love, all separation ceases\nResponsibility of the chela is to open up to the Divine flow of love through the practices\nLosing individuality to gain universality - there is no loss\n4. On becoming total, individuality doesn’t matter\nTo find universality, one has to refine the ego – go through a process of duality\nDuality exists, but the light of Divinity shines through the glass\n5. We are the product of the totality of all previous existences\nWith the expansion of the heart and mind, we recognise the closeness of everything\nRefine the inner self, which can be done in one lifetime\n6. Do our social responsibilities curb or stifle the devotion towards Gururaj?\nThe guru is universal and covers every aspect of daily life – have devotion to all people\nThe same universal force as in the guru is in everything\n7. Did man come through many evolutions or did he fall from grace?\nThe various views about the evolution of man\nScientists try to prove the evolutionary theory\n8. Another view is that of the superimposition of the relative on the absolute\nMaya – concept that the reflection is unreal\nEverything is evolved and at the same time evolving"}, {"ref": "UK78-27", "summary": "12. The Prayer – ‘The Great Invocation’\nWhere does evil come from?\nEvil is a force which is non-evolutionary and is a conception of the mind\n13. Divinity is beyond good and evil\nOne has to go beyond the laws of opposites\nProgress from participation to observation and then back to participation at a higher level.\nRecognise Divinity in everything around us\n14. When thoughts become more refined, actions also become more refined\nWe will see the goodness in everything\nThrough meditation we attune ourselves to a higher vibration\nNo such thing as overcoming evil\n15. Story about God looking for somewhere to hide\nThe search is inward to find the three part harmony within\n16. Removal of chakric blockages\nSelection of personal practices to suit the individual\nIs there a New Age or an Age of Enlightenment?\n17. Theory of evolution – within relativity, all conflicts will not cease\nThere is a balance which is always required\nCannot foresee an age when the whole of humanity will be enlightened.\nCan foresee that we are reaching a stage of calamity\n18. Individual progress on the path to enlightenment to better the world\nAvoiding the forthcoming catastrophe through love.\nHow to dive deep within through meditation\n19. Develop the heart quality and expand the awareness\nStart on the meditational path of your natural tendency\n20. The question of time and timelessness\nFrom the angle of the absolute, there is no time – the relative aspect is measured in time.\n21. Relationship between the mind, body and spirit – it just is\nYou will know intuitively that the mind, body and spirit is all but one\n22. Predetermination indicates a certain tendency\nFreewill can be joined up to Divine will\n12. Predetermination and tendencies\nMan is master of his destiny."}, {"ref": "UK78-30", "summary": "2. How can we uncondition ourselves from samskaras (impressions)?\nThe mind is patterned – conceals the real ’I’ – these patterns have to be removed\nPattern of cause and effect is perpetuated – we strive to find peace through various ways\n3. The more you try to get rid of samskaras, the more you create – its a vicious circle\nRise above samskaras – lessen the burden, not destroy it\nThe process is refinement of the samskaras – discipline the body first, then the mind\n4. As the grosser actions become more refined, the mind then becomes refined\nThrough meditation we infuse the inner being with Divine power – samskaras lessen\nCause and effect – not escaping but accepting what comes\n5. We are the sum totality of all past actions – created by us\nAcceptance brings responsibility – finding the inner strength through meditation\nStart by reconditioning the mind – untie the knots of samskaras\n6. With proper living and thinking, positive thinking overcomes negative thoughts\nThe balance we seek is the tranquillity between the three Gunas\nBy refining samskaras, we discard them and only pure light remains\nFacing one’s weaknesses (superimpositions) – there is no weakness, only strength\n7. Weakness (failing in man) is judged on an individual basis\nAdmission that I am weak – if weak, how can one face oneself?\nObjectify the weakness after a proper analysis – won’t admit them\nFind the causes of your unhappiness and face the causes\nMeditation is effortless but living a life is filled with effort\n8. Accept and admit to yourself and to God your weakness\nWhen one reincarnates, do you start at the bottom again?\nReincarnation is for the purpose of evolution\n9. Striving to find happiness and yet clinging to unhappiness\nThe individual ego is lost in favour of the universal self"}, {"ref": "UK78-31", "summary": "Kundalini Yoga Part 1 of 2\nPage\n2. Gururaj speaks about Pavritrananda passing over – becomes pure spirit\nSelf realised men operate on a level of pure bliss – merge away into the universal soul\nExplanation of Kundalini yoga – the myth of the coiled serpent\nBy raising the serpent you reach enlightenment? – no – symbolic\n3. Relating the chakra to lotuses is also symbolic\nThe subtle body is nothing else but the mind – the brain goes down the spinal cord\nThe real I works through the mind to the physical body – chakras are distribution centres\nEnergies are continually flowing between all the chakras\n4. Turbulence in the mind is caused by the chakras not working in harmony\nWhen energies are brought to a central point, you are not aware of the body\n5. With a quiet mind the energies gain a togetherness – one experiences the real source\nBy refinement, the chakras work in harmony\nThe subtle nerves, the Ida and Pingala are the means for the energies to flow\n6. To give the energy an extra spurt to clear blockages, you infuse prana through pranayama\nPranayama clears up blockages and at the same time produces a rhythm\nThe blockages are samskaras which reside in the chakras\nBy activating the chakras, you are dissolving the samskaras\n7. Chakra related to sex – celibacy - walking in the path of goodness – excess\nIndulging in excess one is depleting one’s system of energy"}, {"ref": "UK78-32", "summary": "Kundalini Yoga Part 2 of 2.\nPage\n2. Kundalini Yoga\nInstinctive quality in us has been distorted by the mind\nTotal abstinence can lead to all kinds of inhibitions and repressions\n3. Myth of raising the Kundalini – pure symbolism – energy is forever flowing\nAction of prana on the central nerve, the Sushumna\n4. While shifting energies, the areas around that chakra are deadened\nThe fourteen knots along the Sushumna – blockages - untie the knots – dangers\nThrough meditation, we try to create a harmony between all the chakras\nComposition of the mind\n5. Activating forms of Prana and Uphana – contrary motions keep us alive\nLiving a profligate life – the effect on the spiritual self and karmic level?\nProfligacy is from the mind – inner urge is to find goodness, love - conflict arises\nMental turmoils are projected outwardly\n6. Living life positively we emanate positivity – we attract positive forces\nMan is becoming more irresponsible – blames everyone else\n7. Learning from our mistakes – Gururaj never gives advice\nMistakes in marrying the wrong partner – missing knowing the real person\nJust your ideal – refining our inner self\n8. Marriage fails because of lack of acceptance – permissiveness – the generation gap\nAcceptance leads to tolerance, patience, understanding and then on to love\n9. Arranged marriage little or no divorce rate - why? Attitude.\n10. Acceptance and its sister qualities of tolerance and patience."}, {"ref": "UK78-33", "summary": "2. Shakes and twitches in meditation\nKundalini untying the knots leading to pain is not true\nReaching the subtler levels leads to greater joy – closer to Divinity\nStirring up the energies without proper guidance can lead to pain – psychosomatic\n3. Unfoldment means we are drawing from deep within\nWhen duality is lost, universality is experienced\nBeing on the right path, being sincere and earnest you will find that peace and joy\n4. Feelings of having experienced the moment before – energies drawn together\nWhen integrated, momentarily the intuitive part shines through\n5. The past and future exist now – thinking in a linear fashion\nExperiencing the subtle level – the force permeates the conscious mind\nLeading to remembrance like a dream\n6. At death one’s whole life is flashed before your eyes in one moment\nWe cling to the conscious mind and that is why we suffer\nPeople live in the past or in the future\nAll knowledge is inherent in you – all Divinity is within\n7. Everything is here and now – man contains everything that is existent\n8. Explanation of the Parable of ‘The Ten Talents’ – Scriptures misinterpreted\nWe must use the abilities we have – they are Divine gifts to us\n9. The gifts were given according to what we deserved – everyone is given\nIf we don’t use the power of grace fruitfully, it is taken away\nThere should be no fear of the consequences – what can happen?"}, {"ref": "UK78-34", "summary": "2. How to open our hearts?\nHeart is the sum-totality of your feelings and emotions – has a universal quality\nProper way to open the heart is to go beyond the mind – no mind interference\nThe heart doesn’t require opening\n3. Stimulate the heart – the mind opens and the power flows through\nThe nature of the heart is to love and to send forth love - love for the sake of love\nThe idea is not to think about love, just feel love - state of innocence\n4. Self satisfaction is a delusion\nWhen we know ourselves, real love is experienced – else playing games\nPositive affirmations and good living is conducive to experiencing the real heart\n5. Self surrender and acceptance required in the discipline of life\nFinding our faults or blockages, we do something about them – leads to surrender\nThe evil to be resisted is the negative forces within ourselves – our shortcomings\nRadiating auras – subtle energy – emanations coloured by positivities and negativities\n6. To open the heart, we have to go through disciplines – then act\nWhat requires remodelling is our minds, our thinking processes\nThe path of spiritual growth is the path of love – all Masters teach this\nMan’s evolution – finding darkness and suffering, instead of light and joy\nFacing the light and not accepting evil – by accepting our faults and acting on these\nPositive affirmations and good living is conducive to experiencing the real heart"}, {"ref": "UK78-35", "summary": "2. Realising one’s totality, while meeting family obligations?\nSublimation of the ego, the ego reaches a finer level, becomes more transparent\n3. The universal self shines through the individual self – both coexistent\nTo live responsibly, the ego (personality) is necessary\nEgo remains as a very fine current through which universality flows\n4. The purpose of meditational practices is to clear away the dirt from the ego\nReach a stage where goodness remains without trying\nAvatars coming into the world consciously because of the world’s need\n5. Every pure thought strengthens the purity\nNever more than seven self-realised men in the world – else an imbalance\nResolving conflicts – take the ego to subtler levels\nFrom silence we come and to silence we reach again\n6. The Universe functions on the principle of creating a balance\nIf the ego were not there, you wouldn’t be aware of conflict\n7. A self-realised man merges away into the Absolute when he dies\nThe finest traces of ego remaining disintegrate\nConsciousness too is within the realms of relativity – is limited\n8. ‘Isness’ is experienced by itself – ‘I am that I am’\nHow to relate to children as meditators?\nExplain things according to the child’s level of understanding – not analysing\nBest way to teach is by example – it feels the love\n9. A child understands touch more than anything else – closeness – being held\nChild feels demonstrated love more – wrapped in love."}, {"ref": "UK78-38", "summary": "2. Individual’s non-binding actions – are animals actions non-binding?\nThe only creature that is not in bondage has gone beyond the laws of relativity\nBig Bang Theory – propulsion of primal atom – evolved state – into silence\nMan’s mind is so limited – small glimpses of the vast continuum\n3. Concept of detachment and non-attachment – finding unity in diversity\nNo retrogression – how primitive man developed his gods\n4. Man is regarded to be a high symbol of evolution because he can think\nPrimitive man’s basic needs – acts with will – fewer needs\nAs the intellect developed, needs increased – added karma\nGood and bad karma – the Gunas always present\nProper living, self-help, meditation, discrimination can lead to greater refinement\n5. Cosmic Consciousness – mind recognises what it is – separate from the absolute\nThe mind has to be expanded to see the entirety, the source\nMove on to God Consciousness and then to Unity Consciousness\nYou become the light and all separation ceases\nSurrendering one’s will to Divinity?\n6. Bundle of samskaras – the ego of man is his personality\nChanting – pranayama – benefits and meaning\nFlow with the current of nature and not against it\nRelationship of the small will to Divine will – reaching the goal\n7. Benefits of coming on Courses\nWhy suffer – there is always hope and love\nFarewell and prayer, ‘The Great Invocation Prayer’\n8. Mind body and spirit is one continuum\n9. Scriptures say that man must realise that he is essentially Divine\nPower of positive affirmations – positive force\n10. Chant – learn to stand apart from the world and yet be part of it\nExperiencing Divine love in relationships\n11. Marriage and divorce – deep need – magnetic attraction\nFulfilling a need helps a couple to unfold.\n12. Qualities of a woman as a mother"}, {"ref": "UK78-39", "summary": "2. Difference between a self-realised and an enlightened being\nThe self-realised man has moved from duality to unity\nStill governed by the Gunas but his life is dominated by Sattva, light – only sees light\n3. Energy generated by the seven self-realised men preserves a balance\nImbalance is drawing down an Avatar to earth\n4. Only one of the seven Avatars takes body at one time – the other six are forces\nThe eyes are not open to recognise an Avatar – judging\n5. Qualities of an Avatar – has gone beyond the laws of opposites etc.\nDoes not require homage – allows it for your benefit – he is beyond it\n6. Rhythm of the universe – has no purpose, but the rhythm itself is the purpose\nThe intellect functions linearly – thinking the gross and subtle are separate – interpenetrating\nNo need to look for Divinity – language is limited – many dimensions\nSeeing everyone as light – becoming the light – the awareness has expanded\n7. Practices help to reach the ultimate dimension – one becomes dimensionless\nReaching the absolute, then everything is more real than real"}, {"ref": "UK78-40", "summary": "2. Gururaj’s relationship with Pavritrananda – ‘He that finds purity in bliss’\nDeep suffering in poetry – great feeling\nThe story of the Ramayama\n3. With his guru Brahmananda, Pavritrananda found the meaning of renunciation, non-attachment\nStory of Gururaj’s first meeting with Pavritrananda in Bombay,\nHe looked at him and something happened\n4. Gururaj’s visit to Almora Ashram to meet him – “Why did you come?”\nWhen asked to pick up papers – meaning, ‘Pick yourself up’ dawned on Gururaj\nGururaj always looking for something in his early days, ‘Not this, not this’\n5. Early in life a guru gave Gururaj a practice to draw circles – the significance\nGururaj’s first meditation – two hours long – golden haze afterwards – oneness with universe\n6. Meaning of the golden haze? – ‘I don’t know’ – meaning find out for yourself – proper teaching\nReading certain books – confirmation of what was already known by Gururaj\n7. Gururaj’s search for God – wanting to be a monk – his dharma was to teach\nAdvised by his guru to get married and then teach householders\n8. The finger pushing him on – his heart strain through over-work\nGururaj’s visit to Pavritrananda when he was dying\n9. Pavritrananda’s comments to Gururaj, ‘You have come to release me’ – ‘You are my guru’\nTotal oneness – no separation – true guru chela relationship\nGururaj’s experience on the plane when Pavritrananda passed over\n10. Pavritrananda had developed humility and self surrender through service and devotion\nGururaj meditating on the oneness while Pavritrananda was merging into that oneness."}, {"ref": "UK78-41", "summary": "2. What is service – the various kinds of service\nOffering is the real basis of serving – allow it to flow\n3. With no sense of return – performed with love for the sake of doing it\nOther forms of service – helping worthwhile charities – motivation?\nTrue service is an offering without motive – effort becomes effortless\n4. Work for the sake of others – motiveless\nMeaning of Namaste – forever bowing to Divinity\nThe offering becomes spontaneous – be oneself and not the image\nWe are the glorifying expressions of Divinity\n5. All problems in life stem from freewill – individual life\nOffering is not martyrdom – originates from fanaticism – escapism\nA guru can show you the path – service to him is as to a friend\n6. A guru just gives, gives, gives – devotion to one’s dharma\nRelationship between the guru and the chela – be worthy of his teachings\nDoubters – good to doubt – from the mind\nGururaj chants a prayer in honour of Pavitrananda\n7. Gita recites a poem in honour Pavitrananda"}, {"ref": "UK78-42", "summary": "2. How do we bring unity, oneness & wholeness into our lives practically?\nSeparateness causes friction. Friction causes unhappiness.\nNatural laws try to bring everything together – from being fragmented, lacking purpose\nMan is trying to harmonise his mind body and spirit to function as a wholeness, a oneness.\nWith a one-pointed mind, conflicts tend to cease, life assumes a different happiness quality.\nImpressions, gained through lifetimes, can be in conflict. That is the origin of all conflict.\nDraw on the superconscious. This proceeds through the subtle layers of the mind first.\n3. Our minds are influenced and we think we have independent minds\nTherapists using hypnosis on susceptible minds\nPractise self-help from different angles – drawing energy – dirt rising – facing ourselves\nAll leading to oneness – refined quality permeates our entire lifestyle\nNot just operating within the laws of nature – develop an independent mind, one pointed\n4. No such thing as altered states of consciousness – you cannot alter consciousness\nRealise that all this is a continuum – then we know the oneness of everything\nWhen man realises that ‘This is all’, he has reached unity consciousness\n5. A teacher must be regular in his practices – a teacher must teach\nThe sub-conscious mind is forever turbulent. The mind has the reach of the entire universe.\nThe conscious mind is incapable of bringing the three Gunas into balance.\nOn the path, people are afraid of losing their independence – story of the frog in the well\nPeople have tried various unnatural means to achieve this balance. The result is\ntransference of conflict without resolution. Some withdraw into silence thinking they can\nescape the conflict.\n6. How best to serve a Guru? Devotion to him or worship?\nA guru does not require signs of devotion\nDevotion is a subtle force that radiates from a person – a show is not necessary\n7. With the oneness between guru and chela, how can devotion exist?\nA truly realised man is beyond all praise and blame, beyond evolution\nHe allows devotion for the sake of the chela – to become one with his ideal of devotion\nDevotion becomes one of the paths, Bhakti Yoga, to reach the abstract, the absolute\nOthers can follow Jnana Yoga, the yoga of analysis\nOthers can follow Karma Yoga, be good, do good."}, {"ref": "UK78-44", "summary": "2. Attaining states of cosmic consciousness, God consciousness, being born close to that state?\nParents are just a vehicle for children to be born to evolve – right genes\nWhere does life begin?\n3. The millions of souls interpenetrating all the time – ready to be born\nThe entity is contained within the sperm that is to be born\nAt conception, life is there, the soul is there, as are all past samskaras of previous lifetimes\nHighly evolved soul does not require parents of a high calibre to be born to\n4. Parents don’t choose their children, children choose their parents\nSense of gratitude for being a parent to God – they only think of the surface values\nMan can be born at a very high level of consciousness\nNever more than seven self-realised men on earth – like light, these are seven aspects of Divinity\n5. Person born in a realised state like Christ? – didn’t teach until over the age of thirty\nA teacher is born to teach – spiritual master with a mission to teach – his dharma\nThe story of Milarepa – his guru breaking down his ego\n6. Difference between a free soul and the other states of consciousness\nFour states i.e. waking, sleeping, dreaming and Turiya (beyond all three)\nThere is only one state beyond – all other states of consciousness are intertwined\nReaching cosmic consciousness some of the mind is involved – have not reached Turiya\nCosmic and God consciousness are two aspects of the same thing – matter of emphasis\nThe cosmic C. puts emphasis on thought, while God C. put the emphasis on feeling\nWith the intensity of feeling ‘I must be one with that’ – that is unity C. (Turiya)\n7. Meaning of Jivanmukta, the living free – totally liberated\nThe body is an impediment to living in unity consciousness\nThe Avatar has the freedom to merge away but returns\nThe Jivanmukta has become one with the personal God and has the freedom of the Impersonal God\nGururaj is asked to explain the yearning that was pushing him on – not a desire\n8. The yearning is an all consuming process which defies intellectualising – like a Koan\nWe are clarifying the mind – then the rest happens automatically\nSeparation – losing one’s mind? Refining the ego"}, {"ref": "UK78-46", "summary": "2. Experiences in transcending and coping with fears?\nMan fears because he fears to lose himself – form of dependency\n3 False confidence – feeding the ego with false values\nBasis of fear is self-preservation – face life and then go beyond it\n4. We replace one negativity with another negativity – vacuum\nEgo is trapped and requires an outside power to change the positivity e.g. a friend\nBy bringing a calmness to the mind, you are linked to the universal force\n5. Objectify the problem – hand it over to the guru – it loses its sting\nIn every adversity there is opportunity – two men digging holes – different attitudes\n6. Using karma yoga to get rid of fears – the impermanency of the ego\nFear is nothing but a shadow – progress can only start by facing yourself\nFacing yourself, admitting your insecurity, accepting it, ‘What do I have to do?’\nReason for judging, criticising or condemning – false boost – I am better than him\n7. Going to the deeper layers of the mind, one’s actions become more powerful\nGetting glimpses of the ‘Isness’ of Divinity through meditation\nReflecting the light of Divinity outwards\nWhy look at the surface turbulence – surrender the problem to the higher power"}, {"ref": "UK78-47", "summary": "2. How to pray effectively? The purpose of prayer? Is it useful? – achieving results through prayer\nVarious benefits of prayer, psychologically, physiologically and spiritually – always advantageous\n3. Power of prayer depends on how calm the mind is – achieved by meditation\nPraying for personal benefit – wishful thinking – looking for miracles\nDivinity is a law that governs the natural laws under which man functions\nPractical prayer – idea will just come to you – prayer has been answered\nPurpose of prayer is to achieve a result – selfless motive – all people interconnected\n4. Power of thought – Gururaj getting contract signed – Divine power behind the thought\nUnderstanding the interconnectedness between God and man – then man can surrender\nSeparating oneself from the problem – seeing a different perspective – inspiration comes\n5. Deities are symbolic and help to focus the mind – attune the mental forces to obtain things\nYou answer the prayer yourself – self-surrender – power of thought can achieve anything\nOccultism – people deluding themselves – hallucination\n6. Other worlds functioning at very fine levels – Brahmaloka\nMan can experience these fine levels by refining his mind through meditation\nPrayer is thought – when mixed with a feeling of the heart becomes more powerful\nPeople in the world who can do no wrong – their mind is imbued with a subtler power\nSage requesting ‘O Lord, give me more power to be more devoted to you’\n7. Prayer becomes a way of living – true prayer is an offering\nAstrology – depends on the astrologer’s intuition – astrology so popular in the Press\n8. Truer answers can be found by using one’s own intuitive powers through meditation\n‘Do not worship false Gods’ – they are the Gods\nPosition of stars at birth have some connection because everything is interconnected\nDive within yourself and just know and feel what is right\nStudy the direction you are going and do not rely on fortune telling\n9. Beings sending us energy? Lower or higher beings?\nHow stable is the person receiving the energy – what is the purpose of this?"}, {"ref": "UK78-48", "summary": "2. Use of symbols and how can we protect ourselves from harmful stimuli ?\nThe symbolism of symbols – a picture emerges - concrete or abstract forms\nAbstract things have to be brought to their symbolic value – e.g. in love, the beloved\nUsing a statue or a picture as a symbol – Christ having a sad face\n3. Symbol becoming real to you – statue of Kali – concretising the abstract into a symbol\nWords in Sanskrit are concretised forms of the abstract or vibration in tangible form\nProtect ourselves by strengthening the mind and not being susceptible to the stimuli\n4. Strength of the mind is at the subtler levels – reached through meditation practices\nGrosser influences are automatically warded off\nMind searching for joy and happiness – we play sport for the joy we experience\nPeople seeking a symbol status e.g. large car, impressive house, etc.\n5. Preconceived symbols – idea of the perfect husband – a projection of the mind\nUnreality is brought to reality and after being fully used, taken back to its essence of unreality\nThe guru is a symbol which must be discarded but the bond of love remains eternal\n6. Having a non-divided mind while repeating the name of God?\nThe benefits of having a one-pointed mind\nUsing positive affirmations in a clinic to help patients get better\nNot just a verbal affirmation but with all energies focused on it\nHaving an open mind co-existing with a onepointed mind\nA closed mind is a bigoted mind, a channelled mind in a rut"}, {"ref": "UK78-49", "summary": "2. How to understand the ego and how it overshadows our inner self\nThe ego knows itself by itself – do we possess an ego? – you are the ego\nTrying to develop an understanding with the ego – use subtler aspects to overcome grosser\n3. Matter or energy cannot be destroyed – same for the ego – make the ego more transparent\nThrough evolution, the individual has gathered grossness\nInstead of the primal selfless being, it changes into a selfish being\nDeludes himself into thinking ‘I am separate from everything else’\n4. The origin of samskaras, impressions – dissolution and re-creation – fine currents at play\nBecause of evolution, man wants to reach back to original fineness – wants to refine grossness\n5. Surrender and acceptance – self satisfied and not wanting to refine the ego\n6. Illusion of laziness in spiritual progress\nThe Gunas will push one forward to become one with eternity\nIs it healthy to feel you just observe all occurrences, no matter how painful or blissful?\n7. Fine line between observing and just standing by\nObserving implies understanding – having empathy with the sufferer\nIs there separation experienced in chanting by standing or observing?\nChanting is totally different – recognition comes of the absolute self within\nOne appreciates the steadiness of the inner self which observes the ego self\nBy knowing separation exists, oneness can be found"}, {"ref": "UK78-50", "summary": "2. Gita tells about living in California\nSetting up a National Organisation in the US – description of the various centres\n3. Newsletter – letter on love and growth sent out to all meditators\nHugh starts explaining the pronunciation of thirty Sanskrit words commonly used\nPronunciation of Mantra, Pranayama, Tratak\n4. Pronunciation of Gururaj, Shakti, Ananda, Samskara, Chakra\n5. Pronunciation and meaning of the various chakras, Anhata, Manipura\n6. Pronunciation of Swadhistan, Sahasrara, Ram, Manipura, Muladhara\n7. Pronunciation of Karma, Dharma, Shanti, Namaste, Bhakti, Kundalini\nSushumna, Darshan, Brahma, Atman, Satsang\n8. Pronunciation and meaning of various Spiritual Names\n9. Misunderstanding that those close to the guru benefit the most\nNo need for physical proximity – contact on the heart level\n10. Time pressures on Courses – Gururaj needs to have certain people around him\nGururaj busy all day on Courses – at Satsangs some understanding is gained\nIn Darshan, a great flow of love – the guru emanates energy forces – like a laser beam"}, {"ref": "UK78-53", "summary": "2. Violent experiences in meditation?\nExperience is a recognition of something that has happened – already in the subconscious\n3. In meditation bringing to mind experiences already existing\nNot the actual happening but the impression left – pain or pleasure\n4. Meditation is an easy way of cleansing the ego self of these impressions – refining the self\nComparison with dreams and nightmares\n5. Through practice, experiencing the subtler aspects of one’s mantra\nReaching the area of bliss until one becomes bliss – self-realised\nDreams and their value as a release mechanism\n6. Not having experiences in meditation does not mean no progress made\nStory of man thinking his meditation wasn’t helping him\n7. In teaching we are helping ourselves\nWe teach the practice and theory of meditation – a teacher’s dharma\nThe bond between guru and chela is an eternal spiritual bond\n8. Gururaj says the prayer ‘The Great Invocation’"}, {"ref": "UK78-54", "summary": "2. Peace, understanding and realisation only come from within – inherent in you\nKnowledge is given to you by the guru to make you re-discover who you are\nHelp there to awaken that which is already within you\n3. The teacher shows you the way to restore balance and harmony\nThe ego saying one doesn’t need outside assistance – pride\nMan finds unhappiness and regards it to be permanent\nEgo is just a collection of impressions – is impermanent – ideas forever changing\n4. Acceptance – meditation helps – life has become dependent on a conditioned mind\nWith acceptance, comes humility – surrender to a greater power\nInterdependence of the relative with the absolute\n5. Maya – existence being a dream?\nGod exists because you exist and you exist because God exists\nDifference is only of name and form e.g. moulding a figure from clay\n6. Making decisions in life – do we really make decisions?\nAchieve balance – choose what appeals to you – will always be evolutionary\n7. Freewill is a Divine gift to mankind\nChoosing the path with greater suffering may be more evolutionary\nOther way is to surrender oneself to Divine will\nIn the quiet deep state of meditation, the answer just dawns"}, {"ref": "UK78-55", "summary": "2. Different aspects of illness – relationship of illness to karma and how to cope\nPsychosomatic diseases – positive affirmations\nThe real cause of illness is due to conflicts in the mind\n3. Quality of life – person living the life of the living dead\nBalancing factor of the laws of nature – conflicting ideas creating illnesses\n4. Mind being susceptible to suggestions – positive or negative\nCreating unnecessary tensions over trivial things\nIllnesses – inadequacy – the sense of insecurity – the feeling of guilt\n5. Physical expression rather than a mental blockage\nStory of a man in hospital worrying about his family\n6. Over-usage of tranquillisers – covering up the cause\nMeditation can cure many diseases – mental origin\nTreating a person holistically brings a balance – combining all sources\n7. Life is a game – how to play it?\nDelusion in thinking it doesn’t matter, win or lose\nRegarding life to be a game is a sign of imbalance, madness\nNeed to have no real attachment – play for the sake of playing\nWanting to win is filled with selfishness – not a game anymore\n8. Thinking of oneself as a puppet, one really plays the game of life\nI am not the doer, and I am not the deed\nNothing is separate – one stage – all are puppets\nLife is but a play for the wise but the unwise must take it seriously"}, {"ref": "UK78-56", "summary": "2. Is it necessary to go through the joys and pains of life to reach enlightenment?\nBig Bang – minute atom propelled forward – tranquillity – three Gunas active – vast explosion\nAtom has gone through pain and joy\nOuter expression not a true reflection of that within\n3. You relive pain because the pain or emotion has not been resolved\nStory of trying to find the happiest man on earth\nReach a state where happiness does not elate and sorrow not deflate you\n4. Warring of opposing impressions causes turbulence, which is suffering\nNot necessary to re-experience all past impressions to achieve equilibrium\nNegative deeds can be resolved by doing good deeds\n5. Through meditation we gain the energy for self-integration – to better our lives\nTo whatever action we perform there is a reaction – can re-style it\nReplacing ten seconds of negativity with eleven seconds of positivity – credit balance\n6. So simple to lead a spiritual life, an integrated life\nGoing beyond heaven and becoming one with the Father."}, {"ref": "UK78-57", "summary": "2. Talk by Robert about background of establishment of BMS\nExplanation of the techniques and how meditation is not a crutch\n3. Information given about Gururaj, his childhood, family life, background etc.\nDetails of the Preparatory Teaching\n4. Amrit speaks about taking over the running of AMS in America\nHe talks about setting up the new structure for the movement in the US\nHe explains the details of the Emblem\n5. What are the mechanics of love?\nPhysical attraction is one of the components of love\n6. Love is a quality that shines forth – wisdom and knowledge\nTo know what love is, one needs to expand the awareness\nAwareness of the universe – still separation – heart expands – losing the ego\n7. You feel the totality of the object – being self-centred we don’t know what love is\nReaching the stage where one loses one’s individuality\nPrerequisite of love is to be able to lose oneself – two people looking in the same direction\n8. Most people love because of either a need, a sense of security or a sense of dependence\nWhere oneness is achieved then you know what love is\nThrough meditation, the awareness expands, heart opens - dirt washed away – greater joy\n9. ‘I think I love’, saying this negates the word love\nWe reach a level where love becomes a reality – real love is permanent"}, {"ref": "UK78-58", "summary": "2. Amrit answering questions for the group about meditation\nHe explains the Preparatory Practice – how Gururaj derives a mantra\n3. Is meditation a replacement for tranquillisers, drugs etc. and what are its benefits?\nMan is forever escaping from himself because he cannot face reality\n4. Escaping into drugs produces dependence – meditation is the opposite\nMeditation leads to greater integration, to independence, then life becomes more joyous\n5. Eternity is unchanging while the mind is forever changing – the multi-layers of the mind\nThe subconscious is only ten per cent – the other ninety per cent comprises the entire universe\nThe serious effects of drugs on the mind – altered states of consciousness\n6. Details of the benefits of meditation – improving the quality of one’s life and the environment\nDrug taking leads to fragmentation – meditation leads to integration\n7. Drug taking contributes to all forms of grossness\nHelp available for drug-takers from meditation – becoming one’s real self\n8. Seeing the result of choices before making the decision?\nOnly the present – no past and no future\nExercising freewill – tendency\n9. Combining freewill with Divine will\nMisuse of freewill produces friction which is suffering\nMeditation gives us the strength to face our weaknesses, to help ourselves\nAcceptance – flowing with Divine will – decisions are already made, don’t have to make them.\n10. Gururaj says the prayer ‘The Great Invocation’"}, {"ref": "UK78-59", "summary": "2. How to let go of spiritual greed?\nOne force wants to let go of the ego, while another wants to preserve it\nThe two forces at war leading to conflict which causes all the suffering\nMotivation behind the desire for unfolding can be devolutionary\n3. Everything we do contains desire – convert it into a sublimated desire\nStory of the young doctor – his desires had changed – not for myself\n4. Gururaj’s advice to the young doctor on how to develop his practice and the consequences\nThere has to be effort and discipline in daily living, not just practising meditation only\n5. Use your resources in helping humanity – not just repeating ‘I am desireless’\nBy thinking less about yourself, you are reducing the importance of your ego\nWanting a vision of God is a desireless desire – not ego-building\n6. The importance of service to humanity – rids one of negativities, greed etc.\nWorking for the sake of work – meditation is no good on its own\nHard work, discipline etc. of those running a Course selflessly\nMeditation generates a force which must be given self-expression in outward activity\n7. Do not fight negativity – convert it – the meaning of ‘Resist not evil’\nUnderstand the motivating factor behind the desire\nWe are trying to become selfless – service to man – leading to non-attachment\nRe-direct the energy to a different channel."}, {"ref": "UK78-60", "summary": "2. Man has to reach the equilibrium where all the Gunas are acting in harmony\nReaching Jivanmukta – freedom – karma has no affect – ‘I am still’\n3. Reaching the stage where the Gunas or the laws of nature have no effect\nMan’s mind coloured by light as through a filter\nSubconscious experiencing nothingness in sleep\nIn sleep, the ego is not conscious of itself – closest to Divinity in sleep\n4. Dreams are not to be interpreted literally – are impressions from various lifetimes\nThe states of waking, sleeping, dreaming and beyondness (Turiya), the state of being\nIn meditation going beyond the mind, we realise that we are part of entire existence\n5. Cosmic consciousness – realising the vastness but feeling apart from it\nGoing further, combining the heart and the mind – core of the personality is Divinity\nMoving on to God consciousness – interconnected and experiencing Divinity\n6. Individuality melting away into universality\nSamskaric elements disintegrate and merge away into areas where most needed\nUnity consciousness – higher stage, totally freed, you become one with Divinity\n7. Divinity then re-expresses itself in another cycle of existence\nGoing through periods of pain and depression, what can one do in practical terms?\nRealise I am responsible for it – right attitude of mind – not escaping from it\n8. Invoking a higher force to lift the depression – work out a plan\nAnalysing the cause, then infusing action into analysis – the strength within me."}, {"ref": "UK78-61", "summary": "2. Relationship between prana and the three Gunas\nBreathing is a grosser manifestation of prana, the vital force, life force\nWhen prana inverts itself into the universal mind, we find the three Gunas\n3. Life force is the primal manifestation and condenses itself into the Gunas\nHow creation came about – a universal mind splitting into atoms – activated by the vital force\nActivity of the Gunas – attraction and repulsion – prana is in everything even in the dead\n4. Concept of the Personal God and its attributes e.g. ‘God is kind’\nExplanation of Pranayama – creating a rhythm – state of pulsation of the universe\nEverything is forever in activity – attuning ourselves to the rhythm of the universe\n5. A person being in unity consciousness identifies himself with suffering\nHe is totally identified with everything happening in the universe\n6. Suffering is not felt by an Avatar because he is the centre of the universe\nMan suffers because he clings to that which is forever changing\nA real teacher feels your suffering – Jesus, ‘He suffered for your sins’\n7. He is aware of the turbulence, the suffering but not affected by it\nMan’s mind deluding him into thinking he is suffering – change the perspective\nAll this must pass – what we put the emphasis on?"}, {"ref": "UK78-62", "summary": "2. Personal beliefs causing us problems – belief is a mental conditioning\nMaking a belief materialise if the will is strong enough – analysing beliefs\n3. Trust is the counterpart of belief – nowadays people don’t trust – always want proof\nBelief is acquired by trust and trust is accompanied by faith\nDifference between acquired knowledge and wisdom – knowingness\n4. Sixth sense - knowingness – every mind is connected – pick up other’s thoughts\nWhat we want is experiential knowledge – knowingness – intuition\n5. Ashrams – your own room is the finest shrine – the best is within your own heart\nYou need the guidance of a qualified guru – he helps to go within yourself, not to an Ashram\nQualities of a true guru – he still has a trace of ego\n6. If going to an Ashram, you need to stay for months under the guidance of a true guru\nA true guru knows what is required for you – Gururaj’s experience with his own guru\n7. Find the place of retreat within yourself\nWhen a man reaches enlightenment, are all his desires fulfilled?\n8. Desire is only known by the mind – once enlightened, you become everything\nPutting limitations on Divinity by desiring\nSelf-realised man knows the essence of everything – everything is fulfilled – has no desires"}, {"ref": "UK78-63", "summary": "2. The apparent cruelty of nature - red in tooth and claw?\nMan’s thinking ability - misusing it - discriminating between good and bad - karma\nThe functioning of the Natural Laws - causing changes within the unconscious mind\n3. Instinct tells an animal their present form of existence is ending\nDarwin’s theory of survival – up to the animal stage, no karmic attachments\nWhen starting to meditate, one tends to move to more refined foods\n4. Concept of Ahimsa – not just physical killing but every hurt inflicted\nSurvival is a natural instinct in everyone - trying to preserve the ego\n5. Comparison of animals and humans in working hard - humans are lazy\nThe suffering we go through is because of our thinking ability - all amplified\nComment about ladies going to a party with identical clothes\n6. Man has created needs outside the Laws of Nature, causing friction which is suffering\nHow to handle greed arising from anxiety and insecurity\nWords - using words with feeling - words express thoughts, emotions etc.\n7. Everything is moving in circles - the universe is but a circle\nThe idea is not to escape but to move to a higher circle\nGetting out of the present groove, like the ox cart - the stone appears as suffering\n8. Becoming relaxed – more reflexive – move to where there is no circle\nDissect the problem and you will find it baseless\nNo problems – just stones on the path to wake us up to be alert, awake"}, {"ref": "UK78-64", "summary": "2. Meaning of, and how to surrender to Divine will? – small will flowing with Divine will\nSuffering results from the misuse of free will\nDivine will expressed itself originally by individualisation\nAct of repulsion forces is free will - it is the reverse of the attraction force of Divine will\n3. Man not suffering, just the abrasive quality of free will – both free will & divine will always coexist\nWith surrender put the emphasis on Divine will – you are not destroying free will\nSurrender is an ‘Isness’ - refinement of the ego – nothing is impossible\n4. Friction arises because you try to separate yourself from what is\nAccept ‘I am that I am’ - more friction due to separating oneself and then having to return back\nSurrender is not just a matter of trying - it is automatic\n5. Surrender has a permanent quality – it just happens like love, comes from the heart\nFree will is a reflection of Divine will - ‘Thy will be done’\nThe concept is so simple – already surrendered – acceptance\n6. One meditates to flow with the Laws of Nature – discipline required\nGaining the energies through meditation and not using them is wasteful\nThese gifts must be used for the benefit of others and to achieve balance\n7. Are women lower evolved beings needing more enlightenment than males?\nThe importance of women in society – their qualities etc.\nSeventy percent of meditators are women – being complementary to men"}, {"ref": "UK78-65", "summary": "2. The mechanics of healing – not being receptive to healing\nThe interaction between healer and patient\nFirst area of healing - bringing about organic balance using medicine – Doctor doesn’t cure you\n3. Second area – phobias e.g. lady fearful of using an elevator – Gururaj helping to overcome this fear\nThird area – impressions on the upper layer of the subconscious\nFourth area – impressions embedded deeper down in the subconscious\n4. A spiritual healer can channel subtle energy to the deeper levels of the mind\nA good healer is a clear channel – energy is a balancing factor\nNot removing samskaras – healing is harmony – the energy filters through everywhere\n5. Meaning of ‘Faith has healed you’ – opening up to the healing energies\nThe reservoir of spiritual energy is limitless – healer gives of his entirety\n6. Patient draws whatever energies are required to bring about balance – pool of water\nQualities of true healers – proper channels for Divine energy\n7. Tuning oneself in while being healed by using one’s mantra\nMagnetic healing – the magnetic healer conveys a power but not a spiritual force\nNot being a channel, he can transmit his own energies, which may be dirty\n8. Recommendation to consult a doctor as well as having healing\nHealing outside BMS – the tuner is the mantra – BMS is not a firm of healers\n9. Spastic child helped by a healing from Gururaj"}, {"ref": "UK78-66", "summary": "2. Gururaj’s Namaste photograph – does he become an idol of worship by using it?\n‘I am nothing - It’s for you to realise, not for me to tell you’\nTechniques are needed to help a fragmented mind.\n3. You have the freedom of choice – of accepting the guru, his teachings etc.\nEveryone is led to a realisation of himself, reaches the area of Isness\nNo worship involved – I salute the Divinity within – all are Divine\nGuru shows the way, you have to see it yourself – judge the tree by its fruit\n4. True teacher is more ordinary than ordinary – servant of humanity – humility\nEternal truths never change – you need to realise their real meaning.\n5. God is love and we can express that love in many ways\nAttributing meaning to events – are all happenings engineered for one’s progress?\nHelp and guidance from Guardian Angels?\nGuardian Angels are created within the framework of your mind – voice inside\n6. Making the right decision spontaneously - actions leading to good\nCelestial music is within, there to enjoy – the mind creating the existence of every thought\nHow poetry is created – thoughts floating around\n7. We can give Guardian Angels a reality and they can be seen\nIll omens - conditioning of the mind with beliefs – child’s death – pain felt because of attachment\nRelationship of parents to children – motivated love etc.\n8. Comments about death – lament after a death – due to a sense of guilt\nReflection of our inner self\nReal love is perfect – there is no such thing as parting"}, {"ref": "UK78-68", "summary": "1. Amrit mentions a Self-help Programme which is being prepared\nGita speaks about life in California\n2. Gururaj speaks briefly about pain from physical parting – truth remains\nThere is no coming, no going, there is no life there is no death, only ‘Isness’\nI am always with you, always have, am and always will be.\nGururaj says the prayer, ‘The Great Invocation’"}, {"ref": "UK79-1", "summary": "2. Religions help us to understand what life is all about\nTrying to find that which is higher than oneself – the mind cannot grasp it\n3. How to find the meaning of truth, the meaning of life?\nUsing meditation to connect the left side of the brain with the right side\nThe mind is universal – only one mind – how clear is the subconscious to allow the light through\n4. Through meditation, we go directly to the superconscious level, to find the light\nStilling the left side and activating the right – opening the channel to wakeful alertness\nUsing meditation to reach the level of greater awareness\n5. The heart – the level of knowingness that does not use the mind\nThe meaning of love – incapable of analysing love\nWith the heart and mind the extent of the superconscious can be experienced\nThe light shines through as the window is cleaned\n6. The story of the servant girl and the King – ‘Whatever you touch is yours’\nWhen every action is spontaneous then you experience the oneness with everything\nOur lives are governed by superimpositions – that is why perceptions differ\n7. Story of the monk and the pregnant girl\nOne has to go beyond the conflict of daily life, beyond the law of opposites\nThe superconscious mind has to be empowered by Divinity\n8. Concept of the Personal God – it is needed to know the Impersonal God\nThe suffering of Christ – from totality to littleness – Avatars come to activate the world\nGod is love and love is God – Personal God has will,\nImpersonal God has no will – just a force\nAvatar coming to earth to bring a balance to the imbalance caused by the minds of men\nChrist died for our sins – true meaning is He is showing us the way\n9. Story about the man opening the soft drink can with a can opener\nMeaning - All the tools for evolution, for our peace of mind are inbuilt"}, {"ref": "UK79-2", "summary": "2. The meaning of acceptance, is surrender necessary and part played by devotion?\nIn the Serenity Prayer, looking at strengths and weaknesses and accepting them\nAnimals act by instinct – instincts have to be disciplined\n3. True discrimination comes about when we are quiet and silent\nSelf-acceptance requires discrimination and responsibility – ‘I am responsible for all I do’\nI create the circumstances around me – drawing negativity to oneself\n4. Being responsible for our thoughts and actions – not blaming others\nSoul taking birth – children blaming their parents – bringing own children up well\n5. The burden is of our own making, ten percent is real, the rest is imaginary like fears etc.\nAcceptance brings us to our primal simplicity – one’s self importance is imaginary\n6. Carrying the imaginary burdens leads to expectations\nExpectation is the father of disappointments and disappointments the mother of suffering\nGururaj’s time working in a restaurant – no expectation there no hurt\nWe produce the unhappiness – all around us is just a play\n7. Projection causes the suffering – the whole world is conditioned\nWe develop a sense of devotion, an expression of joy – the focus of that devotion\nDevotion is the joy that wells up in the heart – then nothing hurts\n8. You can’t create devotion or love – always comparing – feeling inadequate\nPeople having needs in life – going beyond interdependence to surrender\n9. Surrender is the natural outcome of the mergence of two hearts\nTeachers are focal points – surrender to Divinity, not to the embodiment\nThe image on the Turin Shroud – not Christ wrapped in it\n10. Why talk of the reflection when you can have the real light\nKnowing the Personal God, we can reach the Impersonal God\nWhere everything is nothing and within the nothingness is everything"}, {"ref": "UK79-3", "summary": "2. Christ’s many miracles and healings, was he taking on the sins of the world?\nThere are no miracles – why didn’t he heal all those crippled?\n3. Jesus was the focal point for persons to gather the faith to heal themselves\nStory of the search to find the wisest man – test of opening the door lock\n4. If you are not receptive, you won’t benefit from shakti – no miracle will happen\nThe Divine force is ‘miraculous’ if the person has faith\nPut the emphasis on ‘Am I worthy for that grace’ and not on the grace or the miracle\nHealing brings about wholeness – no one can take over a person’s karma\n5. Judging a Master’s actions – emanating a force – he helps us to better ourselves\nBad karma is not taken away, he smoothens the path – good karma is enhanced\n6. Drawing that grace or shakti helps to unpattern the mind\nOur minds open up, awareness develops and the light shines through\nTrue Masters by showing the way, help to alleviate our suffering – perspectives change\n7. Opening up to the spirit of the teaching, grace, the reaction becomes smoother\nWe are the ones that can change our karma, no one else\nThe teaching of the great Masters are eternal, cannot be improved on\n8. Masters feel the pain of others – having compassion – exist as a living presence\nDivinity permeates everything – all we do is play\nGetting a glimpse of the vastness of the glory of Divinity like happened to St. Paul"}, {"ref": "UK79-4", "summary": "2. The significance of Christ’s crucifixion and resurrection\nCrying out on the cross, he felt his teachings had not been appreciated – had died many times before\nThe pure consciousness in Jesus could never be killed – there was no crucifixion or resurrection\nThe lesson from it - to be one with the Father, the body and mind must disappear\n3. The symbolism in the hidden meanings – parables – no death – immortal soul is life\nSymbolism of the cross – combining the relative with the absolute – that is existence\nIn meditation we approach the absolute\n4. Wanting to know why our lives are empty – become centred\n5. Know the value of the living God\nThe mind is peripheral while the real self is in the centre\nJesus offered himself so mankind could benefit – his teachings have matured with age\n6. He had very few followers – he taught to go beyond the mind, go to the heart, become innocent\nWe are born over and over again – concept of death between two heartbeats\nMan is not made to suffer, he is divine – as Divinity is joy, he should be joyful\n7. Ego trying to impress with one’s possessions – clinging to the little ego\nLiving here and now is re-creation – is a new moment – then you truly love\nWe go back to the source, not the reflection – that is the resurrection of daily living\n8. Forget the knowledge, forget the wisdom of Christ, just experience the love\nComments about the Communion Practice"}, {"ref": "UK79-5", "summary": "2. The seeming paradox between devotion and non-attachment\nDetachment is to become reclusive – escapism\nOne could be totally devoted to an ideal and yet be non-attached to it\nDesire produces attachment – real motivation behind the act – inflating one’s ego\n3. Emotional needs – dependencies are attachments – producing karma that rebounds on you\nDivinity knows our needs – ‘Who am I to demand?’ – refining desires to become desireless\n4. Flowing with the laws of nature – motivation behind a desire – if ego-centred, becomes binding\nSelf-acceptance of one’s true value – Gururaj devoted to his chelas for the sake of devotion\nTeachers expecting results – ‘No I but He. I am not the doer’\n5. Perform one’s dharma in life and the results come\nGratitude for the privilege of being an instrument for Divinity\nHow can we recognise the ego and how can we go beyond it?\n6. We don’t need to find the ego - the mind is the ego and the mind is patterned\nWhen the ego is stretched, the inner spiritual light shines through – impressions are refined\nDoing this with meditation, recognising our short comings and doing something about them\n7. With the help of meditation and grace, the ego self expands and assumes universality\nExpansion of the ego is expansion of awareness – other dimensions all interpenetrating\nMaya, me and mine – illusion too is reality – opposites – comparisons\nWith the expansion of the little self to the universal self, we know what life really is, we start living"}, {"ref": "UK79-6", "summary": "2. Frequencies of vibrations – the universal frequency in the soul\nFeelings in plants – animals function on an instinctive level – their evolution is progressive\n3. Spiritual Practices helps us appreciate the highest form of frequency that exists within\nVibrations are the same inside as outside – the state of unity\nConcept of mutual attraction – operating on the same vibrationary level\nIn the Communion Practice, not experiencing anything because the mind is analysing\nThe heart is blocked from flowing – the Divine force must touch the highest form of vibration within\n4. Meditation helps to heighten your own vibration so it lasts all day\nEmphasis on the shadow or the light? – become absorbed in the light\n5. Reaching the highest form, you’re oblivious of the lower forms of vibration\nThe absolute has no vibration – ‘The word was with God’ – not apart from the words I speak\nOne’s reaction to a painting, of beauty or ugliness\n6. Kindness and compassion is an expression of love\nUnderstanding the Scriptures comes from opening the heart\nExplanation of Kriya Yoga as referred to by Yogananda – a ritualistic practice\n7. Rituals – attuning the mind to the Deity – dangers – idolatry\nBuying flowers personally, you can show so much love – Karma Yoga\nRituals are good for training one’s mind – mood producing"}, {"ref": "UK79-7", "summary": "2. Explanation of what the soul is – individualised life force with samskaras\nSoul is that entity contained in the subtle body empowered by the spirit, as prana\n3. Explosion occurs, particles fly out – its where the primal atom gains its individuality\nWith the propulsion gained, its aim is to merge back to the source\nA stone has the power to change – the atom is its life force – has limitations\nA plant has feelings, a stone doesn’t – is a higher form of life, has a little consciousness\n4. Instinctive process in animals – an animal just is\nMan’s thinking ability – trying to get rid of preconceived ideas – blind beliefs\nTo unpattern the mind, man uses discrimination, the gift of reasoning\n5. Spiritual practices help us to bypass the patterning and go to the base of pure innocence\nMan calls himself the soul and limits himself by thinking he’s all that exists\n6. The journey of the soul – cycle after cycle – that is what is eternity\nWe go through sufferings watching just changes in shapes and forms\nWe have to rise above the changing forms and become the observer\n7. The stages to reach the stage of Divinity"}, {"ref": "UK79-8", "summary": "2. Questions from teachers – in America using Sri Ananda instead of Gururaj Ananda?\nGururaj promises to stop the malpractices in America on his next visit\nSomeone being so happy, thinks she doesn’t need to meditate?\n3. Difficult to do a morning meditation? – do pranayama first\nGood to do Hatha Yoga as it revitalises the inner organs\nMantra ‘Aum’ – do not use it, as it takes one away from world activity – use own mantra\n4. Reasons for not using a simpler technique than the Prep Technique\nNeed to do basic technique for six months – it’s more than just a relaxation method\n5. Teaching pranayama after a person has their Full Techniques?\nTeaching people with mental problems – what age to teach children?\nDetails of the Pregnancy Technique\n6. Prep Technique causing illness? – rare – tensions in their bodies come to the surface\n7. Dangers of hypnotism – can affect people due to negative thoughts of the hypnotist\nTeacher counselling people? – ninety percent of people come with some form of problem\n8. Problem of new meditators developing a dependency on the teacher – need to be firm\nAutomatic reflexes experienced in a relaxed state?\nGururaj stresses the importance of using ‘Gururaj Ananda’ and not ‘Ananda’ as a mantra\n9. Strength of the movement is in gurushakti – the link or channel to the guru\nWe are not selling our wares – people have forgotten God – the degenerate state we are in\n10. We are teaching meditation as an offering to Divinity, a service to mankind\nWith gurushakti they feel the presence of Divinity that is within\nWe show them the right path but they have to find their own means to reach home\n11. Gururaj will insist that ‘Gururaj Ananda’ is used in America and not left as optional\nBenefits of using gurushakti – not a guru cult – the meaning of Namaste\n12. Reasons for young people not getting benefit from meditation?\nTeachers not to be upset by people dropping out – low drop out rate in BMS\nUse discretion when to give an explanation about using ‘Gururaj Ananda’\n13. How to deal with people on drugs – they won’t tell you – we want honesty\nAfter starting meditating, the need for drugs and alcohol becomes less\n14. Smoking being harmful? – it’s another addiction\nDiscussion on when to introduce gurushakti when teaching the Prep Technique\n15. The importance of chanting and people not coming back after being asked to chant\nPeople should be encouraged to chant – explain the benefits to them\n16. Start the new meditators off chanting gradually"}, {"ref": "UK79-9", "summary": "2. How to judge how much effort is required?\nDefinition of effort – most important is the attitude to what you are doing\n3. Effortlessness – procrastination – seeing too much work makes one lazy\nApplying a system in our lives, we do not notice the effort – washing the dishes over and over\n4. At first discipline is required to establish a pattern –\nWith proper planning, the attitude changes\nWith the right attitude, the whole question of effort fades away – meal becomes an offering\n5. Very few people love their jobs – wrong mental attitude – have to put effort into the job\nStillness permeating effort and thereby effort becoming effortless – a joy, playing a game\n6. Making the effort to sit down to meditate requires discipline, then no effort required\nMeaning of spiritual unfoldment – spirit is forever there – removing the veils, the misconceptions\n7. No need to dig into past problems, just allow the subtle energy to clear the blockages\nPsycho-analytical path of dissecting problem after problem – need for ongoing sessions\n8. One can draw from deep within to regenerate one’s attitude without analysis\nA mystic can help you to share the joy and bliss he experiences – the sting is gone\nProblem is that man doesn’t recognise who he is – ‘I am Divine’\n9. People are allowing their minds to overshadow their hearts\nGoing to deeper levels, the light from within shines through the conscious mind\n10. Through discipline, meditation and helping oneself, the real unfolded spirit is experienced\nThe reflected glory of God in relative existence\nNot having an object of devotion\n11. Comparison of attractiveness – stop analysing, digging up the dirt in the mind\nCouple meeting, functioning from the heart level and not analysing with the mind\n12. Description of the Eastern system of courtship\nLove grows in time – with acceptance, all the other virtues follow"}, {"ref": "UK79-10", "summary": "2. Conception and birth – at what point does the soul enter?\nWe are all porous - souls floating around through you – attracted to that similar\n3. Instant liking for a person means thought forms are conducive to both\nThe soul is in the sperm – aura or magnetic force where only one will find its destination\nWe choose our birth to work out our karma and to reach back to the primal source\n4. The soul chooses the environment conducive to its development – parents just instruments\nChildren in a family not being alike – one born with qualities that will push him forward\n5. For the soul to evolve, it has to have a body\nMeditation affecting the foetus – Eastern custom for looking after a pregnant woman\nFood, thought, emotions, actions by the mother have an affect on the foetus\n6. The importance of women in the household and in society – their qualities\nWomen are a reflection of tenderness – men are hard, logical, calculating\n7. Divine mechanism for a woman to issue life – can’t be done in any test tube\nNo traumatic pain for a child going through birth – intellect not developed to feel pain\n8. A mother should not miss her meditation or prayers or get upset"}, {"ref": "UK79-11", "summary": "2. How can we know something until we experience it\nIntellectual understanding is an experience in itself\nVarious levels of understanding, levels of intellect, levels of experience\nThere is nothing in life which is not an experience\n3. Recollection is an experience – conditioned happenings – false and real experiences\nOne is advised to chant if feeling depressed – get into that higher vibrational state\nUsing affirmations to change a person’s thinking to feel better – mental conditioning\nThe power to give the experience comes from the subtle level\n4. Need to clarify the mind to find the true experiences of ourselves\nLet me be angry with anger, then you have the true experience of anger – valid\nHaving the true experience of hate, you know the true value of loving and love\nReaching the stage of being love itself – does not come from mental probing\n5. Dream states – experiences in the dream are real in that dimension\nProphetic dream – rehashing an old memory – nothing is ever new\nNightmares – a release of samskaras formed in the mind\n6. In the waking state we condition our experiences, not so in a dream – valid\nCreating love to negate the experience of jealousy – replace darkness with light\n7. Everybody dreams – only self realised men don’t – no samskaras to express or release\nParadox of the three layers of the mind are the experience and the vehicle for it\nThe impersonal self does not experience anything – permeates the three layers\nSo many different conceptions of God – dragging pure energy through dirty layers of the mind\n8. The real ‘I’ exists within itself – other parts of the mind require a force or energy\nWe are trying to reach the source – then all experiences cease for the relative self\nThen the real self-experiences experience itself"}, {"ref": "UK79-12", "summary": "2. How can we develop the affirmation made when we received our Full Techniques\nBe truthful to ourselves and to others – not to hurt anyone\nTell the new Initiate to try to do his best – no deep philosophies at the start\nIt’s a turning point in his life to pursue the path of goodness\n3. As he goes deeper in meditation, his awareness of truth will also expand\nPlans for IFSU and BMS? – no plan, planless – an open mind – no dogmatism\nUnfoldment is based upon love and truth – the two injunctions – I love you\n4. An analogy of tasting the sweetness of sugar – experience it to know what the force really is\nThe aim of IFSU is to spread the message of love to as many as possible\nThese manuscripts are to last six thousand years and they will\n5. No interested in numbers – just to relieve the suffering of people – painful to see it\nTeachers helping them – allow the kingdom of heaven to come to those who are ready\nTry it, feel the benefits – belief turns into faith into knowingness – know what ‘THAT’ is\nShowing the path – person may not be ready but will find their way there later\n6. To be simple, to be ordinary, to share – the more you share, the more you get back\nThe prep teacher is most important – direct link to the new meditator\nGreatest service is to put a person on the path of truth\nThe togetherness, discussions etc. at Satsangs – a sharing of problems\n7. Different understanding of the tapes as years go by – a process of assimilation\nI need your help desperately – I don’t have many more years to live – sheer willpower\nGive whatever help you can render in spreading the message – do it"}, {"ref": "UK79-13", "summary": "2. Comment on a quotation from the Bhagavad Gita, “Be devoted to me, come to me”\nKrishna had realised the real ‘I’ within – come to the real self that is me\nReach within yourself through meditation and find the eternal existing reality\n3. “Surrendering all the laws” means go beyond the Gunas\nTo become still during meditation doesn’t mean to blank out the mind\nFor this age, the path of devotion and love is necessary to lead one to the Divinity within\nThe meaning is to unfold the heart and the spirit – then Divinity is open to you\nReview of talks given during this Course – how the mind functions – psychoanalysis etc\n4. We are drawn to the Personal God who has attributes\nPolicy for IFSU and Societies – only use the mantra ‘Gururaj Ananda’ in Prep Technique\nNot worship, just a bond of deep love – three reasons for using this mantra\nVibratory effect – has the power of heightening vibrations in the room during teaching\nDangers of using other words as mantras – need for consistency\n5. Link between the new Initiate and that which Gururaj represents\nNo mental processes in IFSU – we approach things from the level of the spirit\nAll Societies in IFSU are not to introduce any psychological techniques\n6. No practices are going to be used unless they are approved by Gururaj\nTrying out new kinds of practices hasn’t worked out – they may have felt good for a while\nNo new philosophies should be introduced – they are distractions\nGuest speakers can be invited – they are acceptable as they may give a new viewpoint\nThey are not to come and give lectures and then give their own practices\n7. The service to mankind in organising a BMS Course is an expression of love"}, {"ref": "UK79-15", "summary": "2. The difference between discernment (discrimination) and judgement\nThe basis of discrimination is to evaluate – can be deluding\nShankara seeing the rope as a snake, with a conditioned mind\n3. The small ‘I’ is subjected to illusions – the greatest is the illusion of self identity\nWe can stretch the ego to allow the light of the real self to shine through\nShankara saw the surface value first, the illusion, Maya – unified state\n4. Divine energy is in everything, stone, rope, snake\nTry to awaken the intuitive qualities – intuit in a sense of knowingness\nWith the inner self-filtering through, the discriminatory part of the brain stops judging\n5. Judging – projecting what is in my own mind – motivation behind the act\nProper discrimination can only come from expanded awareness, a wider view\nWith meditation the rational and intuitive parts of the mind are brought together\nAt the centre there is no imbalance, nothing to judge\n6. In finding the harmony the question ‘Is there a God?’ is answered – the harmony in Divinity\nDiscrimination is the basis of Jnana Yoga – reach the region of no mind\nYou can only stop judging if you can really love\n7. Man must experience what life all about, what Divinity is all about\nDiscrimination must be discarded at the stage where love and devotion grow – Bhakti Yoga\nStory about the man using a can opener to open a soft drink can"}, {"ref": "UK79-17", "summary": "2. At what stage does the soul become subject to the Law of Karma\nMan’s responsibility for animals and plants? – motives - why people like animals\nConcept of the soul – everything in the universe contains life-force\nYou are the soul, as are plants and animals\n3. The three parts of man form the soul, while the spirit is the universal spirit, karma free\nThe universe came about because of the emanation from the spiritual self – stone having life\nThe plant has evolved more where it can feel pain – plant’s sensitivity to love – a oneness\n4. Oneness where tears well up – exchange of deep life force – also happens to plants\nA plant has the power of receptivity and response – also with animals – more advanced form\n5. Man’s ability to think – the difference – Gururaj’s talk is spontaneous to demonstrate creativity\nTraining animals – missing link is not to be found on this planet – we think we’re unique\nConcept of evolution from animal to man in other planes of existence – thinking ability\n6. Man aware of its needs, starts individualising, assuming the ego sense, ‘I and my needs’\nMan comes to this planet to find the meaning of ‘Who am I?’ – due to awareness of me and mine\nAbilities of the primitive man – could sense things we can’t – closer to his real self\n7. In his search externally, man created Gods – wanting to know answers – religions began\nCollecting experience on the way – the soul is a bundle of samskaras – in every cell\n8. Patternings leading to conflicts, we are responsible for pain and pleasure –\nWe are subject to the 3 Gunas\nWe meditate to reach the primal state of peace more quickly, smoothly – away from turbulence\n9. With greater awareness, man finds no separation between stone, plant, animal and man\nBy reaching the centre quicker, you become master of the universe, but we like to be slaves"}, {"ref": "UK79-18", "summary": "2. The science of Tantra is to transmute all actions into something refined\nThe meaning of the word ‘Tan’ is the expansion of one’s consciousness\nOne should have total awareness of every action one performs\n3. Start with awareness of the physical body and go to that of the subtle body\nTantric teachings contain various teachings including Vedantic teachings, Puranas etc\nThe basis of Tantra is to find that wholeness, the unified state\n4. Greater emphasis is placed on the female side of creation – Shakti and Prakritti – nature\nDominant characteristics of male and female – alternative counterpart in oneself\n5. Equalness – man and woman have their own dharma to perform\nPsycho-yogic practices are performed – include all forms of yoga\nTantra is not for today\n6. One draws the subtler force within oneself into a oneness so that one is lost\nThe aim of Tantra is to elevate one’s energies to a heightened awareness\nSects practising Tantra – a degeneration rather than a sublimation\n7. Tantric contribution to art – very symbolic – worshipping Kali\nIdea of the manifestation returning to the Manifestor – the Black Hole concept\nDestroy the shadow and you destroy the light – two aspects, male and female of all creation"}, {"ref": "UK79-19", "summary": "2. Gururaj continues to talk about Kali\nWhen balance is disturbed, the forces combine, evolution occurs – reverts back to a Black Hole\nExplanation of the dissolution and recreation of the universe\n3. The unified field – the universe reaches back to the static state of stillness – to sound\nThe Black Hole starts pulsating again, creating the universe again\nContributions of Tantra to science etc\nDevelopments in science were based on intuitive sight – yogic visions – made by experience\nDetails of rituals of Tantra – preparation time for love-making – pranayama and meditation\n4. Further details of Tantric rituals – to create a certain mood – to integrate oneself\nFree of emotions to transcend into the realms of spiritual values\n5. Using the sex act to experience the bliss of oneness found in Samadhi\nTantra has been debased and abused by the Leftists\n6. In Tantra the awareness is heightened and all the differences in one’s ego disappear"}, {"ref": "UK79-20", "summary": "2. Siddhis – moving objects by thought power – dangers because of the imbalance it produces\nAll Masters condemn Siddhis – emphasis should be on achieving integration\n3. Acquiring these powers has nothing to do with one’s spiritual self\nComments about the progress made by meditators through doing their practices\nBenefits of meditation – developing powers of intuition, latent powers - helping ourselves\n4. By developing the Siddhis, you bolster the ego instead of expanding it\nWhat happens after death? – The body disintegrates into its components\n5. The subtle body with all the impressions carries on – just a bundle of samskaras\nAt the moment of death, every moment since birth becomes alive, flashes past sequentially\n6. Conditioning the mind that you are going to be joyful after death in the subtle body\nBy meditating, the joy and bliss felt in the spiritual body is more intense\nAt death you’re witnessing your own light outside yourself – not a cosmic light coming to you\n7. After death experiences - projections of the mind – these appear to be a reality\nAfter death, one starts evaluating memories of one’s entire existence\n8. In the subtle state, one evaluates the best way to clear the dirt – man judges himself, no-one else\nIn that state without a body there is no evolution no progression – the mind is needed to evolve"
