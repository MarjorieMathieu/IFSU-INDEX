still and know God\nRealising that Divinity is so close, the jealousy that makes life a misery disappears\n‘I lived in the body of Christ’ - there is only one consciousness\n8. The laws which keeps everything together, laws of nature - see the beauty all round\nA variety of jokes"}, {"ref": "UK85-5", "summary": "1. Summary of content\nPrayer in Sanskrit before the Golden Thread Ceremony\nUsing the energised Golden Thread, meditations will go deeper - helps to increase awareness\nSpecial initiations with Golden Threads for each one present\nThe meaning of ‘That which I am seeking, I am’ and ‘I do not need anything’\n2. Devotee saying ‘Lord I want nothing. Give me greater ability to worship you and be devoted to you’\nHow can I ask for anything when you and I have become one\nStory of the King and the maid-servant touching the King, thus gaining all his possessions\nSo touch the inner self and you have everything - wishful thinking about material things\n3. Using the Golden Thread one can have greater contact with the real self\n4. Comments regarding the Midnight Special which is taking place that evening"}, {"ref": "UK85-6", "summary": "2. Gururaj sings his own composition in Hindi - his name, Preatam - yearning for God\nMeditators tell of their experiences during the Midnight Special\nSeeing stars - heart pounding - tightening sensation etc\n3. Not always pleasant experiences - it’s a cleansing process - hearing Gururaj giving advice\nSeeing Gururaj in blazing gold - wondering was it a statue\nAnalysing the experience results in losing its meaning - extend your heart to me\nFeeling on fire yet with tremendous peace and a cool breeze - getting rid of anxieties\n4. Like a Communion Practice, face changing - feeling hot - changing colours, ending in white\nHeat is the purification of the body and then cool or calmness - give your problems to your guru\nDo Gurushakti and the answer to your problems will dawn on you\n5. Pinpoint of light like the eye of a needle - present in the room physically, perfume, golden light\nPeople crying or laughing during Group Practice - release of tensions - do not disturb others\n6. Sending healing thoughts or projecting love needs no permission as it’s unselfish\nRequest to learn how to know your guru - something happens in your heart, a spark\n7. You feel God’s grace flowing through the guru - Gururaj gives complete freedom to go or come\nRead good books and compare them with what the guru says - truth is eternal\nYour guru has a naturalness, an ordinariness - sits on no pedestal - normal, natural\n8. He has found unity with Divinity - details of the Ayurvedic system of medicine\nStories of church leaders sitting away from people - others are inebriated\n9. Using the healing properties of plants instead of synthetic drugs\nHow to deal with pain and ill health - send healing thoughts using a blue haze\n10. Gururaj is just an ordinary person who has realised God - he teaches of his experiences\nHow a mantra is derived - a mantra is never changed but becomes finer with practice\nTM give out mantras based on age and sex - their charges are based on economics\n11. No guru can show you God but he can show you the path on which to reach God\nYou will come across someone in the next life who will give you back your mantra\nRequest for a tailor or a dressmaker to make some shirts for him\n12. Mention of the Communion Practice taking place that evening."}, {"ref": "UK85-7", "summary": "2. Communion Practice\nYou will go through experiences during the practice - relax and don’t concentrate, just a gentle focus\nAfterwards Gururaj speaks about his journey through the universe and becoming one with it\n3. The beauty of the experience - he had to come back to teach, to put people on the path\nTrue masters have to come back because of the pull to earth - when evil rises, they return to earth\nComments about the content of the book ‘The Path of Unfoldment’, dedicated to the Eternal Wanderer\n4. In different places Gururaj teaches in different ways\nComments about their experiences during the practice by those present\nFeeling peaceful and not tearful - colours are an expression of the deeper levels of the mind\n5. A flowing feeling, seeing yellow over Gururaj’s head with a gold band - sign of peace\nFeeling sad and seeing a purple light - no such thing as astral projection\n6. Burning tears - seeing a deformed hand with a crucifix - severe pain\nNo strong visual or feeling experience, just peace - no experience needed for some\n7. Having no experience could result in a delayed reaction later\nEveryone present has been touched by the hand of God\nLife will never be quite the same again for those in the room\nA fun loving guru - laugh and the world laughs with you"}, {"ref": "UK85-8", "summary": "2. The importance of the Prep Teachers - a direct link to the public - serving humanity\nHelping mankind and putting them on the path to Divinity - inviting friends to a talk\nGratitude to Peter for training teachers - a welcome anywhere from the worldwide family\n3. It’s no good calling yourself a teacher if you don’t teach\nHow to deal with confusion produced by excitations in the mind\nDifference between excitation and agitation - many illnesses stem from the mind\nLearn to observe, which chanting teaches you and watch the small ‘i’ in action\n4. Find control over the small ‘i’ and then there won’t be excitation or confusion\nExcitability may be due to a nervous condition - one never sees Gururaj excitable\nAchieve mental tranquillity by meditating\n5. If you are excited, start chanting to calm yourself down or do Pranayama or use your mantra\nJokes - comments about the finer qualities of a woman"}, {"ref": "UK85-9", "summary": "2. Everyone to meditate at 6pm on Sunday evening - set a place at the dinner table for Gururaj\nPlace the flower which is given out, on a while plate and see what happens\nPeter reads out the Initiation Prayer\n3. Group chant the Gurugita from the Initiation Form\n4. Explanation of different types of healing - how to distinguish between desires and true goals\nOnly one universal mind - no individuality - only one existence which is Divinity\nA Spiritual healer is only a channel to draw grace and pass it on - like a tap providing water\nThe guru is the generator that captures grace and passes it on\n5. Dangers of magnetic healing - the healer can project his negative energies on to you\nDangers of hypnotism and auto suggestion - the human mind can be influenced\nThe mind is susceptible - implanting suggestions - not if you meditate\n6. Desires come in many forms - desireless desire - selfishness of most desires\nHave desire but not selfish desire - you produce the misery - joy comes from elsewhere\nSelfish prayers have no value - payer is an art - never demand for the self\n7. Deserve and your demands will be met - never bargain with God\nDesireless desire is for the benefit of others - it is returned to you tenfold\nYou get what your mind creates - remaining poor and alternatively attracting prosperity\n8. It’s simple to become a master of your own destiny, master of your own mind\nGururaj presents the profoundest wisdom as simply as possible\n9. Various jokes"}, {"ref": "UK85-10", "summary": "Recommendation to send Newsletters to the Council to copy and send out to meditators\nShakespeare’s ‘The Sweet Sorrow of Parting’ - we’re never really parted\nThe spirit is linked - as mortals there’s a twinge in the heart\nDevelop the realisation that God is always with you\nThis thought will take away all your miseries - ‘The force is with you’\n2. Talk about the next BMS Course and the Courses in Canada and the USA\nEveryone is encouraged to increase the numbers attending the next BMS Course\nReminder about the flower being given out to be put on the table at Easter"}, {"ref": "UK85-11", "summary": "2. Giving a new practice, experiencing warmth in the Anhata Chakra - moving the mantra down there\nDifference between looking and seeing - stare into space, then look - seeing what is inside you\nMore difficult to receive than to give - following and listening to the inner voice\n3. Best way is not to listen to the inner voice - let it speak by itself - the mind interferes\nThe mental process will stop you hearing it - it’s an intuitive knowingness\nThe inner voice is in reality silence - synonymous with guidance - it just guides you\nYou are giving nothing - the little ‘i’ says it gives - don’t give but offer\n4. Gururaj speaks about the Cultural Centre Project in Cape Town\nRefused a donation from someone who wanted a plaque erected in his honour\nAs soon as there is attachment, there is no value in giving - who is giving?\nThe small ‘i’ which is the cause of all suffering becomes smaller\n5. You do not possess anything - the giver is always the receiver if it’s offered to Divinity\nDevelop the sense that the world is illusory - attachment is the true illusion\n6. Attachment causes the misery - we suffer through having to learn the hard way"}, {"ref": "UK85-12", "summary": "2. Communion Practice\nGururaj asked to speak about the Holy Grail - offshoot of Jesus’ family living in France is a lie\n3. Importance of colour and its use in spiritual healing - the mind functions verbally and in colour\nGururaj helps Mike who has a problem with his leg\nGlastonbury being a holy place because of its energy - Atlantis and the exploding crystal\nParts of the crystal are at nine points on the planet\n4. Over-usage of Vallium in a Capetown suburb - limitations of medical doctors - guess work on their part\nWhere there’s a mental imbalance, they give shock treatment - don’t know its affect on the brain\nSadness that honesty and truthfulness are disappearing - wishes he could get rid of suffering\n5. That education must be there inside - Jesus always portrayed as being sad - Gururaj’s picture of him\nYou are not born to suffer - change your attitude - listen to wise words and listen to tapes\nStory of the lion and the birds building a nest in his mane - how the problem was cured\n6. Meaning of true love - knows no meanness - love just is - bears no analysis\nReal love is spiritual love - a flow from one to the other - assumptions about ourselves\n7. Become conscious of the oneness between two people - a flow from soul to soul\n‘Christ came with a Sword’ to cut away your sins, bad karma - through his love - that’s repentance\nChristianity helping to advance its precepts - could be true - so many religious wars\n8. Harmony should exist between all religions - our teachings are the basics of all religions\nReligions tend to be dogmatic - all saying the same - Gururaj gives total freedom and the tools to help\nStory of a couple who left and used Gururaj’s mantras - nature of the mantra and the force behind it\n9. Mantras given out by the couple which were unsuitable - very harmful - all done for money\nRequires a true Spiritual Master to impart the spiritual force with the mantra - 75% of the practice\nHow to help someone depressed or in pain using gurushakti - tuning in to that force\n10. Forces of evil winning the battle - there’s no evil in the universe - it’s your perception\nWhere’s the place for evil to exist? - due to mental patternings - there’s no Satan\nEverything is sacred if you know how to look at it\nMeaning of innocence - inner sense - comes through awareness\n11. Innocence of a child - no ability to analyse or think - born with karma and samskaras\nBecoming child like as an adult through awareness to find no fault and see no evil\nStory of the three hoodlums giving Gururaj back his watch and money\nReason a person’s feelings are hurt is due to attachments and expectations\n12. Expecting nothing, everything comes to you - seeking happiness - no security in anything material\nStory of two neighbours quarrelling and Gururaj asked to resolve the problem"}, {"ref": "UK85-13", "summary": "2. Happiness can be found by diving deep within to find the Kingdom of Heaven\nYour true nature is to be in unity with Divinity, which we call God\nDon’t try to seek Divinity, just open up yourself and Divinity seeks you - no need to suffer\n3. Life must be composed of selflessness, not selfishness - reach the inner core through your practices\nThe soul will always be there because you are immortal - fears are based on destruction\nInstead of thinking of the body, dive deep within and find the peace that is there\n4. The purpose of Courses is to inform, educate, entertain and uplift\nThe greatest present you can receive is to live in the present\nPeople are troubled with the past and project into the future but don’t live in the present\nDemonstration of a simple old technique to relieve stress and strain\n5. Intertwining the two big toes to create an energy circuit within yourself\nCombination of energies - this throws off stress because stress is anti-energy\nThe metabolic rate drops and the stresses disappear\n6. Gururaj composes a poem about cheerfulness and fatherhood"}, {"ref": "UK85-14", "summary": "Life has to be lived in a natural flow - spontaneous and free\nThinking the world is imperfect is incorrect - God’s creation is perfect - thought processes involved\n2. Look for perfection and not the imperfection - dual vision sees conflict - opposites of sun and rain\nVariety has to be expressed in life and living - become one with existence\nBecome devoted to yourself - love yourself truly, then see the beauty around you\nYou will love others and feel more at peace - giving and forgiving\n3. Forgive yourself and get rid of guilt\nPrayers are false, just begging - putting the mind at ease\n4. With sincerity of purpose, every thought will find fruition\nDo something about yourself - it needs effort at first then the effort becomes effortless\nVarious jokes\n5. Satsang ends."}, {"ref": "UK85-15", "summary": "2. Can one analyse love and how one can use love for the benefit of others\nOne can’t analyse love - it’s a welling up of the heart - one loves because you can’t help it\nThe more you try, the less you get out of it - I love because you are me\n3. There’s no definition of love - it’s boundless - no separation if there is no definition\nMan’s limitations always find faults - the answer - I love you because of what you are\nUnity brings oneness - become one with Divinity who is love itself - not apart\n4. To find the truth of love is to find truth itself - truth means oneness\nLove knows no separation - reciprocation of love - love for the sake of love\nLove is to be forever giving of yourself in kindness, sympathy and compassion\n5. Gururaj composes a poem about requested topics, work, illusion, understanding\n6. Mention of the painting exercise and paintings being returned\nThe mind can function in words, forms, shapes and colours\nLet the mind flow and draw whatever one likes - expressing oneself in colour and shapes\nAnalysis of the condition of your mind from your painting and how your mind functions\nNot to profit from love but to express it for the benefit of others"}, {"ref": "UK85-16", "summary": "Gururaj starts off chanting in Sanskrit about the beauty of flowers to demonstrate creativity\nYou are a creature of creativity - do something each day that wells up from inside\nGururaj composes a poem about justice\n2. Creativity is an art born from within oneself - your life is beauty itself\nStart from the concrete to reach the abstract - start from where you are - being judgemental\nLove is God and God is love - love is an energy - looking at the heart of a person\n3. Love yourself first before you can love your neighbour\nLife is so simple but we ourselves add the complexities\nGururaj is so human - we are not apart, we are now here\nOne has to learn to find the Divinity within oneself\nSeek to be unified with yourself, not with God\nGet away from fragmentation to integration and then the road is easy"}, {"ref": "UK85-17", "summary": "Concept of responsibility - respond fully with ability - you need clarity of mind\nTry your best - don’t be afraid of failure - responsibility is devoid of duty\nTrue responsibility comes from one’s inner self - spontaneous action - an inner quality\n2. Joy is your inner self - pain and pleasure are temporary - true joy can only be experienced\nBe yourself to find the eternal truth within\nSearch inward for the inner self - you need outer help\nThe guru comes to show you what’s possible from his personal experience\n3. The significance of the Golden Thread - the amount of energy in it - the help from it while meditating\nMeditations are enhanced and go deeper - great power and meaning to it\n4. Gururaj starts singing a hymn in Sanskrit he composed for children at a young age\n‘Bow to the Lord of prosperity, giver of knowledge, bow to the guru’s feet, parents and the holy one’"}, {"ref": "UK85-18", "summary": "2. Starts with prayer Gururaj composed in Sanskrit in memory of Pavitrananda\nInitiations of Prep Teachers, Prep Healers, Advanced Healers and Spiritual Names\nThe importance of the Preparatory Teacher - meaning and reason for a spiritual name\n3. With Advanced Healing, people see colours with certain pressure points - cures from healings\nExplanation of the Purification Practice - One goes deeper - must be done with sincerity\nSee no evil, hear no evil, speak no evil - reason for Sanskrit words\n4. Reason for using water and the two middle fingers - second part is a repeat of the first\nThird part is a pranayama mantra, done exhaling and inhaling alternately\nThe practice ends with a prayer - must be said with meaning and feeling\n5. Rapid Fire question and answer session - definition of a mystic - he has become one with Divinity\nMysticism is so wrongly misinterpreted - mysticism involves creativity and spontaneity\nHe is a mystery to others but not to himself\n6. Sitting up straight during meditation for the energies to flow is totally unnecessary\nReasons of old for sitting upright - be a non-conformist - Hatha Yoga\nExplanation of the Non Touch Technique - only seven people have it - sensitivity involved\n7. Affected by the vibrations of strangers - healers have a protective sheath - just channels\nMeaning of non-conformity - being truly pure, nothing will affect you -\nConcept of the Jivanmukta, the living free\n8. Innocence of a child - always intrigued with beads (holy things)"}, {"ref": "UK85-19", "summary": "2. Communion Practice - explanation of what to do during the practice\nA great energy is radiated - touched by the hand of God - flow away with it - do not analyse\nGururaj speaks about coming back and seeing the sadness on people’s faces\nFinding the true meaning of existence within yourself - the two types of Samadhi\n3. You are born to be your universal self - in recognising your eternity, you are self realised\nSpiritual practices expedite the journey home - analyse yourself and look at your faults\nLook in the mirror and face yourself - seek the quality that is within, not the quality externally\nMention of the Midnight Practice and what to do during it\n4. Those present comment on their experiences during the Communion Practice\nBlue flames and lotus flower - a rosette rotating in a blue colour - head disappearing etc\n5. Feeling the life force of the universe in the hall - physical body changing into a light\nChanging faces are from previous lives - faces of Lao Tzu, Christ etc - golden aura\nFeeling of deep peace and warmth generally by everyone\n6. Reading out an unsigned poem sent to Gururaj\nDoing a painting to capture the thoughts contained in the poem"}, {"ref": "UK85-20", "summary": "2. Being natural, you develop humility - just be yourself - it’s the secret of life\nComments about experiences during the Midnight Practice\nExperience of universality, combining your heart with the hearts of others\n3. Reading out a poem and Gururaj responds with a poem on it\nSeeing a bright light, Gururaj appearing in gold - loud noise - hearing Aum\n4. Strong smell of incense - hearing Gururaj’s voice and a buzzing noise\nFeeling palpitations in the heart - consciousness of the body disappearing - a dream\n5. Feeling angry with Gururaj - just wanted to be myself and to be happy - happy to be sad\nThis was a cleansing process - basis of the teachings imparted by the guru are preserved\nExperiencing pain in the back - opening up to love - tending to pass out\n6. Normality in lovemaking - merging together - depends on the spiritual quality\nEveryone is beautiful because the real inner self is beautiful\n7. Start with the mind and say ‘I am beautiful, I am one with God’ - gradually you will realise it\nThe whole idea is to provide joy and wisdom in your life - you are total as you are\nComment that it takes more energy to frown than to smile"}, {"ref": "UK85-21", "summary": "2. Being honest and sincere with yourself - control of life and self control\nDon’t miss the joy in life - find your real self and then you find reality\n3. Every message I give is from the heart - do what your heart tells you\nGururaj composes and sings in Sanskrit about marriage before three wedding ceremonies\n4. Gururaj sings about love - expectations bring misery\nDisappointment comes from expectation - meaning of parts of the word expectation\n5. Misconception and imagination involved in expectation\nNo such thing as death - life cannot combine with death\nHis message is to recognise the eternal life within you\nGururaj chants in Sanskrit and then gives the meaning in English\n6. Wedding blessing ceremony begins\nGururaj sees marriage as a combination of two people in a carriage drawn by horses\nYour mind has total control over the horses’ reins - you gain control of yourself\nWhen the outer self is controlled, the inner self becomes internally controlled"}, {"ref": "UK85-22", "summary": "Becoming timeless - living eternity in a moment - no space or time\nMeasuring life in space and time brings misery - living in the ‘Hereness’ of life\nComments of what has been done during the Course, interpretations of paintings etc\nSerenity is brought about by balance in the mind - how to be mad\n2. Gururaj bids farewell to the group\nHe mentions where he is going next and asks for prayers for his health"}, {"ref": "UK86-1", "summary": "The body may be weak but the mind and spirit are in full force\nI show you the dreams of life - reality and dreams - dreams are just imagination\nDefining the value of life is to merge into the Divinity of life\nTruthfulness only comes when you know yourself - now you don’t live, you exist\nLife is composed of being here - imagination is only image making\n2. To live life is an art - learn to share - misery is a misunderstanding of what life really is\nStrengthen yourself through meditation so nothing can hurt you\nGururaj sings in Sanskrit and explains the meaning in English\nLife is nothing else but loving - if you’re not loving, you’re not living"}, {"ref": "UK86-2", "summary": "Loving is the true nature of a person but is covered by the cloudiness of the mind\nGet rid of impressions by purifying the mind through spiritual practices\nPurity is a spiritual reality realised by the heart\nThe secret of life is to find that purity through simplicity\nBe honest with yourself - just be yourself\nNo one is totally perfect - the principle is to love yourself\n2. Impressions must find expression - clear the mind and you find life to be happy - cause and effect\nLoving is a natural quality that just wells up - you feel the emotion of love from the heart\nThe purpose of life is to clean the mirror to find that Divinity within - let us all be love\n3. Gururaj composes and sings a song about ‘Parents’ in Sanskrit and English"}, {"ref": "UK86-3", "summary": "The concept of everyday being a birthday, a celebration - you are timeless\nSaying ‘I am somebody’ when you should say ‘I am nobody’, then you become somebody\nGururaj sings about sleep in Sanskrit and English before doing Initiations\n2. Gururaj continues to sing in Sanskrit about sins and planning - forty books of such writings\nRegard everything in life to be fun and accept life as it is\nChange the mental attitude\nInitiations start with Aum Bhur Bhuvah chant and Peter reading the Invocation\n3. The group chant the Gurugita - Initiates read the Affirmation\nThe more you give to people, the more you receive - teach, teach - only two hours a week even\nYou’re not only helping others but you are helping yourself and becoming closer to God"}, {"ref": "UK86-4", "summary": "Start the day with a song - Gururaj sings ‘You are my Sunshine’\nHow we can be honest with people when they would prefer us to be dishonest with them\nThe fault is with those people - do not be concerned - live this honesty yourself\nWe are very much influenced by the opinions of others\n2. Gururaj not worried what people think of him - honesty and sincerity become you\nNever care about the opinions of others - live a good life and live in purity\nYou will evolve and become a better person\nGet rid of the obsession with possessions - learn to own yourself - petty desires will vanish\n3. Look after the small things and the big things will look after themselves, like pennies\nIf you want to be really happy, you have to be totally honest with yourself\nGururaj composes a poem about imagination, harmony, action and time\n4. Completion of the poem and comments about being a bullfighter in a previous life"}, {"ref": "UK86-5", "summary": "2. Gururaj sings in Sanskrit and gives the English translation\n3. The lesson to be learnt is to have fun in life - no need for sadness\nMechanics of spiritual force - it’s a force we have to realise through our practices\nIt works on the purity you develop, your lifestyle, knowledge and devotion within you\nYou worry and go through misery because you don’t discriminate\nOn the spiritual path there may be obstacles but they are created by wrong thinking\n4. Sense, common sense and nonsense - sense involves the mind\nYou can only develop in life through destroying the obstacles\nLife can be made beautiful - spending money on sunglasses to remove the glare\nGururaj starts singing ‘Jai Ram’\nEach one present exhorted to bring a friend to the next Course"}, {"ref": "UK86-6", "summary": "2. Rapid Fire Question and Answer session\nImagination is closely related to jealousy - jealousy comes from a sense of insecurity\nFeelings of inadequacy - jealousy is total selfishness, so detrimental to you\n3. Mythical seven tails of Haley’s Comet - seven energies that make the world go round\nWe are forever in motion - impracticality of these myths\nLoving the outer guru - he helps you to find the inner guru - without him you can’t\n4. The aim in life is to find your self identity - discard the small ‘i’ and find the universal I\nThe guru awakens your mind with new understandings\nHe opens your heart and pours love into it\nAlleviating suffering and nervous problems by meditating\nQuestion asked about Gurdjieff - had no spiritual power, he only had imagination\n5. Because of his magnetism he attracted people that were mentally unwell\nGururaj allows freedom to come and go, not like Maharishi - his levitation technique\nA true teacher does not work for money - a person wanting healing but without making any effort\nAnswer to the question if Rajneesh is enlightened is a profound no\n6. Gururaj asked to give words of comfort to a young person injured in a car accident\nHow to get balance and harmony back in our lives when counselling people daily\n7. Gururaj is asked to help a maniac depressive who won’t come to a Course or contribute a penny\nHour of Brahman - Brahman is eternal for nothing can exist without eternity\nEverything is eternal - takes on different forms - Brahman does not exist in an hour\n8. See life as living in this moment then every moment will be joyful\nGururaj explains the Communion Practice and Midnight Special"}, {"ref": "UK86-7", "summary": "2. Initiations of teachers, healer and preparatory teachers\nDivine power is imparted to the healers for the benefit of humanity\nGururaj speaks about the Midnight Practice - what to do at that time - everyone has some experience\n3. Communion Practice takes place - Gururaj speaks about his journey through the universe\nSo painful to see the sufferings of humanity on his return - says how human he is, no different\nOnce you find the Divinity within yourself, you will find the total meaning of life\n4. Recommendation to do your practices regularly - reminder to do Gurushakti especially\nThe Group comment on their experiences during the Communion Practice\nSeeing a snake, white light, hearing the sound Aum, the light changing into stars etc\nPenetrating that which your eyes cannot see - only one light reflected like a prism\n5. A white light coming out of the top of Gururaj’s head - whole room changed - feeling of power\nThe white light seen is the radiation Gururaj imparts to all\nHoly Communion is a rare experience - no one else can do it in public\nIt’s not just wisdom or knowledge that’s imparted but the spiritual flow to bring God into the hall\nSwitching on the light so you can see life in reality, not an assumption of life\n6. Gururaj composes and sings a song in Sanskrit about ‘Union with God’"}, {"ref": "UK86-8", "summary": "2. Gururaj sings ‘Oh what a Beautiful Morning’\nThose present tell of their experiences during the Midnight Practice\nHearing Aum and chanting - sensation round the top of the head\n3. Head feeling heavy - seeing silver lights - feeling sadness for people who seemed to turn away\nSeeing a mass of tiny lights with a green colour - a healing colour\n4. Feeling a tightness in the right hand - feeling that my weaknesses are my strength\nGrotesque and ugly face on one side, beautiful on the other side with light shining out\n5. Energy and heat coming through the body - stars and lights - remembrances\nGururaj explains the part self forgiveness of past actions play in the karmic debt\n6. There are no angels but you live angelically\nRid yourself of the sense of guilt then you feel free\nPastor repeating words parrot like in church, teaching nothing\nOnly a Master can touch your heart - memories of the past will always bring problems\nLive in your heart as a king"}, {"ref": "UK86-9", "summary": "2. How to recognise Gururaj in future lives - ‘I will always be there in love and devotion’\nGururaj sings in Sanskrit and gives the meaning in English\n3. Encourages those present to bring a friend with them to the next Course\nQuestion asked by a child ‘Did you used to be Jesus?’\nIt’s not the body of Jesus, it’s the consciousness which is universal - it will go on\nReasons why the Masters descend into the world - they come to bring a balance between good and evil\n4. Once you become universal, you can be everywhere - Gururaj is also teaching on other planets\nDepends on your ability to conceive\nThe importance of contemplation, leads to concentration, to meditation\nEvery talk becomes a poem, words are rhymed and put into different metres\nOne’s understanding grows as one listens to Gururaj’s talks on tape a second time\nGururaj composes a poem about children\n5. Gururaj sings in Sanskrit"}, {"ref": "UK86-10", "summary": "2. No difference in the state of consciousness between fish and humans\nConsciousness consists of awareness - I appeal to your heart, not your mind\n3. Awareness is normally limited to your interests - have you really seen everything around you?\nPeople are not aware of the things they do - being aware brings knowingness\n4. Through meditation you become more aware of yourself\nGururaj ends off the Course with a prayer in Sanskrit\n5. Gururaj starts singing in English - swimming together\nComments about the inability of some doctors to cure people\n6. Argumentative discussion about doctors healing people continues\nComments about the person writing letter to Gururaj and enclosing nothing, not even a cent"}, {"ref": "UK86-11", "summary": "2. Starts off with a rowing exercise for getting rid of tension\nIf the body is relaxed, the mind follows suit - must we cover up the joy within\nInfuse the spiritual side into the materialism of daily life - everything becomes spontaneous\n3. Be yourself and know yourself and then you know Divinity - the real knower is within you\nLife must become meaningful - there is only life - so make it joyous filled with ecstasy\nIt’s all within you and you are all Divine beings - you will find that you are the life force\nLife, love and laughter is what you really are - live life, for life is made for living\n4. No reason to feel despondent - observe what life brings\nSurrender to life and not to the guru or to God\nBelief in God - copycat belief in yourself - it never fails - start realising ‘I am Divine’\nThen it becomes a total reality to you - you will know that you are not the doer\n5. Gururaj and the Group start singing Jai Ram\nThe oneness with Divinity is encapsuled within everyone - reflect the Divinity outwardly\nClean the mirror with spiritual practices - one sun reflected in many bubbles"}, {"ref": "UK86-12", "summary": "2. How to let go of impressions created in lifetime after lifetime\nYou cannot get rid of but you can overcome the impression through spiritual practices - substitution\nImportance of good thoughts - the mind reverts to sensuality rather than the uplifting content in books\n3. Karma is the reaction of every action you perform - the idea is to still the waves\nNo effort in the quietude - become the observer of thoughts - become the observer of life itself\nA matter of evolution - your here to learn - do your practices, have good thoughts - listen to Gi’s tapes\n4. The secret of life to make every moment useful - nothing should be wasted, example of drinking water\nThen we live in the moment - people are the living dead, living in the past or projecting into the future\nYou can capture eternity in a moment - a world of time and space - awareness of one’s body\n5. The brain is an organ to allow the mind express itself - open up more of the brain cells\nMore of the mind will flow through - only one mind - cycles of existence - black holes\nOur lives run in cycles - progression and then recession with a period of rest in between\n6. True life is in the gap in between like the gap in a movie film\nBe in that stillness - life never ends\nWhen past impressions are wiped out, you merge away in totality into Divinity\nAs we shed off the impressions with spiritual practices, life becomes brighter and more joyous\nGreater clarity comes and we see things in true light"}, {"ref": "UK86-13", "summary": "2. Express the beauty that is within you - see the Divinity all round you\nHow we can be true to ourselves and what truth is - discover the essence of yourself\nTruth is different from time to time - truth is a process of continual search\n3. People’s minds become unstable - how many thoughts are firmly planted in your heart\nTruth is within you all the time - take assistance from outside, from your guru\nEliminate the thought forms in your mind - very few of them are creative, mostly imagination\n4. People live in an illusion and forget the truth that is within\nThere is no ugliness, everything is beautiful - projection of you - lead me to truth\nEverything becomes true to you and there are no illusions - life is joyful - getting rid of illusions\n5. Everything in the world is celebrating - stand still and dance in the heart\nGururaj sings in Sanskrit about becoming lively to live life\nDiscussions regarding art and literature"}, {"ref": "UK86-14", "summary": "2. Demonstration of Bastric Pranayama to get rid of toxins - see the beauty around and enjoy life\nFind the newness in each day - the spice of life\nOnce you are enlightened, you pass on your experiences for the benefit of others\nEach Master has had to discover himself - experiences were necessary to really know themselves\n3. Eternal truths bubble out of the Masters - expressions of internal joy\nA true Master does not speak from books - he gives of his heart - no need for depth of knowledge\nRealise that your heart is a universal heart pulsating in a rhythm - a means of realisation\n4. The incarnation of pure consciousness exists in this bodily form\nThe qualities are there within you - life lived in the total joy of sacrificing\nThe impact of the senses on your mind - desires or sensual experiences are never lasting\n5. The lesson Gururaj learned from his guru was to move from the temporary and find the eternal self\nTo be happy, become childlike, innocent - just become yourself\nGururaj’s last visit to his guru and his comment ‘You have come to release me’\n6. Creativity is forever produced when the heart is pure - the origin of yourself"}, {"ref": "UK86-15", "summary": "2. The group is asked to moan and groan - the word ‘moaun’ means total silence\nPreserve the silence in the morning to regenerate yourself - one hour of silence\n3. Gururaj demonstrates how to feel totally silent and all your worries will disappear\nThe meditator describes what she sees as Gururaj presses on her eyes\n4. Meditator continues with a running commentary on changing colours etc\nFeeling calmer, totally relaxed - Gururaj does another healing\nWhat Jesus meant when he said ‘What I can do you, you can do even greater for yourselves’\n5. Walk in your own footsteps towards the sun - let life be filled with light\nYou’re carrying a bag with a burden - throw away desire and live true to yourself\nWhat you gain is how to stand still - we go from nowhere to nowhere\nWhat I teach is on the inside, from where you have really come\n6. We march on in the search to find ourselves, to find joy and happiness\nThere’s no separation between us"}, {"ref": "UK86-16", "summary": "2. Initiations - reading the Invocation, singing the Gurugita - affirmation read by the Initiates\nGururaj chants in Sanskrit and gives a blessing to the Initiates\n3. The healers have been imparted with a Divine gift of healing powers\nDemonstration of healing on a meditator - use the gift unselfishly without reward\n4. Gururaj gives another healing and asks the meditator to comment on what she sees\nChanging colours - reflects the opening up of the Ajna Chakra\n5. Group sing ‘I don’t know how to love him’ - birthday greetings\nWhy people have fever or nightmares - a nightmare is a relief valve\n6. Consciously releasing impressions from past lives in a story form\nA fever can be induced by turbulence in the mind - a physical expression\nWhat you suffer is the result of a cleansing process to get of the dirt, the toxins within\nDisappointment from expectation - accept the result - everything can be made joyous\n7. You’re born to win, not to lose - using these positive affirmations"}, {"ref": "UK86-17", "summary": "2. The Communion Practice\nExplanation of what happens during the practice and what to do during it\nJust have the experience without any analysis\nGururaj speaks about the journey and on coming back seeing the suffering on the faces\nI came down to earth again to bring you this message of love and peace - give me your sufferings\nI came to you two thousand years ago and I taught you so many things\n3. Do Gurushakti, have the picture in front and ask for your suffering to be taken away\nExperiences - tingling in the palms getting stronger - just an instrument for the power of God\nGururaj sings in Sanskrit about the power of life - gives the English translation\nYou have to find the understanding of life - see its beauty - increased creativity amongst meditators\n4. Comments about living in the body of Jesus and about Mary Magdalene\nBecoming more aware through meditation - shedding tears, getting rid of inner pain\nDon’t trod but walk along that balanced peaceful way of life\nNever forget that you’re universal\nExplanation about the Midnight Special - being together in the rooms"}, {"ref": "UK86-18", "summary": "2. Rapid fire question and answer session - Gururaj is painting a picture while speaking\nPeople who don’t have experiences in meditation - it’s unimportant - experience in real life\n3. Searching for truth using Gururaj’s teachings - follow any path\nLife is an art - everything is an expression of the life within you\nTwo souls cannot reside in the same body - concept of mergence - need to flow and be yourself\n4. Flow with life as a painting does - Gururaj starts singing\nThere’s no connection between Haley’s Comet and world disasters\n5. Experiences during the Midnight Special - seeing a castle, waterfall, colours etc\nSymbols are representations of samskaras - interpret it for yourself - the guru gives guidelines\nOther experiences related were pains in the back, seeing rays of light - feeling powerful etc\n6. Allow yourself to be receptive to new ideas - allow yourself to go\nProblem of the Aids disease - can be helped by healing - mystical explanation\n7. Transfer a force that rubs away the disease\nDetails of how Gururaj’s teachings can be spread by sending out letters etc\nIt’s up to you to spread the message of love and joy - total love, total giving\n8. Let the small self be more conscious of the real self - you are it all\nTeachers help people understand, to open their minds to greater awareness\nAll hatred and anguish will disappear because these are imaginary"}, {"ref": "UK86-19", "summary": "2. Combining breaths together - demonstration of how to stop breathing - the eternity of life itself\nGururaj chants in Sanskrit - Wedding Blessing takes place\n3. Gururaj does a healing on a person with blocked up nerves - pains in arms and legs\nDoing a stretching exercise afterwards the person finds the pain to be gone\n4. Gururaj sings and plays with the children present - does a healing on a child’s ear\nDifference between black and white magic - they don’t exist - energy is totally neutral\nYour choice to have light or darkness in your life - mixing up emotions - rise above all\nWhen are you going to learn to walk - don’t limp - feel your feet on the ground\n5. Sings ‘Onwards Christian Soldiers’ - fighting the battle within yourself - conflicts within\nConflicting emotions are created by your mind - the secret of life is to become stable\nThrough trudging in life you feel worn out - from calamity you come to calmness\nUnderstand the meaning of the way, the life and the truth\n6. The theme of the Course has been about truth, its meaning and how to find it\nBe true to yourself and realise the truth that is within you\nGururaj gives the Ajna Chakra blessing to everyone - R & J sing Jai Ram\nAnimals are attracted to Gururaj because of his innocence\nThe power of the stillness activated through meditating - flow through the purity of heart"}, {"ref": "UK86-20", "summary": "2. On behalf of the group, gratitude is expressed to the organisers of the Course\nGururaj speaks about the true blessing by letting the heart flow - handing out blessed objects\nGururaj starts singing in Sanskrit and gives meaning in English\n3. Communion Practice takes place\nI will be soon leaving the body but this heart will remain with you, in you, of you\nYou’re not apart but part of your true self - there’s no sorrow - this life is not yours, it’s His\n4. Be happy, know the joy of life and you will find the eternity of yourself within\nThere are no miracles, only a flow of life - you’re given a gift to live life\nGururaj tells what to do during the Communion Practice - gaze and don’t concentrate\nThanks for being within me, for that is where you belong"}, {"ref": "UK87-1", "summary": "1. Stay in the foreground and observe the totality of life - face the mirror, see yourself in reality\nSee the faults and rectify them - the guru is just a guide - find time for relaxation\n2. Having a smoking break - it’s for fun and brings mental stability - I am one with nature\nHug a tree or a rock - no different from you - realise the vital force in them and in you\nIdentify with the rock - identify yourself with everything - dwelling in duality\n3. Idea of life is to be totally natural - I teach not only with words but by life and action\nGroup sings ‘O Reach Alaho’ to loosen the shoulder muscles and relax\n4. A simple yoga exercise to alleviate tension and to help one to sleep better"}, {"ref": "UK87-2", "summary": "2. Group sings ‘You are my Sunshine’ - smile and put a smile on the faces of others\nNobody is perfect is wrong - how can imperfection emanate from perfection\nIt depends on how you view things - perversion of the mind - try to reach perfection\n3. There is no death, only life, an endless circle - to really live is to know yourself\nTo see perfection in others depends on my perception\nTo help someone on the verge of death, extend loving thoughts - difference between soul and spirit\nGururaj speaks about trying to find God at a young age - symbols representing Divinity\n4. Jesus as a symbol - an ordinary man - his travels to India etc - never died on the cross\nHis relationship with Mary Magdalene - he wrote three main Upanishads\nLife is fun but filled with indecisions - have determination and get rid of indecision\n5. Becoming decisive, you reduce the effect of attachments\nThese are simple home truths which need to be practised\nI teach the practicality of life and not mental theorising\nThinking is not continuous - a thought only lasts eight seconds - like a cinema film\nGururaj encourages discussion in groups afterwards on the content of the Satsang"}, {"ref": "UK87-3", "summary": "2. Group sings ‘Amazing Grace’ - through His grace we live\nThe eyes are the windows of the indwelling spirit - the spirit is immortal, pure, untouched\nExplanation of the Sermon on the Mount - state of mergence where desires and fears are gone\nIf you are ready, God comes down to you - you’re not apart, all is one\n3. Plant the feet on the ground and the head in the sky - understand the truth of the heart\nKnow the core of your personality - no sermon needed - remove the veils and be joyous\nGet rid of the dirt of samskaras through your practices, like making ghee\n4. Life is forever going in circles going nowhere - be brave, stop not until the goal is reached\nRelax so that new concepts can sink in\nEverything in life can be made into fun - depends on the attitude you develop\nSee the beauty in life that is always there - how Gururaj learned from austerities in youth\n5. You are nothing, He is everything - analogy of an onion - learn to cry\nEnjoy the laughter and the tears - He cries and laughs for me - you’re non separate"}, {"ref": "UK87-4", "summary": "2. Gururaj chants in Sanskrit before carrying out Initiations\nInitiation prayer, singing of the Gurugita and Initiates reading the Affirmation\nGururaj sings in Sanskrit with a translation in English\n3. The Lord resides in your heart, nowhere else - you need to recognise Him\nDivine love is the binding force - find the meaning of your being\nBlockage within your mind is due to conditioning - surrender yourself - let Him care, not you\n4. Gururaj talks about his life as a political rebel when a student\nComments about India, Ghandi etc - offered a position but his job was to teach\nTells the group to relax - St. Patrick and the snakes\n5. Speaks about St. Patrick and the good work he did\nGetting rid of the snakes meant getting rid of the pagans\nEverything in creation is perfect in its own way\n6. Perfection and imperfection are in the mind - see perfection in everything then you become perfect\nWhen life becomes open, you see the truth of humanity\nGrow up and become mature, find reality - it’s within you\n7. Consciously knowing that ‘I am that I am’"}, {"ref": "UK87-5", "summary": "2. Moving from the state of duality to oneness - existence itself is oneness\nDivision created by the mind leads to confusion - feeling divided\nDiversity is a creation of the mind but unity is a creation of the heart\n3. Is it wise to be foolish or foolish to be wise? - the concept of foolish wisdom\nGururaj speaks about growing up, being a student, how he found his guru etc\n4. Be regular in your Spiritual Practices and realisation will come - duality of life is an illusion\nGururaj sings in Sanskrit and English\n5. If you are innocent and pure within, you attract love\nThe importance of Prep Teachers in leading people on the path to Divinity\nThe more you teach, the more you benefit - don’t expect any return\n6. Warning about teachers giving out mantras they have copied\nDoing this is harming people and you gain nothing from it"}, {"ref": "UK87-6", "summary": "2. How to be sure we have found the right spiritual Master - you don’t find him, he finds you\nYou can never find him - he brings you close and helps you realise the Divinity within\n3. My job is to lead you closer to God - purify yourselves and it will become easier for me - it crucifies me\nRelationship between guru and chela two thousand years ago - be well grounded - head in the sky\nGururaj entertains the children around him while doing tricks with a coin\n4. Sharing and caring for others - seeing colours represents the depth of the mind - the spirit is immortal\nLove is two people looking in the same direction - become one-pointed on the path of peace\n5. Walking towards a sunrise, the shadow is behind you - the shadow is valueless - concentrate on reality\nThe universe is just thought forms which create the problems in life - become master of the universe\nIndividuality is in your imagination - become universal through your practices - having wrong attitudes\n6. Children and animals can instinctively feel purity - that’s why they are attracted to Gururaj"}, {"ref": "UK87-7", "summary": "2. In the face of any problem, sit down and relax and it will go away - story of the tiger slinking away\nTroubled by fears - facing them, they will disappear - greatest enemy is fear, a product of the mind\nFear of loss of possessions - you can take everything with you in thought form in the next dimension\n3. Gururaj sings in Sanskrit and gives the explanation in English\nWhat happens during the Communion Practice - what to do - most people have experiences\nGururaj speaks about the journey - mergence with the Father - no Father up there, just an energy\n4. Combining materialism with your spirituality - enrichment comes from inside, not from the clothes\nOpening the heart and coming closer to Divinity makes you more beautiful, not what you wear\nGroup told to relax - having fun together as well as giving knowledge and wisdom\n5. The truth of life is not strange at all - it’s common sense - real sense and nonsense\nGet into nonsense where no sense is left - the importance of nonsense"}, {"ref": "UK87-8", "summary": "2. Innocence is the greatest quality one can possess - Rapid Fire and Midnight experiences\nExperience of light, seeing golden orange lotus - a light spreading out etc\n3. Experiences during the Communion Practice - heart spinning, feeling intense heat etc\nThe meaning of universal presence - feel His presence all the time\n4. More Communion experiences - cool breeze, feeling calm etc\nHow one can recognise the right person for you - you don’t fall in love, you become uplifted in love\nDepends on your emotions - love is an experiment, an experience - there are no guarantees in life\nBe deserving and your demands will be met - the importance of your mental attitude in life\n5. More Communion experiences - white light, rainbows, reborn in love, tight steel band etc\nMeaning of Spiritual Names - name just dawns and I pass it on - become worthy of the name\nExplanation of his own name, Purushotam - ideal man - I strive to be that\n6. Gururaj requests background music while he does some paintings\nMention of giving a Sitar recital if he had a Sitar - he sings to guitar music while painting\n7. Continues singing and painting - composes a song about painting and sunshine\nComment on Chetan’s talk about meditation - Gururaj sings in English"}, {"ref": "UK87-9", "summary": "1. Fear of death - you can never die - life is death and death is life, real living\nIt’s not death you fear, you fear fear, which comes from mental anxieties\nMeaning of words - interpretation - the mind needs to unwind because its tense\n2. Gives a demonstration on how to remove all the tension away from a meditator’s face\nI teach you these arts because I don’t have long to live - teachers must carry on my work\nMeditator gives a running commentary on what she sees with Gururaj’s hands covering her eyes\nViolets and white dots, shapes, snow flakes, black dot, purple, lilac, green lights, gold\n3. Afterwards the Meditator feels a lot calmer - all through the power of the Father, I am just a channel\n4. Start of the Wedding Blessing - Gururaj chants in Sanskrit"}, {"ref": "UK87-10", "summary": "2. Starts with the group singing ‘Jai Ram’\nSeeing colours - colours, symbols and words represent the mind - how to analyse the mind\nDemonstration of seeing colours with closed eyes and what the colours mean\n3. Colours seen are yellow, white, green, orange and white, gold, lilac, silver and white, gold\nColours are very meaningful - if you understand them you can change your feelings, your lifestyle\nIf you are innocent within yourself, everyone will love you innocently - purity of heart\n4. Purity is sincerity of purpose - with sincerity and purity you can demand anything in life\nEveryone is asked to relax - Gururaj is given a present of a book\nHe gives thanks to everyone for their love\n5. Encourages everyone to bring one or two friends to the next Course to swell the numbers\nI do not just give teachings in words but I impart a spiritual force that transforms your lives\nMy living comes from the generosity of meditators"}, {"ref": "UK87-11", "summary": "2. Just a channel for Divinity - just like a flute - find total mergence - become closer to Divinity\nI am a guru of the people, not on a pedestal - why can’t you be one with your maker\nDifference between motivation and ambition - motivation comes from past patternings, desire for gain\n3. There must be some motivation - reason for it - convenience - how its interpreted by you\nUse life selflessly in service to humanity - ambition means aspiring to something you want\nYou must have ambition - its normally accompanied with acquisition and attainment\n4. Trying to make your life better is the true goal of ambition, not acquisition - not for myself\nThe purpose of life lies in dying within ourselves to be reborn - liquid in a vessel taking the shape\nBecome ambitionless, destroying the desires of the mind - the craving is gone - fulfil yourself\nYou must better yourself without craving - using affirmations to benefit mankind\n5. You are the master of the world - you can achieve anything\nYou gain the strength through your spiritual practices - neutralise the mind\nAllow the Divinity to flow into you - group chant Jai Ram"}, {"ref": "UK87-12", "summary": "2. Reading out of a poem composed by one of the meditators\nPeople who meditate become more creative in many fields - find what you are made of\nWe don’t allow the Divine energy to flow - true meaning of ‘Be still and know that I am God’\n3. I am just an instrument - the Divine energy reside in every one of you\nThe guru is a guide and helps you to realise yourself - see the beauty inside you\nDifference between wanting to progress spiritually, going with the flow and trying too much\nStop trying to progress - you’re stifled because the mind is involved - it’s limiting yourself\nNever be sorry for any deed - analyse it and become one with it\n4. You cannot analyse the meaning of life - be yourself - finding the love within, we can express it\nYou are love - words flow from the practicality of my life - I just love - I am love\nAre you residing in you body or your body residing in you?\nWhere are you putting the emphasis - residing in the spirit - you are there - an ‘Isness’\n5. You are one with everything - realise it - become one with Divinity\nThat is the purpose of life - become the observer of life\nStand apart and observe what’s happening - understand and accept it in its true value\nDevelop the stillness within and find the oneness with your maker"}, {"ref": "UK87-13", "summary": "1. R and J sing a song composed by Gururaj ‘Sway, Sway, Sway’\nRelationship between the guru and the chela - none exists - implies duality - we are one with each other\nFunctioning together finds fulfilment - we are just IT - a relationship comes from separation\n2. You have to find the balance, have control and discipline in life - the meaning of disciple\nIt’s no use listening to the words and not putting them into practice - express the love and wisdom\n3. Give wisdom and knowledge to others - your reward will be the inner joy that is uncovered\nFind the inner beauty - live your life yourself simply - be humble, be simple\nHappiness is found in simplicity\nGururaj composes a poem about knowing what life is all about\n4. Presentation of a gift to Gururaj"}, {"ref": "UK87-14", "summary": "1. The meaning of infatuation - it comes from a mental conception - it is never lasting\nNo reality to it, interpreted wrongly as love - fades away and causes suffering - it’s an illusion\nLove is a true reality - infatuation is unreality - in love see the spirit in the person which is my own\n2. Lift yourself from infatuation to love - humorous play on the word infatuation\nClarity is to be found within oneself - clear the mind - not being influenced by anything\nBe independent, be yourself and come closer to God - no need for anything - you are Divine\n3. Develop the attitude that my entire life is dedicated to you Lord\nAccept that there is something greater than myself, permeating and doing so much for me"}, {"ref": "UK87-15", "summary": "2. The question Gururaj asks is ‘Who do you think you are, what are you and why are you here?’\nGururaj greets the National Leaders and sings with the group ‘I am nothing else but Love’\nThe purpose of life is to bring joy into your life\n3. Gururaj composes a poem about togetherness - find the totality of life - it’s within yourself\nThe reason why you suffer - uncover and discover that which you really are\nBecome one with yourself - find yourself by being within yourself - it’s the secret of life\n4. Become more simple to yourself and be happier\nGururaj demonstrates how he can create total relaxation for a meditator and release tension\n5. The message is to love in total purity - spiritual love stems from the inner self\nThe group sings ‘Jai Gururaj’, ‘Jai Preatamji’ and Gururaj joins in\nAsks for subjects about which to compose a poem\n6. Subjects suggested are himself, butterflies, happiness, children, love, peacefulness\nGururaj sings in Sanskrit\nNot only a creative composition but it was to flow with the family of meditators\nLife must be lived in togetherness and in that togetherness your guru is with you all the time"}, {"ref": "UK87-16", "summary": "2. Gururaj demonstrates a healing to produce calmness - gives love all the time\nThe reasons why we do dangerous things - we are afraid of ourselves - we create a shield around us\n3. The motivation is the very insecurity within - we are born into this life to get rid of the burden\nWhen you become free, there’s no fear - get rid of the inner turmoils\nGet rid of negative attitudes - Life comes through Divinity - see the beauty of the Lord in all we do in life\n4. Initiations of Prep Teachers, Full Teachers, Healers and Spiritual Names\nPeter reads the prayer, group chant the Gurugita, Initiates read the Affirmation\nGururaj chants a prayer in Sanskrit\n5. Initiations start\nThe meaning of a Spiritual Name\n6. Initiations continue\nGururaj gives Gladys a healing - she’s afraid of giving up life - I am with you\nEveryone is going to die, so why worry about it - we’ll both be around for another ten years\nWhere can you find a guru like me?"}, {"ref": "UK87-17", "summary": "2. Gururaj sings in Sanskrit\nGururaj asks those present to tell him their problems and he would get rid of them - a gift\nA meditator whispers his problem to Gururaj\n3. Other meditators tell Gururaj their problems in silence\nMention of having cured a person of cancer - just an instrument of the Lord\nR and J start singing ‘Amazing Grace’ - the group join in\n4. More problems are mentioned to Gururaj in silence\n5. Comments about the Communion Practice and what to do during it\nExperience it in a gentle way with no effort - just gaze\n6. Advice on how to relax - balance the energies and feel the inner peace\nLiving in the moment to realise the truth, the reality which is within\nYou are living in the past and the past is influencing this moment\nThe difference between mergence and emergence - the meaning of Communion\n7. Merging into that force, to emerge again into this world life\nNot wanting to come back - find the glory that is there within\n8. Love one another - how to answer awkward questions, like ‘Give unto Caesar’\nDon’t offend anyone but defend everyone\nUsha explains the Midnight Practice and what to do during it"}, {"ref": "UK87-18", "summary": "1. Start the day with the thought that it’s a lovely day\nFeel the love within you permeating every cell - you are love - you’re real self is love\nExtend the love to everyone and become yourself - give and it will be returned\nThe real teaching is to make you realise how to find yourself\n2. Go beyond the little self into the greater self of the Lord - it’s the meaning of life\nYou are at the stage of believing in Him, I’m at the stage of knowing Him\nDescription of experiences during the Midnight Practice\n3. The reason for telling experiences is a sharing - I am forever there with you\nThe story about Krishna and his Rasa Dance with his Gopis\nMore experiences from the Midnight Practice\n4. Wedding Blessing\nGururaj chants in Sanskrit\nSpiritual quality in the children of meditators - the innocence and purity of children"}, {"ref": "UK87-19", "summary": "1. Get rid of wrong understandings - go from the stupidity to sublimity\nConcern raised about non-smokers being affected by the cigarette smoke in the room\n2. Getting rid of tensions by allowing people to relax - finding smoking offensive is her perception\nMeaning of life is to accept whatever comes to you - else you are lost\nThe moral is be yourself - do everything in moderation - why smoke - being relaxed, you absorb more\nExplanation of ‘What you think is real is unreal and what you think is unreal is true reality’\nYour true self is where you find that inner self\n3. Combine the physical sense with the spiritual sense - you become ‘Some-body’\nWhen you say to yourself you are somebody, you don’t know yourself\nDemonstration of the power of God’s love using a ring\n4. Have self confidence, then there’s no disappointment\nWhat I’m trying to say is, ‘I love you all’"}, {"ref": "UK87-20", "summary": "1. Gururaj reads out a poem composed by a meditator entitled ‘The Breath of Life’\nMeditators have become more creative - expressing the real sense of the Creator\nCreativity can also be exercised through serving or teaching others, to help bring them to realisation\nBy refining the qualities of life, we move on to reach the subtlety within\n2. To experience the Divinity of the Lord is the greatest experience - see the Divinity in your loved one\nSend your problems to me and they will be solved\nA problem about combating fluoride in drinking water is then given to Gururaj\nSinging of a Bhajan\n3. Gururaj sings and claps and the Group join in\nHanding out of Blessed Objects."}, {"ref": "UK88-1", "summary": "2. With so much violence around, how we can find security - the meaning of insecurity\nThere’s no reason to feel inadequate as Divinity resides within you - just realise that\n3. We are producing the unhappiness - do not allow projections to rebound back\nThe Group is asked to relax - develop the idea of total sharing\nGururaj starts strumming the Sitar and sings in Sanskrit\n4. Gururaj continues singing - Vidya reads out a poem composed by Gururaj\nGroup asked for a topic about which he can compose a song and then he sings about flowers\n5. Charles sings ‘I belong to Glasgow’, then ‘She’s my Lady Love’ - Group joins in the singing\nCharles sings with the Group ‘You are my Sunshine’\n6. Charles and Bavna sing ’Danny Boy’ - discussion about what to sing\n7. Charles and Laurie sing ‘Maybe it’s because I’m a Londoner’ - the Group joins in singing\nCharles sings ‘Down Lambeth Way’ - repeats it with the Group singing\n8. Gururaj, a child and the Group sing ‘Clementine’\nGururaj comments on how he can help people lose their inhibitions - becoming more creative\nNo need to feel despondent, you are life, you are love - that is grace\nAnton sings ‘Oh my Guru’ to the air of ‘Clementine’\n9. Anton recites a Shakespearean sonnet ‘When in Disgrace with fortune and men’s eyes’\nGururaj composes a poem ‘The Inner Light’\n10. Mention of the book ‘Darkness to Light’ and the book of poetry ‘Glimmer of Love’ coming out\nGururaj reads two poems from the book of poetry, Glimmer of love\n11. Understanding the depth of the meaning of love - become totally involved with life\nFinding the beauty that is there, we find who we are - the poetry just flows\nThrough poetry, try to express the power of creativity"}, {"ref": "UK88-2", "summary": "1. God is a creation of our imagination - in childhood the concept of God was implanted\nGradually you realise that what you sought outside is really within you\nWhen we find ourselves, we find the truth, the Divine quality within\n2. Understanding the concept ‘I and my Father are one’, then the problem of God is no more\nThe Group is asked to relax - enjoy the moment, so you can live in the moment\nLearn to exist in the moment, not in the past or in the future - then we can appreciate Divinity\n3. Create within oneself the idea of acceptance, of trust and faith\nDerivation of the word terminology - finding our true self, all problems disappear\nA philosophy of the heart - the problem with Professors is that they are so mixed up"}, {"ref": "UK88-3", "summary": "2. How to find the basis within oneself and allow intuition to flow - basis cannot be found by analysis\nGururaj gives a demonstration with a meditator of recognising herself\n3. The Group is asked to relax - Karen sings ‘My Bonnie lies over the Ocean’\nKaren starts singing ‘O Bambino Caro’ and Gururaj joins in\n4. Karen sings an Aria from ‘Madame Butterfly’\nGururaj sings in an ‘operatic style’ in Hindi - the Group start clapping\n5. An explanation of what Mudras are and how they’re practised - come from Patanjali and Kabila\nMudra means being able to control one’s senses - control your personal life flow\nGururaj gives a demonstration of stopping his heartbeat - he then sings in Sanskrit\n6. Children sing a nursery rhyme ‘Ba Ba Black Sheep’ and ‘Jack and Jill’\nGururaj sings his own version of it - he sings in English about having love in your heart\n7. Children sing ‘Jai Ram’ and Gururaj joins in\nLearn how to bring children out of themselves - portray the power of love always\nCharles sings ‘Roamin’ in the Gloaming’ and ‘Keep Right on to the End of the Road’\n8. Charles sings ‘In the Store’ - R & J. sing ‘Sway, Sway, Sway’\nR and J sing a song composed by Gururaj ‘Vee gamma day jokapi’\nRajesh sings ‘O Bapuji’ - Gururaj and the Group join in\n9. Gururaj sings in Sanskrit - everyone starts clapping to the song\nI go nowhere but into your hearts - love defies analysis\nAppreciating the light from the sunrise - destroy the clouds of the mind\n10. Charles sings ‘Humpty Dumpty’ - comment on the deep meaning of the rhyme\nBe together with yourself - live in your heart, not in your mind"}, {"ref": "UK88-4", "summary": "2. Miss anything but do not miss my love - that is the message and the secret of life\nLove/hate relationship with close ones including the guru - need to establish a balance\nGoing beyond the self, there’s no love and no hate - try to find the innocence within ourselves\n3. Remove the covering of false ideas - discover the true meaning of your living - let the sun in\nGururaj sings in Sanskrit - humming and clapping during his singing\nCharles sings ‘This Old Man’ - Gururaj is sharing wisdom, knowledge and laughter\n4. Baldev speaks about the forthcoming Courses in America\nLocation of the Courses and the facilities in the Retreat Centres\n5. Vidya mentions that the USA meditators would love to open up their homes to you\nAppreciate the worldwide family of friends\nDanish meditators sing a Danish folk song, ‘Blond Girl’\nIrish meditators sing ‘When Irish Eyes are Smiling’\n6. Jaish sings ‘My old Man’s a Dustman’ and ‘Oh Lord it’s so hard to be humble’\nGururaj and Karen sing together"}, {"ref": "UK88-5", "summary": "2. The Group start singing ‘I want to hold your Hand’\nGururaj sings the same song using his own words\nDevelop the creativity within you, so you can flow with life and flow with love\nGururaj continues singing about walking hand in hand\n3. Gururaj can only tell you things but you have to realise things within yourself\nThe importance of playing in our lives as opposed to praying - play is not to be serious\nLearn to regard everything as a play - no seriousness - playful, a fool in play\nCease to play and find wisdom - analyse the wisdom - develop devotion\n4. Move from Jnana Yoga, to Bhakti Yoga, to Karma Yoga and then to Raj Yoga\nFinding the togetherness within yourself, you become integrated - the power of love\nGururaj sings and the Group start clapping - clapping helps to release tension\n5. Gururaj chants ‘Aum bhur bhuvah swah’ etc\nGururaj speaks to the Initiates asking them to spread happiness\nInitiations take place\nGururaj sings in Sanskrit - Jasmini joins in singing\nBefore going to sleep, have one good thought in mind - you will benefit during the night\nGururaj and Jasmini sing in Sanskrit\nGururaj advises all to retain love and affection for children"}, {"ref": "UK88-6", "summary": "2. Why resistance to growth when the desire is for evolution\nAllow yourself to flow and your existence becomes meaningful - why do I exist?\nWe are in the process of personal evolution, pushing us onwards - ‘Onward Christian Soldiers’\n3. Comments about spongers coming on Courses - must be kicked out\nWe love everyone but don’t take advantage of me - are they doing anything in return\nWe have to teach them a sense of responsibility\n4. Difference between cowardice and non-violence - how not to be affected by violence\nThe violence which arose from Gandhi preaching non-violence\nThe true meaning is to be non-violent within yourself\nViolence comes from battling emotional problems - overcome the violence inside first\nIndia’s struggle for Independence - find the independence within yourself, then you know yourself\n5. Group is asked to relax - sing ‘The Rose Garden’ - sections of the Group are asked to chant ‘Halleluia’\nCharles and the Group sing ‘O What a beautiful Morning’ and ‘Show me the Way to go Home’\n6. Charles sings ‘A Wonderful Bunch of Coconuts’ - Gururaj and the Group join in\nCharles sings ‘Moon River’ - Gururaj composed it - made a hit by a South African singer\nCharles and the Group sing ‘Amazing Grace’\n7. The group sing a Polynesian Rain Chant with accompanied clapping\nJune, Charles and the Group sing ‘He’s got the Whole World in His Hands’\nThe Group sings ‘Give me Oil in my Lamp’\n8. Charles sings ‘Let me Call you Sweetheart’ and ‘Someone Like You’\nGururaj sings in Sanskrit and in Hindi\nDhanjee gives a machine which says ‘I Love you’ when he whistles to BMS\n9. Expression of thanks by Gururaj to the Group"}, {"ref": "UK88-7", "summary": "2. When you plan, you create a role and every role you play in life is an act, it’s not genuine\nChannelling is a farce, it’s unreal - real channelling is when you provide an inner spiritual quality\n3. Singing of ‘Forty Shades of Green’ - Charles sings ‘Daisy Daisy’\nThe Group is asked to relax - singing of ‘In Dublin’s Fair City’\nLeslie plays ‘Green Sleeves’ etc on the clarinet and the Group applaud\nGururaj sings ‘Que Sera, Sera’ and the Group join in the singing\n4. Gururaj and the Group sing ‘What shall we do with Drunken Sailor’\nAnton sings the same song replacing sailor with the word guru\n5. Singing of ‘O Lord Kumbiya’ - Gururaj sings about knowing one self\nGururaj demonstrates the art of clapping with a rhythm, (flamenco style) and the Group join him clapping\nThe Group sing ‘Yellow Submarine’ but with few words\nEddie sings ‘Scarborough Fair’ and ‘The Rose’\n6. Eddie sings ‘When you Walk through a Storm’ - the Group join in the singing\nKaren sings ‘Edelweiss’ and then ‘Tonight, Tonight’\nCharles sings ‘Amazing Grace’ - Karen sings more of ‘Edelweiss’\nGururaj sings and asks for Sitar\nCommunion Practice takes place\n7. Gururaj sings in Sanskrit about always loving, true love"}, {"ref": "UK88-8", "summary": "1. Comments regarding experiences during the Midnight Practice\nDetails of a dream about living in a cave and a race of winged creatures outside\n2. Regressing back to the Caveman Age, he found his inner self\nOther experiences related - body disappearing, forehead aching, colours, blast of air, flowers\n3. Gururaj sings ‘Whirlpool of the Mind’, his own version of ‘Windmills of the Mind’\nCharles sings with a child ‘Three Blind Mice’ and the Group join in\nPlaying of the ‘Windmills of your Mind’ and ‘I am Sailing’ on the piano\nEddie sings ‘Scarborough Fair’ and ‘Valley of the Tees’\n4. Bill asks the Group to sing a special echo song, ‘Hello, Hello, Hello’\nIt is not only wisdom that’s imparted but fun and happiness, a family feeling and laughs\nCharles sings ‘My Rosie’, ‘Nellie Dean’ and ‘Bill Bailey’"}, {"ref": "UK88-9", "summary": "1. Let remembrance of our Saviour be there all the time - I’m a messenger to give the message of love\nI am not going to be around very long anymore - important thing is to find love, to find God\nI ask you to find the unity within yourselves - life, love, God\nGururaj starts humming - Charles sings and hums with rhythmic noises - Group clap to the rhythm\nGururaj sings ‘We’ve Always been Together’ - I love you and will never forget you\n2. Jammu tells a story about Fozzler Din and the Philosopher and another about nuns eating hot dogs\nLaurie and Bernie sing ‘Love and Marriage’ - Laurie, Charles and Bernie sing ‘Sisters’\n3. Gururaj composes and sings in Sanskrit - spontaneous expression to express my love to you\nCharles tells joke about a spacecraft beaming up a black man from a canoe down below\nGururaj sings a composition ‘Preatam, I love you all my life’\nKaren sings an aria from ‘La Traviata’, ‘There’s a Place for Us’ and ‘I Feel so Pretty’\n4. Karen sings an aria from ‘La Boheme’, Gururaj joins in and the group start clapping\nSinging of ‘My Love and I’ ‘Messing about on the River’, ‘Porgy and Bess’, ‘I am Sailing’"}];

</script>
<script>
var mode = "theme";
var searchBox = document.getElementById("searchBox");
var resultsEl = document.getElementById("results");
var resultCountEl = document.getElementById("resultCount");
var refCountEl = document.getElementById("refCount");
var hintText = document.getElementById("hintText");
var tabBtns = document.querySelectorAll(".tab-btn");

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  var esc = escapeHtml(text);
  var safeQ = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var re = new RegExp("(" + safeQ + ")", "ig");
  return esc.replace(re, "<mark>$1</mark>");
}

function jumpToRef(ref){
  mode = "content";
  for (var i=0;i<tabBtns.length;i++){
    tabBtns[i].classList.toggle("active", tabBtns[i].getAttribute("data-tab")==="content");
  }
  updatePlaceholder();
  searchBox.value = ref;
  render(ref);
  window.scrollTo({top:0, behavior:"smooth"});
}
window.jumpToRef = jumpToRef;

function updatePlaceholder(){
  if(mode==="theme"){
    searchBox.placeholder = "Type a keyword: e.g. meditation, fear, karma, death...";
    hintText.textContent = "Search covers headings AND the explanatory text in parentheses.";
  } else {
    searchBox.placeholder = "Type a keyword or a reference: e.g. UK79-23, mosquito, fear of death...";
    hintText.textContent = "Search inside the summarised content of each satsang (325 talks, 1976-1988).";
  }
}

for (var i=0;i<tabBtns.length;i++){
  tabBtns[i].addEventListener("click", function(){
    mode = this.getAttribute("data-tab");
    for (var j=0;j<tabBtns.length;j++){
      tabBtns[j].classList.toggle("active", tabBtns[j]===this);
    }
    updatePlaceholder();
    render(searchBox.value);
  });
}

function renderTheme(query){
  var q = query.trim().toLowerCase();
  var matches = q === "" ? INDEX_DATA : INDEX_DATA.filter(function(e){
    if (e.heading.toLowerCase().indexOf(q) !== -1) return true;
    if (e.context.toLowerCase().indexOf(q) !== -1) return true;
    for (var k=0;k<e.refs.length;k++){
      if (e.refs[k].toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
  });

  resultCountEl.textContent = q === ""
    ? (INDEX_DATA.length + " entries loaded")
    : (matches.length + " result" + (matches.length===1?"":"s") + " for \"" + query.trim() + "\"");
  refCountEl.textContent = "3246 references total";

  if(q !== "" && matches.length === 0){
    resultsEl.innerHTML = "<div class=\"empty-state\">No entry matches this keyword.</div>";
    return;
  }
  var toShow = q === "" ? matches.slice(0, 60) : matches;
  resultsEl.innerHTML = toShow.map(function(e){
    var refsHtml;
    if (e.refs.length){
      refsHtml = "<div class=\"refs\">" + e.refs.map(function(r){
        return "<span class=\"ref-pill\" onclick=\"jumpToRef('" + r + "')\">" + highlight(r, query) + "</span>";
      }).join("") + "</div>";
    } else {
      refsHtml = "<div class=\"refs\"><span class=\"ref-pill\" style=\"opacity:.6\">cross-reference, no direct satsang</span></div>";
    }
    return "<div class=\"entry\">"
      + "<h3>" + highlight(e.heading, query) + "</h3>"
      + (e.context ? "<div class=\"ctx\">" + highlight(e.context, query) + "</div>" : "")
      + refsHtml
      + "</div>";
  }).join("");
  if(q === "" && matches.length > 60){
    resultsEl.innerHTML += "<div class=\"hint\" style=\"padding:14px 0;\">Showing the first 60 entries (alphabetical order). Type a keyword to filter all entries.</div>";
  }
}

function renderContent(query){
  var q = query.trim().toLowerCase();
  var matches = q === "" ? SUMMARY_DATA : SUMMARY_DATA.filter(function(e){
    if (e.ref.toLowerCase().indexOf(q) !== -1) return true;
    if (e.summary.toLowerCase().indexOf(q) !== -1) return true;
    return false;
  });

  resultCountEl.textContent = q === ""
    ? (SUMMARY_DATA.length + " satsangs loaded")
    : (matches.length + " satsang" + (matches.length===1?"":"s") + " for \"" + query.trim() + "\"");
  refCountEl.textContent = "1976-1988";

  if(q !== "" && matches.length === 0){
    resultsEl.innerHTML = "<div class=\"empty-state\">No satsang matches this keyword.</div>";
    return;
  }
  var toShow = q === "" ? matches.slice(0, 25) : matches.slice(0, 200);
  resultsEl.innerHTML = toShow.map(function(e){
    return "<div class=\"entry\">"
      + "<h3>" + highlight(e.ref, query) + "</h3>"
      + "<div class=\"ctx\">" + highlight(e.summary, query) + "</div>"
      + "</div>";
  }).join("");
  if(q === "" && matches.length > 25){
    resultsEl.innerHTML += "<div class=\"hint\" style=\"padding:14px 0;\">Showing the first 25 satsangs (chronological order). Type a keyword to filter all 325.</div>";
  } else if (q !== "" && matches.length > 200){
    resultsEl.innerHTML += "<div class=\"hint\" style=\"padding:14px 0;\">" + matches.length + " results found, showing 200. Refine your search to narrow the list.</div>";
  }
}

function render(query){
  if(mode==="theme") renderTheme(query);
  else renderContent(query);
}

searchBox.addEventListener("input", function(){ render(searchBox.value); });
updatePlaceholder();
render("");
</script>
</body>
</html>
