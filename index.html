nking about karma involves you in karma"}, {"ref": "UK80-32", "summary": "2. Does man think or does his think that he thinks?\nThere is only one mind, the universal mind – it contains every thought\nIndividuality is just a reflection of universality\nThe reflection is real but not actual – it has no power of its own\nTrouble begins when man regards the reflection to be real – Maya\n3. Christ not being understood – there’s always opposition to a good force\nManifestor manifests through sound - from this sound the mind was created\nIndividualisations were formed but in reality the essence is one\n4. Man tries to confirm his individuality in thinking that he thinks\nThe impressions gained govern our lives today – the ‘i’ emerged\nThe way we see things is dependent on impressions embedded in us\nIn meditation, we lose individuality - we do not blank out the mind\n5. All thoughts are forever existing – how we can attract positivity to us\nWe do not create thoughts – we’re just a channel for them to flow\nSubtle energies – Gururaj is sending out an impulse though a mantra\nLiving in the moment helps one to love – hatred comes from the past\n6. When man lives for the moment, he forgets the ego self\nWe mistake unreality for reality\nMeditate and come to know your true self – it’s a gradual process\nPoem about the reflection of the moon in the pails of water\n7. The answer to the question ‘Who am I’ is experienced and not known\nObserving subtle energies as colours during meditation – just thoughts\nMeditation does more than calm you down and help you to relax\nSimple relaxation methods are not permanent – tapping into the spiritual force is everlasting"}, {"ref": "UK80-33", "summary": "2. Recent changes in the leadership of BMS\nThe world is subjected to change – people deluding themselves\nStory about how Shiva got his blue throat – ‘Nilcant’\nWith greater good there is always opposition\n3. Attacking personalities with distorted facts\nPeople cling to spicy, juicy negative things that bring destruction\nStory of the way Mahavir, the founder of the Jain religion was treated\nThe same happened to Buddha and Christ\n4. Gururaj sees the Divinity inside those people who accused him\nBuild on strength not weakness – eternal truths can never die\nThe sufferings of Jesus and the Saints – they suffered to benefit others\nNot the deed but the motivation behind it\n5. It’s difficult to understand how gurus function – their actions non-conventional\nThe greatest sin is to break a person’s faith\nIn the chaos many people have been harmed\nRecommendation to judge the tree by its fruits\n6. Venting one’s own personal motivations for greed or gain\nBMS organisation was never money-oriented – Gururaj’s objections to materialism in BMS\nGururaj dedicated his life for the purpose of truth, to help others\nHe leaves behind some knowledge never before brought into the world\n7. Gururaj says the resistance to him will help him to push forward harder always\nJesus had opposition and had few followers – troublemakers abound\nSincere seekers will always be there – my door is always open"}, {"ref": "UK80-34", "summary": "2. Man is in a period of transition – to proceed from thought level to heart level\nMan is acting as a man but he is not a full man yet\nThoughts produce misery – heart only is only capable of producing joy\nThe mind is infinite but can remain stagnant – flow we see is turbulence\nThe heart brings simplicity – without reaching it, Divinity cannot be reached\n3. Unfoldment is personal – the Teacher shows the way – become more alert, more aware\nThe mind can be immersed in the heart – called transcendence – a cleansing takes place\nThe mind does not experience reality, only reflections – these are limited while the heart is vast\nThe workings of the mind – everything has to have its opposite e.g. love and hate\nGo beyond it all to the ‘Land of Being’ where you just are\nGod at its finest relative level is bound by the law of opposites\n4. People doing good and yet suffering because they are bound by relativity\nIf you go to heaven, when the momentum wears off, you go to hell\nOne has to rise above all doing good – all has to be transcended\nWords are totally empty – just for the mind – go beyond words, they’re not needed\nBe yourself, why be an imitator? – Gururaj imitating Tagore’s poetry – imitation is second class\n5. Man has so much goodness in him – reaching the stage of no thought\nThe real transition is to go beyond the opposites of the mind – the field of ‘being’\nThe false values we have created such as fear, guilt and misery\nGurus talk of things beyond worldly values and are not understood\n6. You don’t know about the universe except through the interpretation of your mind\nUsing experiences for comparisons lead to judgements\nYou think you know but not until you wholly identify with it\nTransition from thinking to knowledge is what is needed – then you know"}, {"ref": "UK80-35", "summary": "2. Mechanics of the derivation of mantras\nDangers and harm from being given and using wrong mantras\nPersonal mantras – a person is at a particular stage of evolution – his mantra is unique\nGururaj does not select a mantra, he creates a sound – it is an art form\n3. A person’s mantra represents his sum totality\nYou become the mantra, thus becoming one with your real self\nThe mantra reaches a finer level gradually but remains as an impulse\nMeditation brings integration so that the three parts of the mind work together\n4. Personal manifestation was nothing but sound\nIn meditation we form a channel to the superconscious layer\nExplanation of how a mantra is derived\nHow the mantra changes as one progresses on the path\n5. Dangers of choosing a mantra at random i.e. picking one from a book\nReason why Gururaj Ananda is used as a Prep mantra and not Christos Ananda or Sri Ananda\nEverything being vibration, it’s important to use a mantric formula\nA person is initiated at the time Gururaj conceives his mantra\nSeventy percent is the spiritual force sent with the mantra\n6. The mantra will follow you in the next life – you will be reinitiated with it\nThe spiritual bond can never be broken – a guru is apart from his personality\nA mantra is unique to you – within the range of where you are at\nThe only difference between the guru and chela, the guru has travelled the path"}, {"ref": "UK80-36", "summary": "2. Details of Communion experiences and explanations from Gururaj\nWhite light and the whole audience covered in gold – universal spirit is pervading\nSmooth flow of energy – Gururaj’s face changing – indicating universality of the spirit\nIt’s not necessary to experience anything – the heart is touched by the glory of God\n3. Satsang with Rapid Fire question and answer session\nThere are no universal mantras beneficial to everyone – the mantra value is diffused\nYour inner self is unique and has to be approached in a proper manner\nPeople given the same mantra – how this happens\nA mantra is only a tool – mantra is 30% of the practice, while 70% is the spiritual force behind it\nYou become the mantra and then you know your real self – a living mantra\n4. People think they do not need an outer guru to find the inner guru – they’re bluffing themselves\nYour inner guru is God – can you prove God is within you\nAncient saying ‘Without the guru there is no wisdom of Divinity’\nThe meaning of the sayings in the Bible – ‘Eye for an Eye’ and ‘Turning the other Cheek’\n5. There are times when you have to stand up to aggression\nEverything is right in the workings of the expression of Divine nature\nAre halos around pictures of Saints related to auras?\nYou have to have a certain sensitivity to see auras\nHalos mean nothing – the goodness of a person is what he can do for others\n6. The more you give of yourself, the more unselfish you become\nTo find joy, dive deep within through spiritual practices and express the joy outwardly\n7. Kirlian photography – how it picks up the radiation of every object\nWhere would we be reborn if this planet is destroyed?\nEvolutionary laws are progressive – one could be reborn on another planet\n8. At death the chela is met by the guru, the spiritual master\nIf you have faith in a certain idea, it will materialise at death\nMuslims’ promise of reward after death – life after death – a bright light coming to meet you\nClarify and clean the mind while alive – learn to die consciously\n9. Is it possible to reach enlightenment in this life-time\nComment about Lazarus – many close to enlightenment at present – taking long time to be reborn"}, {"ref": "UK80-37", "summary": "2. Explanations by Amrit on how BMS will be run in the future\nFormation of Committee and its future activity - Newsletter - future Courses\nAppointment of John Lamb as the new Secretary/Co-ordinator\n3. Personal interviews with Gururaj will be available for meditators in the future\nElimination of Teachers’ only Courses – openness of BMS in future\nDifficulties and doubts in people’s minds – basis is there to promote and go forward\n4. Gururaj starts speaking about dying and how to die\nOn the spiritual path, jumping into the unknown is exciting - no expectation\nPerson not prepared to gamble because of fears and insecurities - hero’s path\nDanger of stereotype beliefs – fears implanted\n5. Leaving this body, the impressions go with you – fears are tenfold\nHow to die consciously - life can be prolonged – no accidents\nIn reality there is no death – attachments in life delay rebirth\nParents do not choose their children, the children choose their parents\n6. We can help a person who has died by praying for his release from attachments\nBasis of love – selflessness – not possessing someone\nThe turbulence diminishes as the attachment ceases\n7. Light coming to meet you when you die – it’s your own inner light you face\nThrough meditation, as awareness grows, you become aware of your subtle body\nAs the subtle body comes closer to the spiritual body, a oneness is felt\nThe subtle body becomes aware of itself – man is not aware of his mind\nWith meditation you can become the observer of your mind\n8. At the moment of death, you become one with your spiritual self – one with God\nNothing to fear when going to God consciously – death is beautiful"}, {"ref": "UK80-38", "summary": "2. Rapid fire question and answer session\nWhat prayer or worship to use when one is going to die\nLet prayer be your life all the time – let it become a reality to you\nYou pray to yourself – reach the realisation of no separation with God\n3. You do not keep souls attached to you by praying for them – selfless motive\nWhy are Initiations into the Mandala practice only on Courses?\nCan one become enlightened through means other than through meditation\n4. Benefits of using a photo during group healing session\nThoughts during meditation – then thoughts are unimpeded, therefore more powerful\nEvery thought will reach its own original elements – negative go back to negative disposition\n5. Negative thoughts colour the pure energy of the thought\nEvolution on the path is always progressive\nRecalling past existences – the memory is in the mind\n6. Why is there an odd number of rounds in the chant and why alternate the last round\nOdd number is pointed and helps to pierce the subtler vibrations\nWill Gururaj come back again? – there’s no coming and going – all is immortal\n7. The Messiah has known his true self from beginless time\nLife and death are only in the realms of relativity – meaning of the Son of God – everyone is\nExplanation of dharma, duty in life – you have to start off with effort\nBe yourself, not an imitation of someone else – adopting facades\nIf you see hatred in a person, the hatred is in you first\nMeditating in a pyramid – Gururaj’s experience in Egypt\n8. No need to experiment – Ram Dass giving drugs to a guru – had no effect on the guru\nSpeaking about Hugh leaving – thanking Hugh and Randy\nHoping for bigger numbers at the Course next Summer\n9. The Spiritual force will never die – it perpetuates itself"}, {"ref": "UK80-39A", "summary": "2. I do nothing, it is the Father who acts\nEgo self thinks it does things – it’s non-permanent, so can’t be the doer\nAssumption that ‘I am it all’ is the greatest delusion leading to misery\nThe energy is the doer – matter is inert without this energy\nInter-relationship between the Son and the Father – this ability lies with everyone\n3. Separation from the Father creates delusions - brings polarities - the law of opposites\nDissolution and change in the Universe – the concept of linear measurement\nThe realm of the absolute can be achieved through meditation\nWhat you need to know is that you are part of the universe and the universe is within you\nThe ego-self creates divisions which lead to conflicts\n4. Man needs to rise above the law of opposites, to find everything to be one\nPerspective changes and brings acceptance within himself\nBecause of ignorance we find good and bad in the world\nGo beyond happiness to bliss which has no opposite\nWith acceptance, one gains strength – energy has a free play\n5. With spiritual practices the ego is clarified and Divine will penetrates freewill\nPrayers act as a balm to find calmness but the release is temporary\nExplanation of the concept of total surrender – I am not the doer\nIs the attention on the ego self or the real self? – only realised by the heart\nAnalogy of the dual position of the wave and the ocean\nTo be able to say ‘I am Divine’\n6. Happiness is an inner quality that one has to realise by oneself\nReal meaning of ‘I am that I am’ – negativities arising from possessions\n7. From the perspective of the finer self, you are beyond pain and pleasure\nMind and body are just instruments for performing any act\nOne reaches the experiential level where all is one"}, {"ref": "UK80-39B", "summary": "2. How to handle a person who is negatively disposed to you\nExpressions of negativity could have a positive effect\nIn every act perpetrated there is always some goodness – it’s a question of how it is interpreted\nTurn the other person’s negativity into positivity by the love you show that person\n3. Your duty is to stand firm and not be touched, like the Lotus flower in the mud\nLike in the Bible, you go on sowing the seed and are totally unaffected by everything\nA man of strength looks beyond the surface values of the seemingly negative person\nStory of the holy man with the holes in his turban – how they were removed\nThe friction in life which comes from another person’s negativity is a great cleanser\n4. Never believe that anyone can affect you in a negative way\nHow to serve man – service to man is to serve Divinity\nStory of the lion and the rabbit – all are actors - real judgement comes from within\nWho am I to judge that someone inflicts negativity on me?\n5. With acceptance, faith and hope you learn not to view anything negatively\nTo be able to stand apart and to ignore negativity is wisdom\nBe brave – in essence there is no negativity – all energy is Divine\nStand apart and you can smoothen the karma – lessen its bad effect\n6. All positivities and negativities are but a play in this world\nJoke about “Man or mouse” – thanks and farewells"}, {"ref": "UK80-41A", "summary": "2. How to accept and come to terms with pain and suffering\nPain is felt organically but the origin of pain is in the mind\nThe types of pain – one’s mind is conditioned and associations bring about pain\nSomething not similar to the experience of pleasure is pain\n3. Alleviate pain through meditation by by-passing the mind\nBypass the impressions stored in the mind\nExplanation of how the mind translates impressions into pain or pleasure\nDirect line to the spirit – no comparison, so pain is not felt as pain or misery\nPleasure is not an antidote to pain – opposite values of pain and pleasure\nGo beyond pain and pleasure to joy, for both are transitory, forever changing\n4. The search for pleasure is external but the search for joy is internal\nThrough meditation we reach the centre of ourselves, to find the stillness\nWhen you find the stillness, you become one with it – you have reached home\nBest way to stop pain is to stop running after pleasures – dangers of expectations\n5. With no expectation there is no disappointment – live life as an art\nThe futility of living in the past, while living in the future produces expectations\nLearn to live in the present – nothing else exists but this moment\nThis understanding must permeate every cell of your body – accepting oneself\nWith acceptance, one starts to learn discrimination – living spontaneously\n6. Looking at yourself squarely in the mirror, you see your weaknesses\nStart knowing yourself – develop awareness\nAs awareness expands, you separate your real self from the ego-self\nRepatterning the mind – live in the absolute and the relative in oneness\nThe heart has to feel the power of Divinity and translate it into daily living\n7. If one flows with nature, one never suffers, there is no misery\nThe joy shines through us and we become more compassionate, kind and charitable\nWith meditation you dive deep within and allow the divine force to permeate all we do"}, {"ref": "UK80-41B", "summary": "2. How valuable are words in communication – use of affirmation techniques\nWords can be superficial – they can’t convey the totality of man\nReal communication is done without words – a guru emanates an aura\n3. A true guru radiates an emanation that uplifts you to a higher vibratory level\nFirst was vibration which became sound, then word – word is God\nIn meditation we try to reach back to the primal vibration, the word\nSpoken word has value because the mind wants to analyse, reason\nUse of symbols – greatest teachings told in parables – can be interpreted by the individual\n4. Deepest means of communication is spiritual love – you don’t need words\nDarshan – transference of spiritual force without words\nSpiritual sound is so subtle, it cannot be heard but just felt\nAt the level of the unheard sound, all is one – there’s no separation\nAffirmations are thoughts deeply implanted within one’s mind\nSimilar to auto suggestion which can change certain habit patterns – has limited effect\n5. Dangers of affirmations – can produce opposite results – they’re not for all\nNo predestination – Divine will and freewill co-exist – tendencies have been brought with you\nMotivation is important in predestination and self-destination\n6. Secret is to align one’s freewill with Divine will.\nDangers with wrong misinterpretations of the Law of Karma\nAll the questions ‘Who am I’, ‘What am I’ will be answered through meditation\nThen you don’t need to seek for happiness, you are happiness"}, {"ref": "UK80-42", "summary": "2. What has purity to do with morality and the other major virtues\nGood intentions are in the area of innocence and that is purity\nMorality is totally dependent on your own mind – moral laws provide stability\n3. Moral injunctions are not upheld – they’re just guidelines – will always have their opposites\nIf there were no evil in the world, there would be no necessity to worship God\nEntire universe is governed by the law of opposites – expansion and contraction\nMan can never be perfectly moral – the ego has to be refined – it’s obscuring what is pure\n4. Discrimination and analysis is required as far as morality is concerned\nMan thinks he knows but doesn’t know unreality which is relatively real but transitory\nWith his concept of morality, man can suppress latent samskaras\nStory of the man who had been in jail coming to Gururaj for advice\n5. Great Masters weren’t very moral men but they were pure men\nThe story of the monk and the pregnant girl in the village – ‘if it pleases’\nNever affected by acquisitions based on man made laws of morality – rise above it all\nMan in his present stage of evolution cannot judge himself then how he can he judge others\nWe cannot judge the actions of a true master – story of the guru burning the chela\n6. Scriptural guidelines are necessary today – very few who are beyond the moral laws\nPurity is a quality of total innocence – every act is innocent but one is totally aware\nWith awareness one views things in totality, not sectionally – you become one with God\nDivinity is a totality, a wholeness, yet Divinity is within the laws of morality\nLoving your enemy – becoming hateless, fearless – Jesus never hated, yet was hated\n7. Oneness between two people – mergence of two minds\nGururaj keeps on going, to teach one thing, the mergence of the relative with the absolute\nThe relative is also Divine – who are we to judge – what do we know"}, {"ref": "UK81-1", "summary": "2. How to stay awake and not fall asleep in the presence of a guru - caused by an element of fear\nOverwhelmed and uplifted in the presence of the holy - bondage is caused by thought forms\n3. The light emanated is powerful and invigorating\nThis light is felt but you fall back into previous grooves\nBe in the company of holy people, read uplifting books and records of their teachings\nHow to stay awake - teachings are alive - grasp the wisdom - the importance of gurushakti\n4. Pictures of Spiritual Masters awaken your real Divine self - Divinity thinks through you\nBenefits are freedom - develop a positive attitude, become the observer, then nothing affects you\nYou become joyful, compassionate and loving - you see with holiness, not with separation\n5. The veils are the obstacles from seeing that everything is Divine\nNeed for spiritual awareness to truly see - the importance of real sleep\nStory of the King trying to find the most non-affected person\nThe importance of non-attachment - you possess nothing\n6. Be attached to Divinity and not to possessions\nListen to the words of holy men, read their books - these are constant reminders of the Divine"}, {"ref": "UK81-2", "summary": "2. Conflict between pursuing a spiritual path and the need for material things to survive\nAre you ready for spiritual support? - material needs are necessary\nWork is a form of spirituality - not being dedicated to the spiritual path, but just wishful thinking\nOvercome the patternings through discipline - difficulties should be welcomed\n3. Difficulty is the greatest teacher in life to goad you on\nThere are no difficulties in life, just lessons to be learned - the purpose of this life is to learn\nOvercome difficulties through hard work - use the Tratak Practice to get help through visualisation\n4. We fail to see the beauty of the energy within us - using discrimination\nDifficulties are created by us - how we look at things - life is a joy\n5. Develop a positive attitude and then understanding of the difficulty will follow\nOur spiritual practices help us to improve the strength of thinking to achieve the proper attitude\nMake ourselves conducive and receptive to grace which is free of charge\n6. Fear produces difficulties - think of the ‘now’, forget tomorrow - live in the today\nThe conflict which arises is the difficulty - people just mope and don’t react\nAnalyse the difficulty and then you can overcome it\nYou are the Master of the universe - Christ’s attitude of compassion\n7. Having understanding, we can flow with love and compassion\nBy your love you are teaching those that are creating difficulties for you\nUplifting others is an act of charity - rise above the difficulties\nMeditation brings that calmness, that simplicity to you\nYour perception changes and you realise nothing is bad\nYou have to free yourself from the patternings\n8. How can we differentiate between freewill and karma?\nGururaj gives an excellent explanation of karma and freewill\nKarma has been produced because of freewill which is binding\nKarma has to do with the mental self - mental conditioning is due to past karma\nWe can change the direction of our karma, yet the force of karma is not lost\nAchieved by advice or surrender - freewill is a reflection of our conditioned ego\n9. How to merge so-called freewill into Divine will - a repatterning occurs\nWith spiritual practices the ego is clarified and the light of Divine will shines through\nSurrender has to be totally spontaneous or else it’s conditioned with strings attached\n10. The karmic reflections and workings of karma is what is termed freewill\nFreewill produces karma and karma produces freewill - a vicious circle"}, {"ref": "UK81-3", "summary": "2. Flying saucers and the destruction of the earth - permissiveness - a gloom around the earth\nForthcoming catastrophe can be averted - changing the emanations\n3. Forces from other Planets - some come to bring us down, others to uplift and prevent this gloom\nInventions coming from more highly evolved beings - higher form of life on other Planets\nSpiritual practices are needed to uplift people - people giving of their inner selves\n4. People start off with great intentions but degenerate into self-possessions, ego-inflation\nGurus building up movements in the name of God and making millions\nChurches are empty because man’s mind is directed to the material side and not the spiritual\nSpirituality must be practised - bringing God down to earth - need to see everything is Divine\n5. The greatest need today is love - the earth is in a state of evolution\nNeed to improve individually - the world will never be at peace but a person can\nWe go beyond the grossness to a beautiful area of subtlety and peace\n6. Gururaj speaks about his latest visit to India\nDisheartened by the treachery of close ones, he needed to go to gain strength\nPractices help to keep you on the path, but the real value is in Gurushakti - heart to heart contact\n7. How he can help us to realise we are Divine - concept of man-made religions\nBecoming boundless as you become one with Divinity - religions fighting each other\nReal meaning of communion has been lost - religion can serve a purpose by exerting control\n8. Gururaj went to see Swami Rama Puri to be in the company of holy people\nAn evil demon had come into his mind that he needed to perform miracles - fruitless desire\nHe realised he was not after psychic powers but wanted to help people to find reality, Divinity\n9. He learnt how futile psychic powers are and how dangerous they are\nComments about Sai Baba and his skill in manifesting ash - only artificial faith\nPeople put a spiritual person on a pedestal and use him for their own selfishness - treacherous\nGurus get angry - have little imperfections to remain in body in order to do their work\n10. Christ’s suffering was in wanting to help his fellow beings to see the light\nThere is no separation - only one Divinity - all beings are just little bubbles on the surface of the pond\nThe illusion is what you think you are - know yourself by knowing Divinity\nThe title for a book on his teachings should be ‘It’s so Simple’"}, {"ref": "UK81-4", "summary": "2. Is opening of the heart done by the ego self or by Divinity?\nThe heart is forever open - the heart normally referred to is the ego at its finest level\nThe real heart of man, the core of the personality is love - love feels no hurt or pleasure - ego does\n3. The direct path to the spiritual centre is through meditational practices\nDiving deep within we allow the Divine force to penetrate the porousness of the ego\nChrist’s heart bled for us means he allowed the essence to pour forth\nThe ego heart has to be clarified in order to get to the real heart, through purification\n4. Difference between spiritualism and spirituality - direct contact with the essence\nThe physical heart is the essence of the body, the ego heart that of the subtle body,\nThe spiritual heart is the essence of the spirit.\nThrough meditation, the spiritual heart shines out into the subtle body clarifying it, bringing balance\n5. Opening the heart means creating a tunnel to the spiritual heart, the essence of everything\nBy digging up this dirt, one may feel awkward but the power of grace dissolves the dirt dug up\nThe samskaras go back to original elements - like attracts like - how evil, negativity multiplies\n6. Through spiritual practices the light of the spiritual heart shines through our whole personality\nThis is how people can see auras which are subtle energies in colour or sound\nThe spiritual energy which comes through, forms your vibration, upon which your mantra is based\n7. We are born according to the needs of evolutionary laws - a choiceless choice\nDescription of how a subtle body takes birth - the reason we are born is to learn, to progress\n8. How to see auras - a mental acquisition easily learnt\nDescription of how to read more quickly through speed reading - an art you can learn\nPsychic abilities can be learned - just a question of shifting energies around\n9. Dabbling in spiritualism and psychic practices can lead to mental derangement\nGururaj speaks about abortion - it is totally wrong - murder of the first degree"}, {"ref": "UK81-5", "summary": "2. Conflict between the gurushakti practice and devotion to Jesus\nGurushakti is the power of grace and the source is Divinity\nDogmatic creeds in churches are limited - Divine light is forever existent, unchanging\n3. A living master symbolises the consciousness in a more concrete form to you\nIt’s the same consciousness - if Christ is your ideal, Gururaj will show you how to approach your ideal\nA living teacher comes along and shows you how to bring Christ alive\n4. No such thing as altered states of consciousness\nWith meditation as your awareness grows, you become one with the Father, true consciousness\nHuman touch of shakti helps to allow the light to shine through\nReason why great personages take birth - the Ajna Chakra, the Chakra of perception\nTinkling in the forehead - when the Chakra is fully open, you are totally aware of Divinity\nReaching unity consciousness is bringing total unity within the range of man\n5. The awareness that you are essentially Divine comes with the opening of the Ajna Chakra\nSpiritual practices and drawing on the power of grace are necessary to open the Chakra\nConsciousness exists in everything - no separation - ‘I am That’\nWith increased awareness, all things become one\n6. With the opening of the Ajna Chakra all three hearts merge into one\nThe guru starts you off with a touch or a look but effort is needed\nEverything is within, just to be realised - does not come in an instant\nEffort can become effortless - life is but joy to be enjoyed\n7. The story of the ten farmers and the one that they ejected was their protector\nTo find life to be happier, awareness needs to be developed\nIn essence everything is one - the oneness is love and love is God"}, {"ref": "UK81-6", "summary": "2. Rapid Fire - healing - two kinds of healing, magnetic and spiritual\nIn magnetic healing the person is using his own personal energy - can impart his own negativities\nIn spiritual healing, one has acquired the art of being a channel for energy from universal sources\nThe Spiritual Maser imparts the gift to the healer - explanation of how healing works\n3. Relationship between humans and animals - difference is that man has the power of thinking\nDifference of degree but not of kind - in the past people venerated animals\nContacting Gururaj during meditation - danger of other entities coming through?\n4. The effort made to spread the message of the Master should be yours\nIf the message is strong enough, it will be spread\nCatastrophe coming at the end of the century - your duty is to carry the Master’s words to others\nRamakrishna had only forty followers - Christ had only five hundred\n5. Christ was despised but he was not discouraged - worship of Christ started after he was dead\nTalks are given to provide some understanding of how to love - turning people onto the right path\nQuestion of Biorhythms - every rhythm is interrelated\n6. Reference in the Aquarian Gospel of Jesus going to India, Greece and Egypt\nJesus went to the East to learn - only started teaching after reaching maturity, aged thirty\nChrist wrote twelve of the one hundred and eight Upanishads\nNo significant difference between all religions\n7. How can you be separate from God if his is omnipresent\nThe purpose of religion is to give you freedom but they bind you more\nHow to do a healing for a sick person after meditating, using a blue healing colour\n8. Does receiving healing affect the karma of the person?\nGood positive thoughts has a beneficial affect on your karma through giving of yourself\nBy sending healing to a sick person, you are helping to alleviate the pain, conveying love\nHealing services in churches varying - depends on the motivation\n9. Receiving love can only be done by giving love - being graceful to others to receive grace\nThe more you give, the more you seem to receive - you don’t own anything\nWhen you accept that it all belongs to Divinity, then all selfishness disappears\nLife is a drama, we are just the actors."}, {"ref": "UK81-7", "summary": "1. Communion Practice - Gururaj comments on his experiences during the Communion Practice\nWhy so much suffering? - answer is that no one suffers - suffering and pain is also a joy\nNo creation without destruction - using the period of preservation in between these\nThe blinding beauty of the journey - everyone can go on this journey - you return perfumed"}, {"ref": "UK81-8", "summary": "2. The destructive force in man - the nuclear threat\nCreativity and disillusion - there is no destruction, just transformation\nMan fears the destruction because he fears the loss of his ego - sense of clinging\n3. Through meditation discover the ‘Isness’ that you are in reality - then there is no coming or going\nLose the individuality into universality, then you see no destruction, only life everlasting\nMan must not lose hope - no Age of Enlightenment - find the oneness that exists\n4. Need for radical thinking to prevent the misuse of nuclear energy\nThere have always been wars - inventions are not new - you can control yourself not the powers\nRealise through spiritual practices that nothing can destroy me - fears are just superimpositions\nMasters have shown that integration is not just a matter of thought but has to be lived also\n5. Develop the perspective of seeing everything as being Divine - then you love, not hate\nWe are beggars - when we are in trouble we beg for mercy, we beg for peace\nTo get rid of fear (negativity) you neutralise the mind with your mantra or by chanting\n6. You can only alter yourself and then all fear disappears - ‘I am all’\nThe forces of nature are forever in conflict - we need love energy not nuclear energy\nVaried conceptions of God - we are here to learn - assimilate the knowledge, then live it\nKnowing the living God experientially and live God - the heart can experience it\n7. All problems in life can be answered through meditation if we want\nThe basis of every problem is fear which brings insecurity and instability\nThe guru can only show you the way and impart shakti - you have to walk the path yourself\n8. Benefits of attending at Courses - keeping the energies alive by practice\nAs you become more integrated, the bliss experienced is kept alive all the time"}, {"ref": "UK81-9", "summary": "2. Views on Movements and other true Spiritual Masters\nPeople join cults because they find things in them pleasing to the mind\nThe importance of the motivation of the Founder of the Movement\n3. The difference between cultish teachers and the real teachers\nBogus gurus need publicity (even adverse) as against the humility of a true guru\nThe true guru gives you total freedom - how to judge these other Movements\n4. The true guru shines the light not on you but on the path - you become illumined\nComments about Rajneesh and his tantric practices - not suitable for today\nComments about Maharishi and TM - selling God for money - mantra market\n5. Is the organisation unselfish or is it just for itself?\nChrist had few followers - spiritual force imparted in his teachings is still alive\nWhat the guru says touches my mind, but does it touch my heart - suffering comes to the fore\nThe true teacher speaks from personal experience - wants everyone to find what he has found\n6. Do not judge a movement by the number of followers - this is just a herd instinct\n‘My guru is dead’ - ‘No. Your guru is alive, you are dead’\nThe spiritual force between guru and chela once ignited remains eternal\nThe duty of the external guru is to awaken the internal guru that is within you\n7. The true teacher shows you how to lift the burden - he does not take it away\nDivinity can be reached by purity, sincerity and deep yearning from within\nStory of a Guru nearly drowning a chela to show him the yearning required to find God\nMost people join spiritual organisations to get rid of their hang-ups\n8. You start off with some belief, faith develops and then knowningness - just do things instinctively\nThe balance needed between the three Gunas - the equilibrium achieved is followed by peace\nPain and pleasure are co-existent - the principle of the Law of Opposites\n‘I am not the doer’ - the meaning of surrender - with surrender a different attitude develops\n9. Take a leap into the unknown because you are totally fearless\nThe spiritual path is the path of heroes that will do or die\nAdding emphasis to unhappiness through thinking of unhappy negative aspects"}, {"ref": "UK81-10", "summary": "2. Rapid Fire - other planes of existence - there’s only one - gradations - higher and lower worlds\nExistence on other planets - Higher intelligences trying to warn us\nIn meditation one can reach all levels of existence\n3. Useful purpose of Peace Organisations is very limited - elected people are in control of policy\nWe are pressurised by a high level of publicity - promises made by politicians are seldom fulfilled\nHow much energy should we put into teaching or should one concentrate on self-development?\n4. The effort should be made to change man and not try to change the world\nWith every bit of unfoldment or betterment in ourselves we are helping the world\nBecoming a better person casts a positive reflection on the environment\nDetailed explanation of the Tratak Practice\nOpening up the Ajna Chakra, the third eye helps to develop greater awareness\n5. The power of a concentrated, one-pointed mind is like a laser beam\nStimulation of the Pineal gland - secretes Maletonin which regenerates and rejuvenates\nBenefits of the practice - reason for using a candle - appearance of an after image\nPower of visualisation used in sending spiritual energies in healing\n6. A concentrated mind is a very relaxed mind - experiences during Tratak are encouraging\nAll spiritual practices are very simple - the path to Divinity is very simple\nAll these spiritual practices are gifts of God given for the benefit of mankind\n7. Clairvoyance, occult powers and Siddhis are dangerous distractions on the path\nIf these powers come, enjoy them but don’t get stuck there\nThe Law of Grace - it can only be explained indirectly\n8. The concept of grace - drawing grace, purifying oneself like drawing on fresh air\nPeople don’t pray, they bargain with God - prayer is a purification\nThe power of prayer comes when the mind is tranquil - prayers are mostly requests\nWith purity from doing spiritual practices, you don’t need to pray - your needs are always fulfilled\n9. Gururaj is lovable because he just loves - evidence of invisible grace portrayed tangibly\nIs purification painful? - the pain is from the scrubbing needed to get rid of the dirt\nWhen a person suffers, he deserves to suffer that pain - he has brought it upon himself\nDevelop strength through spiritual practices and then you won’t be affected by the pain\n10. Rise above pain and pleasure, live in joy and bliss - two aspects of the same\nWhat attracted us to you? Only love, nothing else - we’ve been together many times"}, {"ref": "UK81-11", "summary": "2. Finding balance and refinement in relation to sexual matters\nMan has the ability to allow the animal or God-man side of him to pour through in the same act\n3. Sublimating sexual energy is a fallacy - the mental craving remains\nAccording to Freud every mannerism, movement etc is an expression of a sexual urge\nThe totality of love-making is a meditation\nBy sublimation, mental repressions are formed which have to express themselves\nInhibition is wrong, trying to control is wrong - discipline is necessary\n4. Get rid of inhibitions, be natural and when you are yourself, the discipline is automatic\nInfidelity is due to a lack of communication from heart to heart\nHousehold incompatibilities - man-made laws of morality\nThrough integration find the Divinity, the oneness in the spouse\n5. The quest for beauty - finding beauty in the ugliness - seeing the beauty of an ugly tree\nEverything that is manifested from goodness must be good\nDiscipline must be brought about by understanding, not by injunctions\n6. Love must flow and not remain stagnant - the flow must be spontaneous\nThe question of sublimation does not remain - unification of the spirit\nWe have to find the naturalness by personal integration\nRajneesh advocates that by giving animal instincts vent, they dissipate themselves - not true\n7. Tantra Yoga can lead to permissiveness\nThis form of Yoga should only be practised by those at a high evolutionary stage\nThe deep state needed can only be reached by a person who is integrated\nGururaj told Rajneesh that his teachings lead to debauchery\nThe two extremes - sublimation and permissiveness\nInjunctions are of no use if the person hasn’t the primal purity within first\n8. We cannot judge anyone - avoid the two extremes - find the middle road with our practices"}, {"ref": "UK81-12", "summary": "1. Communion Practice - explanation for newcomers - sit back, relax - don’t stare - just gaze and enjoy\nExplanation of his experience, the journey, merging into that light\nMerged away into Divinity, the source - tempted to stay away\nComing back, Gururaj sees the suffering in the minds and hearts of loved ones\nHow does one reconcile to the illusion of suffering?\n2. Comments from those present about their experiences during Communion - mostly inaudible\nRays of light, white and gold - blue light all over\nExperiencing a sound like Aum - seeing the room covered in gold\n3. Seeing oriental features - Gururaj disappeared and a star of gold and lilac remained\nGururaj says its not necessary to have any experience - it means nothing\nAll those present have been touched by His force - Gururaj is just an instrument."}, {"ref": "UK81-13", "summary": "2. Explanation of how the Personal God, the Avatar and Ishvara are connected\nThe Personal God is a concept to please man’s analytical mind\nBeyond the Personal God is the Impersonal God which is an energy that is qualityless\nFor this neutral energy to be of value, it has to be manifested\nIt is the inherent ability of the Impersonal God to concretise itself - like fragrance from a flower\nFrom the primal Impersonal force, the entire universe has come about\nThe unmanifest Impersonal assumed a certain vibration - the Word - arising from the Big Bang\nThe atom has the ability to duplicate and replicate itself - into a gaseous form and then into matter\nThe motion in all forms of life is the consciousness or life force\nThe trouble with evolution began when it reached the stage of man because of his thinking ability\n3. All conflict and suffering are not from Divinity - they are within the confines of relativity\nPersonal Gods are the creations of man’s mind - they are regarded as Father\nThe totality of the universe composes what we know as the Personal God - a continuum\nIn the manifestation, the vibration that condensed itself in various forms is the Personal God\nThis is at the level of the superconscious mind\nThe sum totality of all relative existence is the Personal God\nIn meditation, we transcend the Personal God and go to the Impersonal God - to nothingness\n4. The mind cannot comprehend the abstract - the Personal God can be anyone, wife etc\nTo find the Personal God, one develops devotion, acceptance and surrender\nReasons why we worship Christ or Buddha - a concrete object - theologies give qualities to God\nThe Personal God is not the absolute because it has qualities\nThe world and other Planets make the Avatar incarnate - when evil rises he has to come\nWhen an imbalance occurs, the Avatar comes to restore the equilibrium, the calmness\n5. Turbulence is created by the emanations in the world, by the negativities which arise\nThought forces on the earth - interaction of the Gunas with the earth\nThe evil in the world attracts the Avatar - he takes human form to go to the trouble spot\nHis greatest suffering is to be born on earth - he has to grossify himself to become human\nHe has to live as an ordinary person to find himself, to unfold, to realise who he is\n6. Avatars start teaching at the age of thirty - they teach what people can understand\nNeed to balance the development of the mind with the expansion of the heart\nThe Avatar doesn’t speak on the intellectual level - reason for parables - he shows the way"}, {"ref": "UK81-14", "summary": "2. Good intentions to relieve the suffering of others can turn out badly\nQuestion of the motivation behind what you want to do - good deeds can be valueless\nWork for the sake of doing it and not for the reward, for the recognition\nHelping should not be as a duty - done without force or compulsion, not for a return\nWhen you teach meditation, you are benefited more - cleaning the hose - it’s a dedication\nDedication contains devotion and commitment to yourself - having a Divine desire\n3. Meaning of Divine will - things have to function in a certain way - within the laws of nature\nIndividual will arises when we start analysing and evaluating - to fulfil one’s own ego\nGood intentions can have no power if based on the needs of the ego\nStory of the old man planting the mango trees - for the benefit of others\nDoing a good deed for selfish reasons is totally fruitless\n4. Use discrimination to check if the so called good intentions are really good\nThe person who seeks Divinity must be brave enough to leap into the unknown\nYou cannot know God, only infer what it means to you - you cannot explain the infinite\nAs we do our practices, our awareness increases and perspective is enlarged - view of the Alps\nThe path becomes joyous - the path too is Divine and the end is Divine\n5. We should proceed through life not thinking of the goal - become the observer of life\nEverything depends on thought processes - just observe the thoughts - become aware of the real doer\nIf you are still in tranquillity, neither blame or praise can affect you\n6. Our relationships with others should be such as not to hurt with word or deed"}, {"ref": "UK81-15", "summary": "2. Rapid Fire Session - putting pet animals to sleep - what happens when lethal injections are given\nEmotions of an animal are denser but of a purer quality to a human’s\nExplanation of conditional love - true love is questionless - one spirit in a human and an animal\nAnimal has a greater understanding instinctively - it doesn’t analyse like a human does\nThe animal not having thinking ability could express itself with its inner self - it can feel jealous\n3. The animal doesn’t suffer the same way we suffer - suffering far less - like a mentally retarded child\nAn animal responds to love - love for an animal is of superior quality\nIt is opening up your heart to selfless love - rebounds back to you\n4. Attachment to animals - in love there must be no need, it must be a spontaneous expression\nMan can help an animal’s evolution in the next life - the animal reacts to human emotions\nWe, as protectors of helpless beings benefit - every good deed must have its reward\nDeath of the animal releases the subtle body from the grosser allowing its evolutionary progress\n5. Seeds planted in the mind of the animal condition its future incarnation\nThe missing link in the intermediary stage cannot be found\nDuring the process of evolution from animal to man, therein lies the missing link\nIf a human is fed with intense love, it will be reborn on a higher evolutionary scale\nWhen gurus talk of love, they transcend the earthly plane - the goal is God\nIf you ask me “Who are you?” - I say “I am the lover of the world, the lover of life”"}, {"ref": "UK82-1", "summary": "2. How can one find happiness? - happiness is synonymous with Divinity\nWhere does suffering come from? - unhappiness and suffering are in your mind\nDifficult for the mind to evaluate correctly - guided by previous experiences\n3. The only answer is to go beyond the mind to find peace and understanding by meditating\nA greater awareness develops - wider viewpoint - see things in a more positive light\nNothing in the world is bad - misery in retrospect may be seen as a lesson\nThe opposite may be needed to bring out the truths - opportunity in adversity\nWe have the wrong beliefs because we don’t have the proper faith - stealing in church\nDivinity is not unjust - what is happening to me is according to the law of karma\n4. Why blame outward circumstances - it is me that is making me unhappy\nThere is no such thing as unhappiness - it’s a creation of the mind\nView every situation objectively - know that you are alive - the soul is immortal\nIt’s all in the flow of evolution - whatever happens will lead you to Divinity - nothing is lost\nCome what may, I accept it and I surrender it to whom it belongs\n5. Thinking of yourself as that eternal entity, there is no unhappiness existent\nPast experiences can be clarified through meditation - fears lead to organic diseases\nEnjoy the present - miseries are intrusions upon your real self\nThat which you find to be miserable are interpretations of the mind\n6. The finest steel is made in the greatest heat - we need the turmoil to evolve\nFace it bravely with the knowledge that this too must pass"}, {"ref": "UK82-2", "summary": "1. There is no God - God is a creation of one’s imagination - you find it’s within you\nYou have to realise the kingdom of heaven is within - when we do, we can say “I am that I am”\n2. Understanding the concept of “I and my Father are one” - need to conceptualise this concept\nTo live in the present, we can really find the joy within ourselves\nEach moment is infiltrated with that energy - we appreciate Divinity - deep meanings to this\n“Do what you feel is right” - this creates trust, faith and acceptance\n3. Professors of Philosophy study books and give lectures but don’t understand themselves\nTo realise oneself, to find the inner being within, which will give you the peace within yourself"}, {"ref": "UK82-3", "summary": "2. Places being significant power points and vortexes of energy for pilgrims\nGod is omnipresent - these are physical power points - the story of Atlantis\nParts of the crystal found in Atlantis are scattered in Cape Town, China and Glastonbury\nThe physical energy radiating all the time energises humans - you benefit from it if in a quiet state\n3. Psychic world watching us - mediums only contact through our subconscious mind\nPsychic abilities - people go to mediums because of personal insecurity - attachment to the dead\nWhat happens to life after death - there is no death at all just a change of form\n4. Bodies are taken by souls to work out impressions gained - dust and dross have to be shed\nTheory of the Black Hole - new universes being formed - all in a cycle - nothing can remain static\nAs the universe ends, your real self continues on until it merges with the endless spirit\nThere is just a oneness, a none-ness which is the everything-ness, the basis of all life\nThere are two Gods, the Personal God of our conception and the Universal God beyond conception\nAs we meditate we have glimpses of the Impersonal - we do not know with the mind but experience\n5. Because of man’s insecurity, he tries to find something higher than himself on which he can depend\nThe Personal God is created by man and the Personal God creates man\nExplanation of how God creates man - currents congealing into matter etc\nThe first emanation which we call the Personal God was sound, the Word\nWhen we say man created God, he created a concept - primitive man had his gods\n6. The Personal God is the concretised energy which emanates from the Impersonal\nMeaning of ‘God punishes’ - controlling energy gives a reaction to every action\nEveryone is connected by subtle energy - concept of God is a controlling factor in our lives\nHow karma affects us - Divine energy is fair - reasons for miseries\n‘Lead Thou me on one step at a time’ - how to create a credit balance\n7. Through effort and using gurushakti, our actions spontaneously become right\nWhen the mind is quietened, a solution to our problem comes - benefits of prayer\nReaching the deepest levels of the mind through meditation - the quietude that exists there\n8. The superconscious is connected to everything - tapping into the entire universe\nImagination and the power of image making - the universe is imagination\nConcept of Maya - nothing is unreal, all is reality - what is unreal is your analysis of it\nYour attachment to things is unreal - the real self within is beyond pain and pleasure\nCourses are necessary for people to hear things from a different angle - story of the frog in the well\nAt first a start with the concept of God, start experiencing God and then start living God"}, {"ref": "UK82-4", "summary": "2. When faced with a problem, the tendency is to take flight - what to do?\nBasis is an inner feeling of insecurity or inadequacy - insanity is to run away\nThe ego stands in the way - fear is instinctive in man - need to activate the intuitive site\n3. The only thing to fear in life is fear itself - benefits of meditation should be for the whole day\nFighting a problem - evaluate and assess it - solution dawns - we have to face the crisis\nPeople are trapped and frightened into running away from fear - solution is what can happen to me?\n4. As the Gita says “Perform action for the sake of action and not for the fruits thereof”\nWhere can you run to? - death is not an escape - when faced with a problem, do your practices\nQuieten the mind, the problem becomes smaller and you find the courage to face it\n5. The secret is to get the mind away from the problem - sleep on it - the solution dawns\nWe exaggerate problems - face them come what may\nThe world cannot exist without conflict - Divinity never created fear, only man did\n6. God created love and joy - qualities forever flowing not stagnant - not a problem, only excitement\nIt’s exciting to be confronted by challenges - part of the activity of life - problems adding to each other\nReside momentarily in the gap between thoughts - inner energy comes\n7. Does acupuncture lead to a balance of mind, body and spirit? - it’s limited to the mind and body\nHarmony exists within, just a question of recognising and experiencing it\nFeel the peace within - act like the poem ‘If’ - draw from the inner resource - live God\nYou become a living prayer - all problems disappear - reformers try to take man up to God\nWhat we are trying is to bring God down to man - drawing from the well of mercy and joy\n8. Aim to have the proper attitude, brought about by meditation - understanding of life\nThrough surrender you develop non-attachment - difference between detachment and non-attachment\nNon-attachment is to be in the world but not of the world - it’s the secret of happiness\nSpiritual Practices actuate the energies and brings harmony but not overnight - all are interconnected\n9. The harmony is a continuum, no separation - there’s the need for a sick person to be treated wholly\nIf a chakra is sluggish, it can be activated by spiritual practices to allow the energy to flow\nAcupuncturist needs to be very intuitive - only works on the body - meditation goes far deeper"}, {"ref": "UK82-5", "summary": "2. How can we help a person who is angry - not to be done for selfish reasons\nTo help another we have to be strong within ourselves - may have to let the person be angry\nYou need to have deep love within you - the love just wells up and the angry person feels it\n3. Help yourself first - love yourself first before you can help or love another\nNearly all people suffer guilt - we don’t really love ourselves, our spouse, our job etc\nNeed to strengthen ourselves - we don’t even love God - with prayer ‘He will do this for me’\nForgiveness - moral concepts not truth - truth is to be loved, to be practised\n4. One moment you love, next moment you hate - superficial and superfluous\nWhen man learns to love himself, he cannot but help loving others - do unto others\nThe true meaning of all theologies has been lost - moral concepts\nIf self analysis is backed up by spiritual practices, all hatred and anger will disappear\nGururaj speaks of being maligned by members of BMS - he felt no anger - let them play\n5. We fight against ourselves - the turmoil is in our minds\nThe only person that can change us is ourselves through self analysis - facing problems\nLife is but a play - watch it as a play - all the hurt will disappear - give hurt and the hatred back to God\n6. This requires strength gained through harmony - if not strong enough, be angry with anger\nTo help an angry person you have to be strong, otherwise don’t try\nAs the awareness expands, you move from morality to purity - laws of morality are man made\nWhen purity of the spirit is allowed to flow, you are not bound by karma - actions are non binding\nYou’ve gained freedom, you are liberated - have become a law unto yourself"}, {"ref": "UK82-6", "summary": "2. Rapid Fire Session\nQuestion asked about activities happening in Cape Town - Gururaj helping people in hospital\nMasters are in contact with one another - why one hundred and eight chants in a round\n3. What happens after death - no light comes to meet you - it’s your own light within you\nThere are no out of body experiences, just projections - matter of dual consciousnesses\nThe real way to die is with full consciousness - achieve this through your spiritual practices\n4. No need to fear death because it’s unknown\nWhen you shed the body, you feel so free - in a finer environment\nWhen dying, if your thought forces are strong enough you can meet a person in their subtle body\nThere recognition occurs, a communication takes place with the entity without words\nEvolution is always progressive, at death your life is reviewed in a flash\nWe choose our parents, they don’t choose us - holy men and evil men being reborn\n5. In reality there is no death - in the evolution after death, you see how to put things right\nWhat is going to happen in the hereafter is determined by the belief you have now - Muslims\nThere is no heaven and no hell - it’s all here and now - dying in an accident - no suffering\n6. Using your mantra while dying - explanation of how a mantra is derived\nYou are the mantra - difficulties in deriving some mantras\nContact has been made spirit to spirit - the day your mantra is derived is when you are initiated\nThe importance of the spiritual strength and force sent with the mantra - transforms people’s lives\nYogis like Yogananda choosing the time of their death - their bodies being preserved for days\n7. No one can remove all the problems of the world in one go\nNo Age of Enlightenment - continuous flow of souls into this world and from here to higher planes\nWe are all travellers on the path - the path and Divinity are but one\nThat is the way, that is the life, that is the truth"}, {"ref": "UK82-8", "summary": "2. If we were all Christs in spirit, why is the coming of an Avatar so special for all of us\nThe Christ spirit is a universal consciousness - how we can capture this\nThe consciousness can only embody itself because of the so-called evil in the world\nEverything has an aura - the aura of the world creates the attraction for the Avatar to come\n3. There is always conflict, balances and imbalances in the world - without conflict, it would collapse\nThe universal force that becomes embodied is in everyone but in latent form\nThe Avatar has to go through the ordinary motions of life until he realises who he is\nYou might not recognise Jesus because your awareness has not been sufficiently developed\nThe teachings he gives might be difficult to accept - that is why Jesus spoke in parables\nThe Avatar is the son of the supreme God because he is His emanation\n4. The Avatar is the saviour of mankind because he shows you the way to work out your karma\nThere is only one way - living in the truth\nRecognition comes too late - he can incarnate anywhere in the universe - you attract him\nThe Avatar comes to free mankind from their sufferings over time - non importance of miracles\n5. Lazarus was the only one enlightened - he rose from ignorance to light, not from the dead\n‘Arise, awake and do not stop until the goal is reached’ - find the peace through meditation\nChrist never suffered - you are Divine - do not think that you are simple\nI say be yourself, then you will find the truth - go beyond dogma - what the Masters teach\nThe Christ spirit has to be experienced - then nothing matters - blame or praise have no affect\n6. We force the Avatars to come - it is our duty to recognise and serve them\nWe have to live their word and do whatever we can to propagate the word\nThe churches have not taught the true message - they have created many conflicts while doing good\nNot the outward trappings and ritualism of the churches but the underlying truth\nForthcoming disasters - Avatars teach of love - bring peace - greater understanding is needed"}, {"ref": "UK82-9", "summary": "2. Rapid Fire Session - deep bond between two people draws them together\nHow a chela can use the spiritual force emanating from the guru - special link formed\n3. Drug taking takes you into other realms of the mind, there’s no spiritual growth from it\nSpiritual practices allow the inner self to come through and provides greater awareness\nDangers of smoking cannabis while drinking - should not be legalised - all destructive\n4. Helping a mentally ill person - direct gurushakti towards them\nUse of shock treatment as a cure can be detrimental - use meditation instead\nMental illness is caused by a disturbance of mental energies - Gururaj helping insane patients\nDrug takers and alcoholics all want to get out of the habit - they suffer from a disease\n5. Help them by encouraging them to meditate - listen to tapes, take responsibility for their lives\nCan life be prolonged? - need to start from childhood - what is the sense\nMystery schools teaching esoteric teachings - there is no need for these\n6. Our message is to create harmony - the message is so simple filled with sincerity\nAnyone can start up a mystery school - find the mystery school of purity and love inside oneself"}, {"ref": "UK82-10", "summary": "2. Explanation of the three Gunas - symbolised in mythology, Brahma, Vishnu and Shiva\nAs energy condensed into solid matter, the opposites came about\nWithin the Personal God you have opposite qualities - he rewards and punishes figuratively\n3. First came emanation, then expression - Rajas came about automatically\nRajas is the actuating force of Sattva, light and Tamas, darkness - both opposites are but one\nFrom the Personal God came the universal mind which contains the three Gunas\nMan has a yearning to go back to the source - there is no individual mind\nIndividuality is both an illusion and a reality - depends how you view it\nUnderstanding a grain of sand, you know the structure of the entire universe\nCreation of the universes - the Big Bang theory - all action is because of the three Gunas\n4. Explanation of how substance was created and how things became individualised\nEvolution came through expansion for everything up to the stage of man\nIndividuality came about from man’s thinking ability - nothing can remain static\nMan’s battle is between Sattva and Tamas - but the two want to unite\nIn our actions, light can dominate by practising meditation - then there’s no destruction of Tamas\n5. The enlightened man has found the balance between Sattva and Tamas - Rajas is still active\nHe realises that he is the universal mind - he knows everything\nOne has to lose individuality and merge into universality to reach back home\nHaving reached the universal mind, you realise what the Personal God is all about\nThe ego has to be refined - realisation comes that all opposites are true - one way to find peace\n6. Underlying love there is hate but here Sattva dominates - trying to bring balance\nExplanation of the secrets of eternity - ‘Night of Brahman’ - near perfect balance achieved\nEternity means the elements remain the same but are forever changing\nThe underlying factor is changelessness - complete balance - all three Deities dance\nLife is valuable - few become one with the Personal God and transcend that into the Impersonal"}, {"ref": "UK82-11", "summary": "1. Love is a living reality - comes from grace and Divinity, of which you are the totality\nI am love - discovering the I am ness of love, you discover the I am ness of yourself\nThe mechanics of suffering stems from your mind - it thinks it is suffering\nThought is a reproduction of patterns embedded in your brain\nYou can’t start by controlling the senses - you just cause inhibitions and repressions\nDraw from the superconscious and infuse the subconscious and conscious minds\n2. With spiritual practices we draw that force from the Divine reservoir into every aspect of our lives\nFinding that Divinity, we find love - finding love, we find God\nNo need to suffer - your inherent right is joy - problems created by the smallness of the finite mind\nWhy do you cause me suffering seeing you suffer? - you want to remain in bondage\nHumans are deluded by their own thoughts, their minds, their patternings\nYou have never been separate from the Father - you come from nowhere and go nowhere\nThe energy of Divinity is only now - there is no past, no future, only now\nTime and space are just concepts of your mind - Divinity is present in its fullness"}, {"ref": "UK82-12", "summary": "2. Is spiritual development always progressive or do we take two steps forward and one step back?\nNo development, only unfoldment - always progressive - experiences help us to unfold\nAdversity may be an opportunity to learn - we imagine retrogression arising from adversity\nEvolution is always pushing you on to reach home - life works in cycles - the axle and the wheel\n3. Need to reverse sometimes - part of progression - tendency which means freewill\nEverything is guided by Divine will - how the mind plays tricks - journey ends like a circle\nYour destiny is to meet your Maker - finding yourself means find your Maker - not apart\n4. Through spiritual practices one brings the mind in touch with the heart - both from the same source\nPatternings of the mind don’t allow us to see the truth - reach the centre - then actions have no affect\nBurning the seeds of karma, you are released from bondage of the mind\nThe real self becomes the observer of what the mind is doing - separating the small ‘i’\nEverything in life is a joy - find the inner joy in everything that appears adverse\n5. ‘I think I exist’ and this is the root of my problems - only He exists\nMan suffers because he is either living in the past or projecting himself into the future\nOur teachings teach to be here and now - dangers of projections\nNo one feels troubled here now because you are here to learn\n6. Measuring time in a linear fashion - why not vertical instead of horizontal\nBe in the centre and once in the centre you will know the value of that which is Divine\nWith this realisation, you will know there is nowhere you came from and nowhere you’re going"}, {"ref": "UK82-13", "summary": "1. A book of Gururaj’s poetry is to be printed soon - three new books on the way\nPicture of Christ sketched by an artist after Gururaj had worked on an identikit image\nPicture not to be published just yet - the money from it will provide Ashrams for IFSU\nThe picture is what Jesus really looked liked - one day Gururaj will tell the true story of Jesus\n2. Jesus is existent in the world, embodied now but you will not recognise him\nHe might be sitting right amongst you and yet you might not know him\nQuestion about a reunion in the next life with a person who has passed away\nThe spirit within you reincarnates, not your real self - ego is forever searching for freedom\nFreedom for itself - ego feels important because of self preservation\n3. Lose yourself by drawing the grace of Divinity through gurushakti - ego loses its power\nRealise the ego is non-existent - when its empowered, we find the joy in life\nWhen you realise that ‘I am not what I am’, you know what ‘I am’ means\nYou are Divine, I am that I am - all just happenings to the small i\nStory of the three monkeys - seeing evil is mixing up the object with the subject\nSeeing the object, there can be no ugliness - we rise above it through meditation\n4. Rise above the laws of opposites, that of pain and pleasure to reach the area of joy and recognise it\nGetting rid of fear from the known to the unknown - no difference, they are but one\nNo dividing line between life and death - you are the living dead because of fear of the unknown\nAdvice to listen to tapes over again - story of how the father has learned a lot"}, {"ref": "UK82-14", "summary": "1. Purification Practice - Gururaj chants in Sanskrit at the start - Gururaj explains the Practice\nSpeaks about a booklet explaining the Practice being prepared in America\nGururaj afterwards continues to speak about death and dying\n2. With spiritual practices you can experience death in life everyday - you can die consciously\nIn death you merge away into a different dimension, which is so refined, so subtle\nIt’s more blissful than what you know of life - there is no death because you are immortal\nThe fear of the unknown causes all the suffering - you don’t remember being reborn many times\nWe cling to what we assume to be existence - only when you know your inner self\nYou are just a conception of what you think you are - patternings in the mind\n3. The mind doesn’t want to lose its existence therefore it fears\nTo be aware in sleep is the first stage to be aware of what is death\nThe purpose of life is to be fearless and to live life fearlessly\nWhat do you bring and what do you take with you?\nYou go nowhere after death, for all dimensions are contained in this universe\nThe body is shed, your soul goes forward - the soul comprises of your thoughts, ego self\nThe soul goes to the subtler dimension to evaluate itself\nIt does not burn in the fire of hell or experience the joy of heaven - these are conceptions of religions\n4. The soul decides where to be born and to whom in order to learn in this school of life\nDeath can be experienced every time you go into a deep meditation - very few are at that stage yet\nLet us be consciously alive and not deadly alive - there is only life\nThe mind doesn’t want to lose possession of itself"}, {"ref": "UK82-15", "summary": "1. Communion Practice\nGururaj starts with the breathing practice - the group breaths in the same rhythm\nThe one spirit of life is the breath you breath - develop a rhythm\nGururaj speaks about what happens during the Communion Practice\nHe goes through the entirety of the universe within - why do we separate ourselves from Divinity\nWhy must you suffer? - let there be tears of joy\n2. Gururaj speaks about the journey - you traverse the entire universe to merge into Divinity\nThe suffering experienced is having to come back into this body\nGururaj starts singing ‘Onward Christian Soldiers’ and the Group join in\nThe beauty of life is here and now, for God is here and now\nThe message is to be yourself, not whoever, but ‘I am ever’\nThe guru is a guide and only shows you the way - you have to go yourself\n3. Gururaj sings in Sanskrit"}, {"ref": "UK82-16", "summary": "2. Be conscious of the beauty that lies within - give me your suffering\nGururaj reads the contents of a letter - discovering oneself through giving - unfolding of the heart\nBe conscious of the growth within oneself - be awake, be conscious - awareness comes from the heart\nGururaj makes comments about the contents of another letter which is read out - psychic powers\nNo psychic power could have a bad influence on you if you are strong\n3. Use the energies within and be strong - realise the Divinity within yourself\nMotivation behind feeling good towards someone - how mediums function\nHow is it going to help you going to a fortune teller, a psychic or a mind reader - all rackets\n4. People go to psychics because of a lack within - psychics develop a little ability - to make money\nFind the truth within yourself - bring permanency by infusing the Divinity within into the subconscious\nWhen you become aware of that Divinity, you are alive - be aware of life\n5. Gururaj refutes communication with people in higher dimensions using a machine - rubbish\nUnder the influence of psychic energies can lower entities take you over? - never\nAnswer is to be rid of fear in your mind - no one can possess you - stay away from psychics\n6. Be in the company of holy people - read good books to find knowledge\nDo your spiritual practices regularly - with that comes love and devotion\nWhat I teach is to find the living God and to bring the living God into life\nThe only way of knowing love is opening yourself up to love by unfolding\nYou cannot give love - it just wells up, it’s a spontaneous flow\nDangers of believing in astrology - story of the couple and the advise horoscope\n7. You read a horoscope or go to an astrologer because you feel insecure\nA true astrologer can look at your face and know - knowingness doesn’t come from the mind\nNo horoscopes for you - the best way is to accept the day and pray that it be pleasant and peaceful"}, {"ref": "UK82-17", "summary": "1. Chairman reads out a number of Questions at one time about the following:-\nThe more we meditate the greater seem to be our imperfections?\nOrigins of spiritual knowledge? - Raja Yoga and how the other Yogas fit in?\nObstacles to real progress in the householders path?\nSai Baba and his miracles, are they Siddhis? - Christ taking away the sins of the world?\nBalancing negativity in the Britain by a small group meditating together\nGururaj answers all - no one not even Christ can take your karma away - can help to make it easier\n2. In meditation, you come across difficulties - have more - thereafter the greater the progress\nThe guru holds up a mirror to you - we don’t want to admit our weaknesses - facing yourself\nYou are really facing your mind - we’re all escapists - these are the problems I have to face\nTrue spiritual teaching means face yourself, know yourself - the guru is the mirror\nIn meditation you feel discomforts because you have to face yourself - seeing the dirt of the mind\n3. The mind requires projection - it’s confused, it’s incapable of thinking\nThrough spiritual practices you learn to observe the inner workings of the mind\nThe mind has the problems, not the spirit - where do you attach the importance?\nHow you react to circumstances of life, therein lies the beauty of life\nGo beyond the realms of pain to the area of joy and bliss - everyone can go there - so simple\nChange the direction for the mind and you will find the eternal spirit forever there"}, {"ref": "UK82-18", "summary": "1. Gururaj reads a poem ‘The Meaning of Life’\nGururaj reads a further three poems written by other meditators\n2. Is loneliness real or is it a state of mind?\nThe difference between to be alone and to be lonely - to be alone, you are with that which is\nLoneliness is an experience of the mind - proceed from loneliness to aloneness\nLoneliness is a dependency and aloneness is independency\nThe mind is so patterned you want to feel lonely - created by desire, a need\n3. Through spiritual practices you slowly lose loneliness and become alone - you are never alone\nProblems in marriages - we fail to see the simplicity of life - complexity is created by the ego self\nFlow in the moment to God - people here present are not seeking God, only solutions to problems\nThere will always be problems - stop dwelling them - infuse them with inner energy\nHave the thought that you are Divine and all problems start dissolving\nStop being afraid of the unknown - nothing is unknown if you open up your hear\n4. The group start chanting ‘O Bapuji’ with Gururaj singing alternately"}, {"ref": "UK83-1", "summary": "2. What message can one give to someone who has lost their trust in God?\nHope springs from faith - without faith nothing can exist\nGururaj gives an understanding of how hope can be created - freewill gives us emotions and feelings\nWhat is happening has nothing to do with the Divine, for Divinity is fair\n3. Whatever you are going through is because of your own actions\nDivine force will flow according to the capacity of the recipient - every child is my child\nDevelop understanding and awareness through meditation - know the value of acceptance\nSacrifice and surrender follow - your lower mind surrenders to the higher mind\n4. Quieten the mind, understanding dawns, grace is drawn - everything is good\nEvery circumstance has a purpose to it - the force of evolution is always pushing you on\nThe need to listen to these tapes many times to grasp the meaning\nThen the understanding begins to seep in - comparing one’s life with others\nLife is a joy, a celebration - understandings are given, hope arises - there’s less greed\n5. Find the unity with the Divine self - let it permeate every cell of your body\nNo place for despair - find the stillness within - the troubles are still there\nMeditation gives a different perspective\nInstead of feeling hopeless, you realise you are hope"}, {"ref": "UK83-2", "summary": "2. When one reaches the stage of enlightenment, will one recognise it\nThe greatest experience is no experience - all experiences are confined to the mind\nYou are the mind - reasons why we find certain experiences to be negative or miserable\n3. The dual existence which the mind conceives - there is no individuality - drops of water in the ocean\nNo such thing as absolute knowledge or absolute bliss - in Samadhi there is no bliss, you just are\nDivinity is beyond all experience - knowledge can be an impediment to merging away into the Divine\nThe meaning of ‘The universe is real, the universe is unreal, only God is real, the universe is God’\nReality and unreality can both co-exist - our concept of reality is limited reality\n4. Drawing from that infinite source, you can live as God on earth\nFinding the total unified state, you become non-attached to the world - all becomes one\nYou become the energy that gives life to existence - the secret of gurushakti\nThe only way to draw grace is to become a good recipient\n5. Samadhi is the aim of everyone, of total mergence while still in the body\nYou become yourself - then you can answer the question ‘ Who am I?’\nDrawing that infinite force to you - lighting up the world with love\n6. Concept of both God and man being in the world and not of the world\nMeaning of the trinity, three different aspects of the same thing\nOur failure to recognise that which is Divine - our duty is to find that integration\nMeaning of Nirvakalpa Samadhi in the communi
