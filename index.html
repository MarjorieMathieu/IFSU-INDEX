on practice\nTo find peace we need meditation and understanding coupled with effort\n7. Suffering represent shedding off unconducive samskaras from you\nSuffering is but an offering - with greater integration, you become more attached\nPeople using my teachings for their own means - I still love them\nThe energy is flowing to you but are you doing your bit - no magic wand"}, {"ref": "UK83-3", "summary": "2. Question about intercession, gaining wisdom through love, intelligence, Black Holes\nMeaning of ‘Nobody goes to the Father except through me’ - reach the stage of Christhood\nA true teacher tells you with authority because he has experienced that - theology misinterpreted\nGod’s will, what God, who knows God - the guru is putting you on the right path - you will reach there\n3. You come from nowhere and you’re going nowhere - your real self is beyond time and space\nSupreme Divinity has no will - concept of the Personal God - in bodily form worthy of love and devotion\nThe universe going into the Black Hole but the vibrations remain, to explode again\nThe Personal God is the one that is all love - sum totality of the universe\n4. Entire existence is but a process, proceeding to greater awareness of the motion\nUnderstanding of the love of God is the process and the very process is God - arising from God’s will\nMisinterpretations of the opposites of love and hate - arises from the ego grasping to preserve itself\nThe egoself is the hate in us - need to refine the egoself\n5. Refine the ego so that the higher self shines through - cleansing process - concept of mergence\nYou don’t merge with God, God merges into you - reasons why Incarnations come back\nLove is spontaneous, it cannot be defined but experienced - merged with wisdom\nExplanation of the difference between knowledge and wisdom\n6. Jokes"}, {"ref": "UK83-4", "summary": "2. Rapid Fire question and answer session\nThe Father Son and Holy Spirit are three aspects of the same one - no separation between the three\nPrayer has to go to something concrete, no abstract like the Holy Spirit\nYou just need to understand the meaning in good books, the essence, not just the words\nListen, ponder and practise - we need words that could inspire us\n3. Meaning of the causal body and the causal plane - five sheaths of the body\nCausal body is the direct result of the Manifestor that caused it - three aspects to man\nIn the subtle state the subtle body evaluates its progress before taking on a new body\nYou are the mental body and the spiritual self - they are not apart from you\n4. The meaning of the gift of tongues - it is the mental self where energies are released\nNothing to do with the real self - just psychic energies which can be developed by anyone\n‘Sri’ is an appellation of respect while ‘Ji’ suggests a closeness\nSignificance of dreams - Freud’s view that a dream is an expression of an unfulfilled desire\nA dream is a release of energies - nightmares are relief valves - release samskaras in dream form\n5. Interpretations of dreams is useless - Gururaj explains how you can understand a dream’s content\nEveryone dreams except the self realised man but some dreams don’t come to the conscious level\nSpiritual wisdom in India was always there - just revelations - like happens during Gururaj’s talks\nCame from Rishis meditating - same source for music - thoughts floating around\n6. The Vedas are the highest teachings in the world - Gururaj’s talks go beyond Vedanta - Attributeless\nBlake’s mystical poetry - Rishis are everywhere not just in India\nDisharmony in a family when one member starts meditating - considered weird, a cult\nExplain what meditation is - proof is to try it - experience the benefits from meditation\n7. If a concept is explained, the opposition to it lessens - you are helping people to evolve\nAnimals have certain instincts highly developed - they feel the peace within you, they can drain you\n8. Teaching others higher truths - other influences trying to warn and teach us - UFO’s warning us\nVested interests are not going to stop dangerous inventions - help from spiritual practices\nInfluence of business on Governments - only one way, help people to unfold their hearts\n9. Comments about Satya Sai Baba - an ordinary man, no Avatar - manifests ash\nGururaj’s practical joke manifesting a sweet for a gullible Professor - so simple to manifest\n10. Sai Baba has done good work - his followers think he performs miracles - no miracles\nManifesting ash is an advertising gimmick - don’t judge, think of everyone to be good\nBelieving the catastrophe won’t happen will help to avert it - the mind forces things to happen"}, {"ref": "UK83-5", "summary": "2. Learning from the past - forget the past analyse it, but not live it\nAnalyse the sense of guilt - observe what happened, find the causes\n3. Programme for rehabilitating prisoners - reason for their actions - repent and the guilt will disappear\nWith analysis find the cause - in God’s eyes, no one is a sinner\nMorality is made by man and not God - a bad act arising from a mental perversion\n4. The past will continue to come up until you resolve the problem within yourself\nRepentance is a kind of self analysis - bring joy into the lives of others\nResolving the past can build a better future - learn from mistakes, not let them be dominant\nLight and darkness will always coexist - let the light be dominant - mergence not dominance\n5. Rising above the laws of opposites into the realms of nothingness, Sunita - become the observer\nRise to where you can observe the happenings - be in the centre of the seesaw\nReach the centre within yourself - evolution is pushing us onward - not judging others\n6. We can’t understand a guru’s actions when we are not gurus - blaming God\nUsing analysis of the past, we can modify future behaviour\nWith greater awareness, we can observe and see everything as light\nLife is a play with no reality - me and mine creates the miseries\n7. Do not allow the past to fill you with guilt - any action done with purity is good\nTrying to live in the present, then we overcome the darkness"}, {"ref": "UK83-6", "summary": "2. Explanation of the Purification Practice - a prayer to help you calm down before meditating\nSound of a bell or a gong ringing has a calming affect - pronunciation of the words - sound of each\n3. The practice must be done with deep feeling and sincerity - afterwards you feel calm and pure\nWater is used as it is a purifying agent - the two healing fingers give forth most energy\nThe reason for touching is to make the words have greater effect\nIn Part Two you are going down along the body - Punata means again\nThird part is a Pranayama mantra - you repeat the syllables inhaling and exhaling\n4. Demonstration of how deep breathing is done, filling with revitalising force\nCombination of Pranayama and contemplation - afterwards you will remember to say kind words\n5. Story of the three monkeys - progress is expedited - once on the path you never turn away\nQuestion asked about the Movement in the future, losing members, Gururaj’s lineage\nPeople can never drift away from that which is Divine - ten percent only are true seekers\n6. People opening their own centres and charging for mantras they have copied - doing great harm\nExplanation of how a mantra is derived - the sound being the person’s personal vibration\nThings done for the sake of money - mention of the two who left and sold mantras\n7. The help you receive is 25% from your vibration and 75% from the spiritual force given with it\nThe reasons for people coming - never force anyone to stay - total freedom to come and go\nWisdom given comes from personal experience - the guru is just a guide - no tradition\nI come from the tradition of Masters, the greatest lineage that stems from Divinity\nWrong for a disciple to carry on like his Master - tradition is narrow - soup of the soup\n8. A true Spiritual Master speaks from the level deep within himself and his guide is God\nForget tradition, no validity - truth has no tradition - accept what you can but don’t reject it\nThere is always opposition to a true spiritual force - Jesus had few followers - despised, rejected\n9. A true Spiritual Master can take on the suffering of others - give me your suffering\nLife is made to give of whatever you can"}, {"ref": "UK83-7", "summary": "2. Communion Practice - during the practice sit still, relax and gaze gently\nGururaj speaks about the journey travelling through the solar system, the colours, the vastness\nOn his return seeing the suffering, turmoil and turbulence going on in people’s hearts and minds\n3. Description of experiences, mainly inaudible and the responsive comments by Gururaj\nChanging faces, violet and gold colours - covered in golden light - an emanation of the spirit\nWhite light and tremendous heat - sound - the energy emanating creates the pulsation\n4. The pulsating energy cleanses one and unfolds the heart\nLight coming from Gururaj’s palms - one hand going up while the other goes down\nNot necessary to see anything or have any experience\nBeing present during the Communion Practice, you’ll never be the same again\nEveryone has been touched by the hand of God - flow of heat - the vital force\n5. Disappearing and rising up - levitation - sweetness in the mouth\nThe minor chakra inside the mouth gives of drips of nectar"}, {"ref": "UK83-8", "summary": "2. Rapid Fire question and answer session\nGururaj’s interpretation of the Lord’s Prayer\nA prayer should well up from the heart - significance of ‘Our’ and ‘Father’\nLet Thy Kingdom be expressed outwardly in all my daily actions\n3. I surrender my little will to Your will\nLet me live day by day and not accumulate riches for their sake\nLet me love my enemy - forgiveness is an outward expression of the deep love within\nThe temptations in life - Buddha being tempted and tested\nWhen we realise that everything is Divine, we can do no wrong\nHis power functions in everything\n4. The prayer shows us how to love God and how to lose ourselves in God’s power and glory\nWhen the prayer becomes an essence to you, you really know and live the prayer\nConception - qualities of a woman in bringing up children\n5. A woman evolves through caring, compassion and deep love\nSymbolism behind the Adam and Eve story - primal manifestation in female form\nThe saying ‘Where women are worshipped, the Gods are well pleased’\nThe great sacrifice of a mother is helpful for spiritual unfoldment\n6. Helping third world countries - money wrongly spent on nuclear devices and weapons\nMake the poorer countries self supporting instead of them looking for handouts\nThe Personal God is both male and female - it is an energy which can manifest itself"}, {"ref": "UK83-9", "summary": "2. The idea of separation being an illusion created by the mind - illusion comes from reality\nIn true communication duality does not exist, only feeling remains, like love\nLove knows no duality - words are unnecessary, just a glance is sufficient\n3. Expressing a truth that is felt within - is an image an illusion or a reality?\nThe cause, the effect and the causation - the image is an illusion and you are real\nFrom the Absolute viewpoint, the world is an illusion - reality is the spirit within\nThe mind takes us into believing the illusion is real and the real to be the illusion\nYou just know that there is a God - that is the only proof of the existence of God - comes from the heart\n4. Unfoldment is opening the heart - the mind denies, the heart accepts - faith comes through effort\nPrepare the ground, open the heart and Divinity comes - seeing goodness always to condition the mind\nPeople are trying to escape from themselves into an illusion to give temporary peace of mind\n5. With the illusory mind we have attachments - the illusion brings suffering - rise above the senses\nConditioning the mind to preserve the ego - validity of any idea - forming attachments\n6. Through meditation we neutralise the mind - only one reality and that reality is Divinity\nYour ideas and concepts of reality are the illusion - philosophies being mental gymnastics\nTake your eyes inwards and see the light within - rub away preconceived ideas\n7. Different views but the essence of everything is but one\nWith the memory of God in mind, no action has a karmic value\nThen any action performed doesn’t bind - the actions of true Masters are non-binding\n‘Be established in self and then perform action’ - rise above the bondage"}, {"ref": "UK83-10", "summary": "2. Questions about the meaning of prayer, using crystals for healing, names hurting one\nQuartz crystals have no value in themselves\nThe energy in Atlantis came from a crystal - how the explosion from the crystal formed the Continents\n3. Where the splinters from the crystal ended up are highly spiritual points\nIf you are strong mentally, nasty words have no affect\nAny criticism does not affect a true Master - the negativity affects the initiator\nIs it real prayer or wishful thinking? - first deserve and then demand\nGod gives you not what you want but what you need\n4. Praying should not be begging or bargaining - give first and then receive - ask for nothing\nPreferably ask for betterment of yourself to do good - people praying when in trouble\n5. Your prayers are answered by yourself, your inner self, the real being that is you\nSolutions to problems just dawn - the inner voice\nThere are no miracles - just using the finer laws of nature\nBy going deep within you activate these finer laws - done selflessly\nNo demonstration of powers by a true guru\nIn true prayer the small ‘i’ must be forgotten - life should become a continuous prayer\n6. Children being subjected to violence and murders - recommend the right teaching for them\nPray to be rid of our faults in a quiet state of mind"}, {"ref": "UK83-11", "summary": "2. Christ’s teachings - his forgiveness for his tormentors - he tried to bring about social reforms\nVast consciousness in a small body - the Father had not forsaken him - his agony was of the body\nHe shared his joys and sorrows with ordinary people to show them - yet he was the Son of the Father\n3. ‘Forgive them Father’, talking of the ignorance in the world - showing his compassion and love\nHis life was taken on the cross because of people’s ignorance\nHis closest ones deserted him - the greatest favour He did for the world was to be crucified\nThe true story of Jesus has not been told - religion has lost its true meaning\nThrough meditation you can experience that beautiful force within and know Christ consciousness\n4. The true purpose of life is to become one with the Father - time when Jesus realised who the Father was\nTwo words sum up his teachings, love and peace - for peace has to have love\nLove is brought about through self integration doing spiritual practices - purpose is to become whole\nFind the peace within and it will radiate outward - the peace we seek is to be alive not dead\n5. Only twenty four words were spoken by Jesus, the rest were interpretations - this force is alive today\nMany theories about the life of Christ - the story of Jesus not dying on the cross\nThe real meaning of ‘No man goes to the Father except through me’ - Krishna said the same thing\nExperience is the real teacher - Christ healed very few because they were not ready\n6. Identification with all existence - sense of immortality - feel it - then there’s no fear left\nAttachments due to patternings and preconceived ideas - non-attachment is the secret of joy\nSignificance and meaning of the cross - He suffered for our sins, He showed us how by his teachings\n7. The significance of Lent - thoughts should be directed to Divinity - next to the glory of God\nGururaj’s perceived criticisms of Churches and their leaders - priests should learn meditation\n8. Speaking from the heart has more value than speaking from the mind\nPriests just doing a job - true teachers teach with a glance or in silence\nHow people’s lives can be transformed - making the world a better place\n9. Feeling the vibrations in the stones at Avebury - state of innocence achieved through meditation\nGururaj’s work has to do with vibrations, mantras etc - the story of Atlantis\nOne can feel the radiation from the crystal chips scattered around the world, if one is refined enough\nThe universe and civilisations operate in cycles - inventions mentioned in the epic poem, ‘Ramayana’\n10. Avebury was a landing site for aircraft in past ages\nStonehenge was an observatory for the Astronomers\nThe stones at Stonehenge were put in position using air cushions like at the Pyramids"}, {"ref": "UK83-12", "summary": "2. The role of Judas in betraying Jesus - deeper meaning to it - let one be killed instead of many\nDistortions in history - foreseeing that the partition of India would cause trouble\n3. Gandhi was killed to try to prevent further bloodshed - atrocities committed during the struggle\nJudas’s betrayal was a political manoeuvre to avoid war - no hatred in his heart\n4. Use of special fuels at the time of Atlantis - very advanced civilisations existed before ours\nThe significance and function of Leylines - these are energies that emanate from the earth\n5. Current technology is in its infancy - these are all to do with the mind, not the heart\nThe five basic elements which constitute the universe - must emanate energy\nViews on recent attempts to produce babies other than in the normal way\nLife starts at the moment of fertilisation - consciousness is there\nBodies are porous - souls floating in and out all the time - the soul is there\n6. Details of how a pregnant woman is looked after in India\nAt the seventh month, the baby starts a certain understanding - mother’s actions affect the baby\nReasons why you find that women form seventy percent of meditators\n7. Content of a novel refuted - man always had to work - the reasons why\nGururaj never reads fiction, only fact - books can’t tell you much\nPeople being unemployed - Gandhi’s idea how to provide employment with spinning wheels\nIntroducing cottage industries to help employment in villages\n8. The attitude of one who has no job should be to try harder for a job\nReasons why Gururaj continues to live in South Africa - can’t talk about it in public\nDetails about the situation in South Africa - Jesus was needed in Israel at the time\nGururaj would move from South Africa if there was an Ashram available\n9. A variety of jokes\nGururaj starts chanting ‘O Betaji’ and the group join in"}, {"ref": "UK83-13", "summary": "2. Everything is a celebration - with regular meditation one can become one with the inner self\nDrawing on that inner energy, the mind becomes clarified in its attitudes and thinking\nYou have to draw compassion towards you - you are born with all the virtues\nOur understanding is totally dependent on impressions - how we behave and react\nMeaning of ‘Do unto others what you expect to be done unto you’\n3. Deserve first and then demand - without integration you cannot be totally honest and sincere\nDaily prayer should be ‘Lord help me to become more compassionate, to be kind and tolerant’\nWhen you love yourself, then only can you love others - steps to becoming loving\n4. Story how Gururaj helped the man who in being so religious neglected his family\nEvery stitch in the handbags he made is Divine - he is just an instrument of the real Maker\nExample of practical religion - the entire world is a cross, a combination of God and man\nRemoving the veils that are covering Divinity using meditation\n5. Life is not a mystery - we complicate it with our minds - remove the dirt covering it\nYou will live a better life in greater harmony and peace, with so much love\nGururaj starts singing Jai Ram - God is but one - all religions are one - reference to the Emblem\nRecognition is needed that everyone is potentially and really divine\n6. God not being compassionate and merciful always? - what is meant by God and compassion\nGod is one’s mental conception - we haven’t the compassion in ourselves\nPeople try to do business with God - the separation implied brings conflict\nThe reason why Jesus said ‘I and my Father are one’ - a real example for everyone\nGod is an abstract quality - the mind is so limited to experience Divinity in the compassion\n7. We have a choice, to escape reality or to face it and find relief - facing yourself in the mirror\nDiscriminate, analyse and surrender to Divinity in a dual form - brings duality\nReligions implanted fear in man’s mind - not to store up for the next world\n8. Compassion, kindness, tolerance, patience are human qualities, Divinity is a neutral quality\nI can only forgive myself - proceed through passion to compassion\nIt is your own mind that has produced the compassion and kindness\nMan rewards and punishes himself - why you’re given freewill - placing the attention inward\n9. Through meditation you can reach the stage of surrendering to yourself, to no one outside\nMergence and integration takes place - you function holistically instead of fragmentedly\nMost religions are based on duality, as it serves their purposes\nAs you go on in meditation, you become kind and compassionate - ‘in the world but not of the world’"}, {"ref": "UK83-14", "summary": "2. How to cope with the violence and hate on television - theory of purging the violence by watching it\nDefinite affect on a child from what it sees - disagrees with laxity - violence is not needed\nStupidity and violence even in nursery rhymes - children aping what they see - act by imitation\n3. The human body is a temple of God, no need to exhibit it provocatively - the posters in Soho\nIndoctrination from films and TV is not healthy - Gururaj’s mission is to open hearts and feel love\nAfter the future catastrophe, life will continue - investment in nuclear energy and dangerous inventions\nThe solar system and galaxies will be affected - UFO’s coming to warn us\n3. Developments to plant fear into alleged aggressors - Governments not willing to let go of the power\nThe way to avert the calamity is to teach spiritual practices that could open hearts and develop love\nYou can’t change people collectively but you can transform them individually\nNo help at all from Tarot Cards - ascertaining the future is useless - live in the present, here and now\nIf God is abstract, why is there any need to praise Him in chants and hymns?\n4. The God we pray to is the Personal God - an emanation with attributes\nFrom the Impersonal God came the Personal God or the universal mind\nExplanation how the universe came about and how it works in cycles - the totality of the process\nExperience the Personal God in meditation - praising the Personal God because we are part of Him\nPraying to an object outside yourself, you become free - become totally within - no separation\nWith devotion to a Personal God, reach Christ consciousness - on to the stage of the Impersonal God\n5. How to go beyond the thought process to the ‘nowness’ we seek\nIn meditation as the mantra recedes, a thought comes up and then you pick up the mantra again\nLet the thoughts come, don’t analyse the thoughts and don’t force the mantra - become the observer\nIn meditation we dive deep down, draw from the energy and it helps us to live a more harmonious life\n6. A variety of jokes"}, {"ref": "UK83-15", "summary": "2. The paradox of trying to control our egos yet trying to love ourselves unconditionally\nThe ego is the sum totality of experiences - conflicts arise in trying to control it\nBest way to banish conflicts is to refine the ego, then the light of the absolute shines through\n3. The impressions go back to their original sources - attraction of like minded people\nThe ego self is subject to the laws of Karma - you can’t banish Karma\nThat which is there requires expression - how you can change the course of your life\nYou get what you need - unpattern the conditioning - not control, rather clarification\n4. Man is the master of his destiny but not from the thinking level - rise above the circumstances\nReaching the finest level, you recognise your real self - life is an art\nTo become lovable, become loving\nWith a change of attitude you accept the turbulence\n5 & 6. A variety of jokes"}, {"ref": "UK83-16", "summary": "2. Explanation of Yoga Nidra, a yogic sleep\nThe practice releases tension - be in a deep sleep and yet be totally aware\nA greater awareness of the spirit within develops and comes to the fore\nProgressive relaxation with your mantra, pranayama and visualisation involved\nStart off rotating ankles, relaxing muscles etc\n3. Raising and lowering left and right legs six times\nTensing and relaxing muscles\nTaking attention to the breathing - rotating the head\n4. Stretching the arms and clapping, done six times\nAll actions should be done with rhythmical movements\nFinal tensing of all the body muscles, flopping back and allowing the thoughts to come and go\nImagining a cool comforting breeze around the tip of the nose\n5. Move the breeze down over the eyes, nose and lips, down along the body\nBring the mantra down to the navel area - picture a blue haze there with the mantra in the background"}, {"ref": "UK83-17", "summary": "2. The day will come when there are no more questions to ask\nBuddha taught in silence - problems were resolved by themselves - the recipient has to be ready\nAnswers given will make your mind enquire more - reach the stage of ‘I am love’ not ‘I love you’\n3. Difference between knowledge and wisdom - reaching wisdom, you have reached the totality\nWhen love only remains, God remains - you become the real observer\nBecome non-attached, so no conflict remains - only Divinity that is there remains\nThe meaning of ‘I am the way, the truth and the life’ - trying to put eternity into a nutshell\nTo become one with the Father, one has to reach that universal consciousness as vast as God\n4. There is only one life and life is love and that love is God - he who really lives life, lives God\nAim to reach the centre - reasons why people start on the spiritual path - centre is changeless\nNo reality in the world around you - you live mostly in an illusory world - really see the beauty\nViewing everything from the centre the past, the present and the future become one\n5. Realising that darkness must pass - different attitude, different way of thinking\nStart living instead of being the so-called living dead - become awakened\nSurrendering to the Isness within, we come to learn and know the true Isness\nDying to be born again means discarding the mental self that put you in turmoil\nStories about Jesus returning to earth - He is always here - consciousness is eternal\n6. That consciousness is already here in an embodied form but how many could recognise it\nHow to come to terms with illness in the family - just accept it but you need to be strong\nState is due to past Karma - send them love to ease the problem - a guru cannot take away Karma\nThe reason why Jesus cured very few - a guru can rebalance the energies\n7. Story from the Mahabaratha - Gururaj’s Dharma is to serve humanity - helping brings its rewards\nWhat happens in the case of adopted children - you choose your parents - no accident\nChild and adoptive parents have an affinity - both learn from the experience\n8. No accident in the adoption - love develops from a selfless act - improve how the child is selected\nRemove the hatred in the world and it fills with love"}, {"ref": "UK83-18", "summary": "2. Schizophrenia is a question of two lives being lived practically simultaneously\nMedication gives only temporary relief - story of the patient in Cape Town\nCured through special forms of meditation so that he could forget the past life\n3. Medical sciences normally treat symptoms - don’t analyse but dissolve the causes\nMost troubles originate from the subtle body - correct the imbalance or blockages there\nMeditation helps to prevent disease - the pure energies help to avoid what may be coming\n4. How to help release stress and tension - written on people’s faces\nYou yourself are making yourself stressful - stems from within - wholeness in healing\nQuestion about recognition of previous lives and the existence of other inhabited planets\nNo benefit in knowing previous lifetimes - go insane - vain idea of previous importance\n5. Greatest gift is the ability to forget - how is it going to help to remember\nBecome one with our inner selves to realise who we really are - no dabbling in the unknown\nDangers from developing mental powers - they are the real demons\nHow to love someone who rebuffs attempts to love them - expecting a reward\nSome are sensitive and take longer to respond - just love for the sake of loving\n6. No new thoughts - all thoughts can be brought to a reality - emanations\nThe ‘I am’ is beyond all thought - thought is tangible - no thought exists when you just know\nConcept of reality and unreality\nHallucinations appear to be true visions - in true light they disappear\n7. Projection of the mind or hallucination in seeing Gururaj beside one?\nPersonalities of previous incarnations are never lost - exist in impression form now\nYou are the sum totality of all you have been - rise above good and bad to become neutral\nGood and evil and the story of Adam and Eve - symbolic and mythological\n8. They threw themselves out of the primal joy when they started thinking - no snake\nThrough thinking, temptations came - conflicts arose - battle between good and bad\nBefore they started thinking they flowed with nature - once developed, greed - fall of man\n9. Pythagoras becoming enlightened through mathematics - great brain exercise - zero\nThe greatest asset is a sense of humour - talks underlined with fun and joy and laughter"}, {"ref": "UK83-19", "summary": "2. The Communion Practice\nGururaj goes into meditation and becomes one with Divinity\nAfter the practice he describes the journey through the universe and becoming one with it\nProceed from Cervikalpa Samadhi, becoming one with the Personal God\nNirvikalpa Samadhi - leaving existence while still in the body to merge into the Impersonal God\nYou become identified with That, the Isness - you become the joy, you become IT\nWhen you come back, you see the sadness and turmoil in people’s hearts and souls - why?\n3. Explanation of experiences of those present during the practice\nSeeing lights, seeing everything through the third eye - all is light - develop the art of seeing\nMany faces superimposed - energy released seen in the form of colours\nMost dominant colours were while and gold - subtle lilac mist\n4. Deep warmth of peace in the heart - seeing a crown of thorns - don’t talk about it\nBecoming you is total mergence - entire existence in a flash - experience of pain, empathy\nIn Samadhi radiating an aura - it is felt locally - feeling of dancing producing ecstasy\n5. Seeing the energy in colour form - in a photo of Gururaj, a blue background coming out green\nReason - radiating a yellow golden light turns blue to green\n6. The entire universe can be experienced in colour or sound\nThe appearance of being sad is really joy - sad to see the suffering when you come back\nHearing a vibrating sound like Aum extended"}, {"ref": "UK83-20", "summary": "2. The mechanics of a child’s mind\nA child’s mind starts at the moment of conception but is not cognisant of its workings\nImportance for a pregnant woman to have good thoughts and actions - Eastern tradition\nTraumatic experience for the child being away from the mother’s womb\n3. Initial impressions affect the child as it grows - importance of influences up to the age of three\nIndividuality comes because of the impressions - intuitive flow - having the right impressions\nA person affected later in life by impressions gained before the thinking processes started\nThe child while not yet thinking is more intuitive and more impressionable\n4. Do’s and don’ts block the natural growth - planting fear - communication at a finer level\nAt the age of two recognises things but not on the thinking level - just impressions - red colour\nA child has a working mind in impression form - you can’t bluff a baby\nFrom the age of three, a child tends to become affected by happenings around it\n5. A child liking a lullaby - the importance of the first three years - parents shouldn’t quarrel then\nWhen the child starts using the analytical side of the brain, the troubles start - comparisons\nEffect of samskaras and hereditary values - helping a child accept its circumstances\n6. The influences which parents and teachers have on a child at the early stages\nChildren being subjected to so many murders on TV in our sick society\nPlant ideas of non-violence by treating the child gently - how to protect the child\n7. Children learning bad habits from a peer group because basically they want love\nBecome better parents by being better meditators\n8. A variety of jokes"}, {"ref": "UK83-21", "summary": "2. How to overcome inhibitions and fears of inferiority, inadequacy and guilt\nHave a planned journey through life, not wander through it - going to higher levels of the mind\nBe unconventional with the boundaries of life - play the game of life\nWhen you enjoy the gift of life, there are no inhibitions\n3. Creativity knows no inhibitions - try to live for the moment\nExplanation of a pranic kiss - Gururaj puts you on the path to God, does not show you God\nInhibitions produce phobias - there is nothing to fear\n4. Using positivity to get a job - Gururaj using visualisation to get a contract signed\nYou can demand anything of life and you can have it\nRise above one’s actions and thoughts\nHow to stop having negative thoughts - it needs determination and perseverance\n5. Recommendation to bring a friend to the next BMS Course\nEnds on a laughing note with jokes"}, {"ref": "UK83-22", "summary": "2. What we can do about the increasing violence in our lives\nIt will increase because man is so mixed up - reformers couldn’t change things\nEconomic pressures on Governments - vicious circles - murders and rapes on TV\n3. A great calamity will happen around 2050 which will effect the entire solar system\nAim to achieve peace within yourself, not world peace - injunction ‘Man know Thyself’\nNo spiritual force in sermons - you can only give if you have - practical knowledge\nThe need for integration - how to bring it about\n4. Light shining through into the conscious mind - you emanate a radiance of beauty and love\nReach the deep still level and ‘Be still and know that I am God’\nLoving become spontaneous - no difference exists - let light flood one’s actions\nGod is the eternal infinite energy within you - emanate that peace\n5. Put it into practice - you cannot force it - conflicts come from the patternings\nWith spiritual practices we lighten the burden - no the inner self - experience the joy\nPeople wanting instant success with meditation - business gurus - money making racket\n6. Gurus are guides - see the Divinity in everyone - spiritual path is the path of heroes\nDetermination and perseverance is needed - scrubbing away the dirt of many lifetimes\nFacing yourself in the mirror - recognising your weaknesses, then take action\n7. Man doesn’t need to suffer - meditation dissolves the dirt\nThe violence in the world has the tendency to get worse - become more loveable beings\nStrive to leave the world a better person - no flashy experiences needed\n8. The talk ends with a variety of jokes\nGod helps those who help themselves"}, {"ref": "UK83-23", "summary": "2. Rapid Fire question and answer session\nHow one can relate to the spiritual world while in business\nIn business being totally efficient and yet not attached to it - detachment seen as escapism\nMeaning of ‘The Word’ - vibration - how attachments can bring misery\n3. Make your business spiritual - see everything as Divine then everything is spiritual\nDepends on how we look at things - spirituality and materiality are but one\nHealing - never heal a person unless he comes to you - you can send healing to someone\nJesus healed very few - if a person is healed of a disease, it may be transferred to his next life\n4. A Spiritual Master can heal by giving a little push onward - we do not class ourselves as healers\nOur duty is to help others - find the peace within and help humanity\nThe more integrated you are, the more love you radiate, give and feel\n5. Explanation of the two kinds of healing, magnetic healing and spiritual healing\nIn magnetic healing, the danger of the healer passing on his own negativity\nIn spiritual healing, the healer is just a channel - universal energies flow to the recipient\nWanting to heal, is it selfless or ego inspired - picturing the person in a blue haze\nValue of public demonstrations to counteract violence - be non-violent - of some value\n6. Gandhi’s non-violence - had he waited India would have independence without Partition\nThrough non-violence so much violence took place - Gandhi was shrewd but no saint - film\nYou may have to have violence in defence of what is right - act according to the merits\n7. Why so many spiritual teachers are male - ratio of male to female meditators\nSpecial qualities of a woman to be a good mother - there are so many women saints and teachers\nWith greater equality, a sense of proportion is being developed - complementary to each other\n8. Strive to leave the world a better person - flashy experiences in meditation aren’t necessary\nAttitude towards homosexuals - be sympathetic - chromosome/genetic imbalance at conception\nStrong desire coming through from existence in a previous lifetime\n9. Isherwood speaking about his homosexuality - no comments about Vedanta\nAstrology should be used just as a guideline - Astrologer needs to be highly intuitive\nAstrological charts can influence you - reason for the popularity of horoscopes\n10. Krishna’s advice to Arjuna - believing what is not true - his duty was to fight to destroy evil\nEsoteric meaning to this advice - kill the evils of the mind and be the immortal self, the spirit\nThe soul does not enter the child at the moment of birth, its there since conception\n11. Meditation is for the real world - one can use the energies in political spheres\nGreatest profession in the world is how to become one with God - economics in the world\nLove - to explain love is to explain God - not a quality, a flow from the heart\nIt’s a beautiful Divine madness filled with joy\nGururaj not remembering what he spoke about in a talk - never concerned about what he has said\n12. Problems in the world are economic - cutting unemployment benefits - many wrongs in the world\nOlder people feeling less emotions of love - no involvement in politics - I am just a Mystic\n13. Goodbye means ‘God be with you’ - don’t rationalise about meditation, just experience the benefits"}, {"ref": "UK84-1", "summary": "2. Explanation of how the meek can inherit the land - is there ever any justification for aggression?\nMeekness comes from strength - it is humility - the strength needs to be unveiled\n3. Misery is created by ourselves - the Creator is a neutral force - can be used negatively or positively\nYou are the sum total of all your lifetimes - these experiences are conditioning you now\nYou are so close to Divinity and yet you don’t see it - your ego self is the cause of the trouble\nSamskaras govern your life - to find the meekness, go to the finer layers of the mind\n4. Thinking a thought and making it happen - Gururaj gives two examples of this happening for him\nPurity of mind and heart gives strength - need a cleansing - healing using gurushakti\n5. Aggression and the nuclear threat - become non-aggressive yourself - it’s always there - Ahimsa\nAuras and their radiations - emanations between people\n6. Reformers on earth - Masters teaching in different ways - Tagore and his poetry\nAggression, troubles and problems are reduced when in the presence of a man of God - Dharshan\nA blessing to be in the presence of a meditator - forever emanating from the inner peace\n7. Gururaj tells a variety of jokes (not to tax the brains too much)"}, {"ref": "UK84-2", "summary": "2. Misunderstandings about enlightenment - its characteristics - visions are psychic phenomena\nObstacles on the spiritual path - it’s for heroes - a cleansing process - unfoldment is needed\n3. Experience the Divine force and live it 24 hours a day in total awareness, become totally aware of life\nSign of humility - Jesus mixed with everyone - Zen story of an Enlightened Master\nNo hankering or craving - he’s a contented man - angry for a purpose but only at the surface level\n4. A Master behaves like in the poem ‘If’ - sees the good in all - forms no judgements\nLife is but a dream - discard the negative thoughts - they go back to similar sources\nThe qualities of an enlightened man\n5. He has no fears because he realises he is immortal - everything is indestructible\nYou have the reach the stage of Christ to recognise him - awaken the guru within you - same spirit\nThe universe functions because of opposites - motion is there - yet one has to gain the stillness\nAn enlightened man acts in strange ways - a guru burning a chela’s arm - the reason for this action\n6. Listening to tapes again - different meaning - Gururaj speaks of basic truths - basis of all religions\nUnderstanding Him, developing love and with love comes devotion - spiritual and physical bonds made\n7. Need to be regular in meditation - nothing seeming to happen from meditation, yet real benefits coming\nBenefits from attending Courses - the outward benefits don’t seem to last\nDon’t dwell on experiences - you may get stuck there - developing Siddhis doesn’t help\nThe level of awareness increases with meditation\n8. A variety of jokes"}, {"ref": "UK84-3", "summary": "2. Importance of the first three years in a child’s life - impressions gained govern the future\nA child can feel - with innocence the feelings are totally true - traumatic taking a baby away after birth\nA child brings samskaras with it - sum totality of past lives - effect of love or a squabble on a child\n3. Having faith you will find in the next life what you believe - develop joy, then experience joy\nDisagreements between religions because of traditions - go beyond tradition to find truth\nIn the other dimension you evaluate your entire process before being reborn - you choose parents\n4. No need to go to an ashram - the true ashram is within you\nMind and spirit mixed together is called the soul, Jivatman - body is porous - souls floating around\nImportance of a mother having good thoughts during pregnancy - effect on the child’s mind\n5. Mother must have total peace, read good books etc - child’s mind is so susceptible\nGururaj speaks about his children and his spastic child - reason for this affliction\nChild must be given the greatest love when it’s born - qualities of a woman to bring up a child\n6. Custom in India for pregnant women - when a child starts thinking - violence in society\nDegradation of society - preteen porn - teachers need to help humanity to find the joy within\n7. Children having to smoke cigarettes with their peer group or else feel the odd ones out\nBehaviour starts from samskaras, from the womb and from first three years upbringing\nTeachers fail, parents fail and the child gets wrong influences from others - mental imbalance\nGururaj talks about using spiritual energies to bring about balance - not just shifting energies\nPsychiatrists giving shock treatment to cure mental ailments\n8. Healing - becoming an instrument for spiritual forces to flow through you\nLimitations of psychiatry - many mental problems start from childhood\nReasons for people being muddled up, the environment, samskaras and upbringing"}, {"ref": "UK84-4", "summary": "2. Interpretation of dreams - not remembering light dreams - everyone dreams\nDreaming is a release valve- vivid dreams - ability to forget past lives - can unbalance a person\n3. How Atlantis was destroyed because of lust and greed - crystal splinters at nine points in the world\nThe destructive and the healing power of the spoken word - absent healing using a blue colour\nSpeaking softly - relationship between sound and colour - activating the chakras to create harmony\n4. People not living in the present, never in the moment - spiritual practices are given to centre you\nDon’t moan over lost opportunities or someone dying - It’s not falling, it’s the getting up is important\n5. Stories about Churchill and Gandhi - their lives and behaviour - getting up after failing\nExistence is not suffering but an offering - propagated by the church but not by Jesus\nSin does not mean suffering, only a burden you come with - realise this through meditation\nLife is a celebration - develop this attitude and things come to you\n6. Meditate and everything else ‘Gets added unto you’ - finding happiness not through wealth\nEverything that happens in one’s life is evolutionary whether it appears good or bad to us\nIncarnating into another planet if necessary for your evolution - do good, you may not pass again\n‘Even on another planet, just call for me and I’ll be there’\n7. Meaning of surrender - how surrender develops from love through doing spiritual practices\nSurrender is not done wilfully or planned - develops spontaneously - comes from the heart\nYou can never surrender yourself to anyone - the two wills become one and you feel it"}, {"ref": "UK84-5", "summary": "2. Comments on experiences during the Yoga Nidra Practice - right and wrong choices\n3. How to develop discrimination - making wrong choices - provide opportunities to grow\nWhen making a choice, if discrimination fails you, consult an expert - using intuition\nAs one develops in meditation, you will just do the right thing - be yourself\n4. The quality of discrimination - subtle decisions need more intuitive ability\nUsing plain common sense in trusting someone - ever a right or wrong choice?\nOne can learn from a wrong choice - it’s wrong if you harm yourself or others\n5. Every choice is a good choice if looked at from its proper perspective - negativity is minimised\nBeing bound by the laws of karma, will determine your choice - when integrated, choice disappears\nThe ‘Isness’ is the answer to every problem in life - mundane choices are governed by convention\n6. Reach the stage where no choice has to be made - develop a level of acceptance\nWith acceptance only good things will come - ‘Thy will be done’ - virtue brings out the inner goodness\nChoice always involves friction - enter the realm of choiceless choice - flow with nature\nLife is like a river flowing over obstacles to reach its destination\n7. A variety of jokes"}, {"ref": "UK84-6", "summary": "2. The danger that meditation might make one more egocentric, escapist and less tolerant?\nWhen you function in totality, you become more kind\nMeditation gets rid of the egoistic samskaras\nThe process is to gain the awareness that all is one, oneness with everything, with all creation\n3. Expansion of awareness or consciousness - living a positive life, evil cannot enter\nYou discover your weaknesses and correct them - meditation rather leads to greater integration\nAll creation being manifested - the Manifestor being female - combining both parts within you\n4. Reaching the highest stage of relativity, you merge into Divinity - everything is Divine\nExperience the goodness within - a belief could be erroneous - magical acts\nThe illusory factor in name and form - reality in a relative way - seeing the waves only\nEverything can be turned into beauty - a problem cannot exist without a solution\nHearing the inner voice guiding you - seeing the Divinity in everyone - therefore no separation\nHow to pronounce mantras properly - the gong teaches you how the mantra should fade away\n5. Everyone is Divine, just uncover the veils - problems arising from ‘Me and Mine’\nProgressing from duality to non-dualism, to unity in the Scriptures\nReason why Jesus only started teaching at age thirty - Masters have to find their real selves\n6. The goal in life is to experience the oneness - to be good and to do good needs strength\nLife has to be practical which necessitates action - hurting others is adding on samskaras\nI will show you the path to reach your Divine goal - realising that Divinity and the path are but one\nSo easy to reach Divinity - benefits of meditation - relieves stresses and strains etc.\n7. You’re going internally in meditation and not escaping from anything - rather escape into God"}, {"ref": "UK84-7", "summary": "2. Explanation of the Communion Practice - chelas are recommended not to analyse any experience\nDescription of the journey - becoming one with Divinity - reason for coming back\nOn his return seeing the suffering on people’s faces - everyone can travel this path\n3. Those present relate their experiences - seeing something deeper than the body\nExperiencing the mantra in every cell of your body - seeing a golden light, face changing etc\nPerson having one of their senses more developed than the other\n4. Everyone in the room has been touched by the hand of God - extends out around the area\nOppressive feeling - physical effect - with the calmness inside, you’re letting go of samskaras\nFeeling deep peace - hearing sounds, then silence - the silence of the Absolute\n5 Seeing Gururaj’s faces in various lifetimes - seeing a beam of light from the palm of his right hand\nExperiencing heat or light is a blessing - unbearable heat as an energy - merging\n6. Seeing nothing at all, nothing wrong - heart palpitating - hearing Aum, the universal sound\nSound suddenly stopping - being beyond the conscious mind, you don’t feel or know\n7. In Samadhi, the body functions and the heart beats on its own, energised by energy\nTravelling from darkness to light - sight and sound are allied\n8. Commenting on the statement ‘He who knows does not tell and he who tells does not know’\nImpossible to relate the experience - Masters can talk about it but cannot explain it\nSeeing Gururaj disappear completely - rising up\nTeachers seeing Gururaj in the room during initiations and in other locations\n9. Using Gururaj’s name to provide protection when attacked, like using gurushakti\nRequest to send details of unusual experiences to Chetan"}, {"ref": "UK84-8", "summary": "2. Importance of the Preparatory Teachers - they form the link between Divinity and man\nThe path is not easy but the burden gets lighter - the guru helps to reduce the burden\nThe power of the guru’s presence in one’s life - a guru is a catalyst to show you who you really are\n3. Looking at yourself in the mirror - people do not live as they truly are - false idea of themselves\nWe fear ourselves - be yourself - realise that you are nothing, then you’re equal to everyone\nLose the sense of ‘I-ness’ - blockages prevent the glory of God to permeate you\n4. Discard the ego - I possess nothing - greed will disappear - get rid of the cravings\nPeople make their lives miserable - misery is not God’s creation, you create it yourself\nAccept what is there, but just don’t moan - life is filled with change, everything is changing\n5. The problem with concepts of the mind - the guru helps you to make your life as joyous as his\nEveryone has the capacity to enjoy God’s love and peace - he favours no one\nOne needs a lot of nonsense in one’s life as well as common sense\n6. A variety of jokes"}, {"ref": "UK84-9", "summary": "2. Explanation of belief - mental concept of God - a fictitious figure, you haven’t met him\nThere is no heaven and no hell - all is here and now\nGururaj’s belief system founded on experience\nThe foundation of belief should be experienced - belief depends on one’s personal conceptions\nExperience the force of Divinity permeating within you, then you can never deny it\n3. False prophets have not experienced anything\nHow can eternal damnation coexist with Divinity\nWhen the church couldn’t hook you with love, they conceived the threat of eternal damnation\nOn the spiritual path nothing can stagnate - it’s always flowing towards good\nThere are no rights and wrongs in life but be honest and sincere\n4. Believe what you want to believe in - moving the burden of the heart\nAim to become alive through experience - real truth is the feeling inside, the deep love within\nHave a onepointed belief system - symbols in religion are reminders of the teachings\nMerging with the picture of Gururaj so that both become one\nThis comes from experience and not belief\n5. A variety of jokes"}, {"ref": "UK84-10", "summary": "2. Gururaj has come to give teachings that surpass Krishna’s, Buddha’s and Christ’s\nA true messenger of God does not stand aloof - all masters are close to their folk\nThe concept of a trinity cannot exist when you find the oneness - it’s verbalisation\nThe memory of this togetherness will linger whether you do your practices or not\n3. You will feel a certain change in you after this Course - things will dawn on you\nYou can only be a teacher if you teach - the service provided in leading a person to Divinity\nSpread the word of love and peace in the world - give comfort - live in peace, read good books\nGururaj is teaching and talking on other planets all the time - his needs are little\nRequest to transcribe his talks on to paper and compile them into books\nOperate like the Ramakrishna mission and their publications - editions will go on and on\nGururaj leads the chant\nEdit the teachings because the spoken word is far different from the written word\n4. Comments about the book ‘The Master Reflects’ - Vidya has another book almost finished\n‘Don’t let my work be lost’, ‘Appeal from the bottom of my heart’\nThese talks surpass the Vedantas, the Bible, all Scriptures\nI’m not going to be with you for too long - six thousand years before I come back"}, {"ref": "UK84-11", "summary": "2. Is it possible to reach enlightenment without spiritual practices, simply through the grace of Divinity\nYou cannot move a finger without the grace of Divinity - you have to act to receive the grace\nYou have to nurture your life through spiritual practices, then grace comes automatically\n3. You have to prepare yourself - the more deserving you are, the more you will get - grace is within\nBecome receptive - remembrance of Divinity - realise that nothing is apart from you\nIllusion of separation is created by the mind - God pervades and permeates everything\n4. We become concerned with reflections, not reality - when you know yourself, you know everything\nSpiritual practices are totally necessary to become self realised - you’re preparing the way\nGetting rid of dirt needs perseverance and determination - have to work to achieve one’s goals\n5. Viewing everything to be separate is where all the problems in our lives begin\nAs the heart expands, it becomes more filled with grace - experiencing Grace\nIt’s the pain of life that teaches you most - reasons for Spiritual Masters suffering illnesses\nPhilosophers have to admit that there is a God, a force which moves the world\n6. The devil is really the suffering and obstacles created by ourselves\nThe story of the King and the maid servant - catch the grace - small self loving the big self\nBy finding grace, you emanate it - the effect of the mantra and the spiritual force with it\nMasters give an understanding of grace - they are generators, not intermediaries\n7. Jesus showed us that he identified with us, to draw us out - to show no separation\nNo one does you wrong - drawing negativities - benefits of spiritual practices\nSuccess comes through failure to make you strive harder, to be stronger - effort and self help\n8. Resolve to do meditation becomes stronger - not reacting - it’s the reaction that is harmful\nComparison of Eastern and Western philosophies - turmoil and upheavals in India\n9. Stories of Mullah Nassrudin and jokes"}, {"ref": "UK84-12", "summary": "2. Pure consciousness is the Manifestor and assumes different forms - cannot be comprehended\nHas varying degrees - manifestation in name and form, projections of the mind\nManifestation and Manifestor are one - all actions are performed through pure consciousness\n3. Divinity is the doer, not us - only the essence matters - judging good and evil doers\nDo not condemn anyone - limitations in judging others - death of the ego to find the real life\nWorshipping many gods - various aspects of the one god - not looking at the causes of things\n4. The sage has the realisation of the essence of things - every action is inspired, a right action\nGururaj acting as a mirror to a person to see himself - in turbulence become the surfer\nAs awareness develops, attitudes change, mixed with deep love - see the goodness, not the fault\nIf I want to make a better world, I must make myself better - emanation and reflection from you\n5. We become limited because we drift away from the purity which is really us\nAttachments - nothing belongs to us - only thing that is yours is that pure consciousness\nReligions preach morality which is necessary for the stability of the world - morality keeps changing\n6. Right ways of living come about by opening the heart - clarity of mind comes through practice\nExpress pure consciousness through love, right doing, right actions, right thoughts\nGururaj’s teachings explain how to do this - forget the why, the results will come\nTurmoil in the world is brought upon people themselves - a lesson for them to learn\nHelp through offering prayers and not be despondent - take it as it comes\n7. We should not blame anyone else - I accept it - sublimating the ego\nLife must flow and not be stunted - act in innocence, gentleness - love as a mental concept\nDon’t be a do-gooder - good must be done by itself - an act of kindness reaches its target\nHow pure consciousness works to help\n8. The giver is always the greatest gainer\nNothing adverse can happen to a person who lives in pure consciousness\nThe great Spiritual Masters were so ordinary\nTotal acceptance of oneself - through meditation, allow the stillness to penetrate mind and brain\n9. Jokes and stories about Mullah Nassrudin"}, {"ref": "UK84-13", "summary": "2. Questions about senility and second childhood in old age, about cot deaths and samskaras, demons\nSenility comes about from lack of mental activity - its basis is to do with one’s way of life and thinking\n3. Senility can be avoided by mental activity and drawing on that force within\nDevelop awareness and serenity - not compatible with senility\nSamskaras as thought forms strengthen the tendencies which are self existing\nImpressions form tendencies which are called Samskaras - no solid base - can be got rid of\n4. You have to go beyond relative happiness and reach the stage of neutrality i.e. pure consciousness\nImbalances are created - a moment of rest with a pendulum - on either side is eternity\nEvery pleasure has a germ of pain in it - live in the moment of stillness - be not affected\nHow to become timeless and spaceless without boundaries - know the meaning of eternity\n5. We do not really exist - only one existence and that is Divinity - our existence is a mirage\nWe need to unfold to that which is really ourselves - feeling peaceful and calm not lasting\nThe success in an operation when the patient has a calm attitude - higher self in play\n6. Divinity cannot create a samskara in you - you do it yourself\nConcept of death - clarifying the samskaric body, like making ghee, boiling off impurities\nCounting our blessings, looking on the positive side - samskaras control our lives\n7. Tendencies have to find expression - samskaras have no lasting value - concept of ‘no mind’\nSeeing the spiritual force operating in everything - develop that inner strength\nReasons for cot deaths - suffocation or babies just stop breathing - due to conflicts\n8. Doctors knowing very little about the inner self of a person - should be more intuitive\nThe mind can override samskaras to create more suffering and make impressions stronger\nSpiritual giants like Christ or Ram Tirtha can leave their bodies at will\nMessage of Christ dying on the cross - example for us to bear our little sufferings\n9/10. A variety of jokes."}, {"ref": "UK84-14", "summary": "2. How to cope with death - you can only cope if you understand death\nFrightened of death because of the unknown, always fearful - try to die while living\nDeath is a passing from the shackles of this body and letting the mind go free\nPlane of existence beyond the body is a projection of the mind\n3. Evaluation in the subtle body - at death there is no tunnel and no light coming towards you\nNothing comes because everything is within you - you see a person as a projection\nNothing to fear - difference between soul and spirit - soul is the subtle or mental body\n4. Unconscious desire on the part of a young person to die suddenly - his samskaras caused it\nOnly through the physical body can we change the tendencies of the subtle body\nThrough meditation using the mantra you can burn up the seeds of karma\nThe stupidity of believing horoscopes and fortune telling\nThe mind is influenced all the time - form of hypnotism - be yourself\n5. Having the right attitude - no one is going to evolve me except myself\nLive every moment as if it is your last, then the passing over becomes joyous\nRepattern the mind with a better attitude - in reality there is no death\nWe imagine that we are better than we are - boosting our egos\n6. Being sad at the loss of someone close can be because of attachment\nGururaj realising that his guru’s spirit is everlasting when his guru died\nDeath shouldn’t be feared because there is real beauty on the other side\nComforting and helping those who are dying\n7. Developing an inner strength then fear will evaporate - all fears are unfounded\nThe less we make our needs, the happier we are\nAcceptance of what we are - be yourself - we don’t need to know our past lives or our future lives\nBenefits of meditation - praying after meditating - scientific way of reaching the love of Jesus\n8. The basics is to see the light - the closer the more pleasurable death becomes - you are free\nEvolution is always progressive - you are essentially Divine - thin film dividing you from It\nThere’s no evolution in the angelic state - definition of an angel\n9. Mediums do not have contact with people that have passed on - they are not highly evolved\nKarma doesn’t arise from an unsuccessful operation - no guide channelling the writing of books\n10. Become self realised in this lifetime and you won’t have to come back - only Avatars need to come\nComing back on another planet - teaching in silence - transplants and ventilating machines\nThe suffering from committing suicide is ten fold in the subtle body"}, {"ref": "UK84-15", "summary": "2. People think that they think but then all creativity is lost\nReal thinking has originality with no preplanning - Gururaj’s talks are totally creative\nModern communication destroys thinking - content of books\n3. Meaning of understanding - depends on one’s background - origin of thought\nTeachings are always based to suit the times - true creativity comes when close to Divinity\nFears of non-conforming - few understood Blake’s mysticism - Carl Jung and his symbols\nParables were used by Jesus so he could be understood - myths have deeper meanings\n4. Seeing the creativity within the person - total absorption when being really creative\nEverything is created by thought including food, clothing, etc. - vibrations in cooked food\nIf we are strong, nothing can influence us - being a non-conformist in religion and painting\nHow to develop creativity - only one creative thought - created by itself, Divinity\n5. Once Divinity is captured, it can be expressed in so many ways\nThe universe has come about by itself, while its essence is Divinity, the Manifestor\nWe do not live in creativity - we are influenced by all around us\n6. The purpose of life is lost by outside influences, by friends, circumstances etc\nReal creativity is when you stand on your own feet and think for yourself\nCreativity is an essence - what Gururaj is saying has been said before - same source\nWhen a person speaks from the essence of himself, it goes to the heart, not just the mind\n7. Intellectual gymnastics in recombining thoughts - nothing there being original\nPeople go to school just to make a living - story of teacher speaking from the heart\nComments about Gandhi and his life style - he had some originality\nBecome creative by diving deep within yourself, then you know everything\n8. Value of myths and mythology and the truth behind them - true meaning in the Ramayana\nLet us not think that we think but let us think not to think\n9. A variety of jokes"}, {"ref": "UK84-16", "summary": "2. Explanation of the Purification Practice\nThe reason for using water - purifying oneself to see, hear and speak no evil\nSanskrit language is pure - how it was derived by the Sages - using the healing fingers\n3. Explanation of the meaning of the Sanskrit words in Part one\nSecond part is a repeat of the first section, going from the head down and back up\nThird part is a pranayama mantra, done with in and out breaths alternately\nComplete exhalation and then breathing in quickly - regulated in a rhythm\n4. It’s an involvement of the body with a mental prayer at the end - can be practised at home\nExperiences of those present during the Midnight Practice\nFeeling alone and hearing the word Aum - energies throughout the body\n5. Aware of being an observer of colours and flowers - feeling of great peace\nMeaning was experiencing the absolute self looking at the relative\n6. Room being filled with golden light - high spiritual colours - heart racing - stillness\nCraziness of Yogis - seeing the Divine side and the human side of a guru\nGururaj developing closeness with his chelas - not untouchable or on a pedestal\n7. Lives become transformed, become closer to Divinity - face gets softer\nReverence to a teacher, a living guru - he can communicate with you\nTurning your mind - coming in contact - drawing energies - uplifting feeling\n8. Love without selfishness or ego boosting - acting for the sake of doing\nThe more you use love, the more powerful it becomes\nMan meddling with test tube babies, genetic engineering - cloning is so dangerous\nGururaj does not encourage anything artificial - science wants to show its progress\nDevelop the silence within yourself first - people feeling the silence when Gururaj speaks\n9. People are not touched by words but by the power behind the words\nShow a person that there is opportunity in adversity - repattern the thinking\nEffects of alcohol - drugs stunt evolution while meditation helps you to evolve\nContraception can be justified in certain circumstances\n10. An act done in the mind is the same as one done physically - celibacy and hypocrisy\nMarriage and spiritual union - protection for the woman in case of divorce\n11. If all are on the one path, why can’t we use the same mantra\nPeople not at the same evolutionary level so need personal mantras\nEvolution is the heightening of one’s vibrations until we reach God\n12. Reason why man has more lovers is that he has more of the animal in him\nQualities of a woman - Gururaj’s wife looking after their spastic child\nIf you can’t love yourself - you can never love others - how to learn to love yourself\n13. Observing hateful or violent thoughts takes the sting out of them\nExplanation of chakras - how to activate them if sluggish or going too fast\nStories about Mullah Nassruddin"}, {"ref": "UK84-17", "summary": "2. Communion Practice\nEveryone has the capacity to traverse the universe, to see the glories of God\nThe people bring suffering upon themselves - there is no need for anyone to suffer\nIn deep meditation there is a faint glimmer in Gururaj’s heart to keep the body alive\nThe universe is in the palm of your hand because you are not apart from it\nComing back, Gururaj brings an intense energy which extends far out, bringing peace\n3. Those present speak about their experiences during the Practice\nThe bright light seen was an emanation of the spirit within - brings warmth and calmness\n‘I will not tell you who I really am, but when I leave this body you will know what I represent’\nWhen a person dies, every incident in his life flashes across his mind before he leaves the body\nSeeing Gururaj in various forms as a boy, as an old man, as Lao Tzu\n4. A beam of light - energy flowing and sharing it with everyone\nTotally disappearing - the subtle body rises out of you\nTingling in the head means that energy is flowing\nSymbolism of the Goddess Kali - climbing a staircase to Divinity - bathe in golden light\n5. Completion of comments from those present."}, {"ref": "UK84-18", "summary": "2. A guru doesn’t worry about anyone liking or disliking him - he just sows the seed\nBecoming more evolved, you start loving everything - disliking someone can harm you more\n3. True Masters like Jesus are not concerned about being liked or not\nThey don’t cure their own illnesses because their minds are always for others\nDisliking involves hating - uplifting effect of a guru - no miracles - operation of subtle laws\n4. Disliking a complete stranger due to incompatible thought patterns - don’t dislike anyone\nRise above liking to loving - story of the guru burning the chela’s arm\nDifficult to understand the actions of a guru - you interpret actions at your level\n5. With a guru, you go from faith, to respect, to knowingness - develop the internal guru\nProgress made by chelas is heartening - all are connected spiritually - enjoying the fruit\nTruly loving is practising god - you become a living god - the focus of attention\nPsychic links are on the mental level - Gururaj doesn’t encourage psychic practices\n6. Human love normally has attachments - love for the sake of love\nWhy Avatars don’t heal themselves - organs may be decayed but they don’t feel pain\nGururaj’s illnesses - he lives by spiritual energy - his help to cardiac patients in Cape Town hospital\n7. The source of a nations strength depends on people’s good and loving thoughts\nVested interest in armaments - India is not the spiritual country it was\nWhy is the Christian church against reincarnation - it was mentioned in the Bible\nThe Gospel of Levi - it was dropped when religion became a business - eternal damnation?\n8. People relating incidents from past lives - not remembering lives - value of the ability to forget\nMuch in religion is not true - Jesus not dying on the cross - went into a coma - survived\nHe travelled to the East and died age seventy three - he became one with God on the cross\n9. The meaning of ‘ Why hast Thou forsaken me’ - Jesus had fear\nThe agony was so intense, the fear went when he became one with God\nComments on the book ‘Siddharta’ by Herman Hesse which is about the life of Buddha"}, {"ref": "UK84-19", "summary": "2. Explanation about giving a blessing on the forehead - opening the Ajna Chakra\nBlessing provides greater awareness and increased intuitiveness\nExplanation about an extra place setting and a flower on a white plate for Easter\nImportance of breathing - breath control through doing pranayama etc - samskaras holding us\n3. Explanation of a pranic kiss - rhythm developed between a couple exhaling and inhaling\nBreath is an outward manifestation of the life force within you\nLife force is nothing else but Divinity - using a kiss of life, life force to revive a person\n4. Benefits which can be achieved from doing the pranayama practice\nIf the mind is agitated, do pranayama - the mind goes into a rhythm and you feel calmer\nExperiences in a pranic kiss - losing yourself, mind not thinking, feeling extreme bliss\nKarma - secret of action is to find inactivity in activity and activity in inactivity\n5. Senility - value of work and in being active - benefits of mental and physical action\nThe Purification Practice is beneficial in calming you down\nSamskaras will show themselves - the extra energy that is consumed in anger\nBorn in sin means the burden you brought with you from a previous life\n6. Ways of reducing the burden by having good thoughts and doing good deeds\nGoing to sleep with a good thought or using one’s mantra or the chant - sense of guilt\nGururaj speaks of his experiences with his guru - helping to get rid of his arrogance\nForget the past - think of the present and live the present well"}, {"ref": "UK84-20", "summary": "2. Masturbation could never be a spiritual experience because the imagination is involved - just a fantasy\nIt’s an expression of lust - pre planning bringing about repressions\n3. Gururaj uses intuitive knowledge as well as book knowledge when he speaks\nIf you live in a mental fantasy, you become a day dreamer and are less active in life\nReleasing samskaras through dreams and nightmares\nPlacing one’s mantra in the Muldahara Chakra to dissipate the sexual urge\n4. Using up energy psychologically, thus making your mind think more clearly\nNothing in Gururaj’s talks is planned yet it’s structured - the mind is concentrated\nThe mind consumes ten time more energy than the body\nContemplation is the mind functioning in a continuous manner, like pouring oil\n5. Benefits of eating sattvic foods - being a vegetarian - reducing one’s meat intake\nStories about Mullah Nassrudin\n6. A variety of jokes"}, {"ref": "UK85-1", "summary": "Think that you are born in the image of God and all miseries will disappear\nGururaj gives a different understanding to help get rid of misery - meaning of misery\nThe secret of non-conflict is to allow the mind to flow\nIf the mind can be patterned in total acceptance, then nothing will affect you\n2. Changing your attitude to be in line with natural laws, life becomes happier\nUsing the Serenity Prayer - many things in our life can be changed - use a positive angle\n3. Not to be dependent on the mind but use the totality of life\nUnhappiness is negation which is negative - think ‘I am Divine but I have added all this dirt’\nCombining one’s thinking with that which is Divine then life can be happy\nGrasp the inner peace with the mind and you feel confident and not a lost soul\n4. Comments about the contents of the Course, Midnight Practice, Communion, Golden Thread etc"}, {"ref": "UK85-2", "summary": "2. Meaning of trust, trusting ourselves - future of BMS - the technique of regression\nThe main requirement is self confidence within yourself - one must know oneself\nThinking that you think - influenced by patternings - not having total trust, you mistrust\nYou trust with the heart and it is expressed through love\n3. Mental analysis of how trustful a person can be - analysis must be filled with heart quality\nIn trusting don’t analyse - trust totally to change a person - trust is a virtue\nEverything we do is based on trust - live life in total trust - if not, trust God\n4. Force of evolution never pushes you in the wrong direction - if life is difficult, the result can be good\nForgiving someone who has harmed you - trust is a great virtue to have\nYou become a better person and are at peace with yourself - life is made to give and not to take\n5. Gururaj is not going to die because he was never born - the spirit will continue\nSomeone may carry on the teachings - Jesus’ teachings only took off many years after he was dead\nGreat truths spoken by a Master reverberate all the time through eternity\nThe spiritual force from the talks is not just the wisdom and knowledge given but the feeling inside\nThe movement will perpetuate itself eternally, for the truths are eternal\nWords of true Masters like Ramakrishna and Vivekananda are remembered\n6. Regression cannot take away mental blockages, just shifting energies - rebirthing - you’re never reborn\nWhy go through analysis, use spiritual practices to give the strength to face life squarely\nRepeating and churning negativities can only make them stronger\n7. Think not of regression but of progression of the inner self\nWhen a person has faith, everything is possible - nothing is impossible\nGururaj sings Jai Ram with the Group"}, {"ref": "UK85-3", "summary": "2. The workings of the mind - special practice given to Gururaj by a Saddhu of drawing circles\nFour sections of the human mind operate together - lower mind, manas, is subjected to sensory inputs\n3. Everything you do is influenced by the senses - impressions are sent to the memory box, Chitta\nImpulses transmitted to the subconscious for comparison - identify it with the ego sense\nEgo is the sense of individuality, which requires guidance coming from the intellect, Buddhi\nHow likes and dislikes develop - lessening the value of the sensory inputs you become non-attached\n4. Sensory inputs are temporary and are the main cause of suffering - story of the ugly tree\nSeeing the whole world as beautiful - everything in life is a teaching if you are aware enough\nAppreciating the outer beauty first - inner beauty is Divine - impressions, thought forms, your subtle body\n5. The ego cannot be destroyed - it is the individuality which gives you a sense of consciousness\nMake right decisions intuitively - Gururaj puts the profoundest truths in the simplest form\nHe speaks from the heart from personal experience, while others speak from the intellect\nDivine spirit is permeating your mind but there is a blockage of the intellect\nIt can be cleared and the light of the spirit shines through to expand the ego - it becomes transparent\n6. When the intellect is permeated by the spirit all actions will be good - you’re living God\nMeaning of conscience - no such thing as altered states of consciousness - it’s forever pure\nEverything is consciousness - it’s nothing else but purity\n7. Comments regarding the programme for the Course during the week - Golden Thread Initiation\nDetails of using the Golden Thread while meditating and the benefits from using it\n8. A variety of jokes"}, {"ref": "UK85-4", "summary": "2. Purification Practice - how the Sanskrit language was conceived\nIf you’re rushed or agitated, your meditations can’t go deep - this practice helps one to relax\nIt has to be done with sincerity - speak the truth, hear and see no evil like the three monkies\nReasons for using the two middle fingers and why water is used\n3. Gururaj recites the second part of the Practice with the group\nThird part is a Pranayama practice done on inhalation and exhalation\nAt the end, one can use the prayer provided or use your own\n4. Question of a jealous God and what is jealousy - story about Moses and the tablets\nJealousy arises because of possessiveness, needs and attachment to things\nThe greatest suffering occurs because of attachment - taking items with you at death\n5. Gururaj speaks about his book ‘What really Happens after Death’\nAttachments create bondage in the other dimension - forced to take rebirth\nJealousies are caused by attachments - no permanency - nothing is destroyed - transformation\nPeople only see the outer form and not the inner self\n6. A jealous God means you are part of God and he doesn’t want you to be broken away\nThe same applies to a jealous guru - he doesn’t want you to suffer\nThe multitude of movements and bogus gurus - money making rackets\nHumility of a true guru - he just can’t help loving, it’s his nature\nFalse prophets and gurus bring fragmentation and not unification\n7. Life is not for stagnation - passage from the book ‘Siddharta’\nKeep on flowing eternally - peace and stillness within - be
