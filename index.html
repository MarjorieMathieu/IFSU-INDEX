}, {"ref": "UK79-22", "summary": "2. The yearning to reach enlightenment – comes after a long period of preparation\nBoth the attaining and the attainment are beautiful – a joy in finding that bliss\nThen you don’t experience that joy anymore, you are that joy, that bliss – no comparison\n3. The secret in finding everything joyful is to have the proper perspective\nThe quality of thought improves as more light shines through from the superconscious\nStory of the misshapen tree – seeing it as abstract art – seeing the beauty not the ugliness\n4. As one’s awareness expands, everything is good – Divinity is there – you love the thief\nGururaj’s story about meeting the prostitute in Bombay – her story and the Professor\n5. To reach the intense yearning, you might have to go through all types of experiences\nGuilt - there is nothing to feel guilty about\nWith meditation the awareness expands and one sees things in a different perspective\nThings we cannot change – the yearning can be converted into devotion\n6. Examples of how to change one’s perspective e.g. one’s attitude to the food on the Course\nThere is opportunity in every adversity – the cross may be hard to bear\nWhen consumed by a deep yearning, the ego is gone – the yearning yearns for fulfilment\nBeing – all preparation is becoming and then being – you will be led there\nGoodbyes – next visit - optimistic about the number on next Course – not leaving you"}, {"ref": "UK79-23", "summary": "2. Yogananda not killing the mosquito that bit him but wanting to do so – concept of killing\nHe identified himself with the mosquito and then he didn’t feel the pain of the bite\n3. He reached the stage where the two individualities had disappeared – merged into universality\nPeople fear the loss of individuality – behind all fears – fear of the unknown\nWe attach so much importance to our little selves – we are the totality of that which is infinite\n4. The basis of all lessons in life is the same – to lead us to happiness\nLearning a lesson – getting rid of a painful situation\nShort cut is meditation – what has to be learnt is in the mind already\nPleasure is invariably followed with pain – balances out – Gunas have to reach an equilibrium\n5. If you have the awareness, you’d see humour in every situation\nLife is nothing but joy – joy is lasting, pleasure is momentary\nOur minds not being involved in what we are doing – living as robots\n6. We are the living dead because life can only be lived in the moment, not in the past or future\nGaining integration, we function in totality – living in the moment is the secret of life\nThe greatest gift given to us by Divinity is the gift of forgetfulness\n7. Benefits of being able to forget harsh memories – they are clouded over\nWith meditation we are slowly going beyond the laws of opposites – we become centred\nCentring ourselves within ourselves, that is the area of joy and bliss, what we strive for\n9. Death is painless, the fear of death causes the pain\nWith meditation you are storing up ‘Treasures in Heaven’\nThe subtle body goes on being reborn until it reaches the state of purity – then disintegrates\nAfter the state of purity, the Samskaras, thought forms go to where they are most attracted to\nBy attracting negative thoughts which have been discarded by other minds, negativity increases\n10. With meditation we go nearer the light gradually\nWhen all the Samskaras are cleared, just the spirit, God, is left\nThat is the way to find oneness with Divinity and to enjoy life"}, {"ref": "UK79-24", "summary": "2. Irrelevant whether Yogananda killed the mosquito or not - he had killed it in his mind\nThe areas of the where thought arises from\nBe angry with anger – with turbulence, the more refined the mind, the quicker it recedes\n3. Thoughts from the deepest layer are enlightening – they flow with nature\nEvery person is responsible for his own actions – use the mind responsibly\nThe responsibility is not to be confused with one’s duty\n4. Duties to perform – what is the motivation behind them? – selfish or unselfish?\nConflict that arose with Arjuna – killing his kinsmen – his duty in life was to fight\n5. Fighting for one’s country would be a duty – killing an intruder would not add any karma\nChores being done with kindness – need to discipline yourselves\n6. One’s awareness develops where you see no separation – responsible for all around you\nAbility to respond comes – respond with compassion and love\nThe mechanics of healing – magnetic healers\nMagnetic healer emanates a force, an aura – directs energies to a person\nWill be projecting the negativities that is within – gives a boost but could have an adverse affect\n7. Gururaj never recommends hypnosis – sound carries negativities into the person’s mind\nA Sage filled with love emanates energy – needing only a touch or a glance to heal\nTrue healer is nothing but a channel for the power of Divinity\nYou can draw healing energies to yourself but it requires intense practice\nReceiving healing energies, a balance is restored and healing takes place – a wholeness\nThe healing energies go to where required, like rainwater filling potholes in the road\nExplanation of how healing from a distance is done – universal mind contains all minds\n8. A healer is one with the universal mind – an instrument – effort needed to switch on the light\nYou just need to focus – you draw the healing energies to yourself\nThose that were healed by Jesus had faith in him – He was just a channel"}, {"ref": "UK79-25", "summary": "2. The role of single people in society – how to channel their energies to benefit others\nThe formalities of how a marriage is arranged in Eastern society\n3. In the West the number of trial marriages – marriage should be between two hearts\nFewer divorces in the East compared to the West – divorce is due to a lack of acceptance\nIn the East, the man or woman feels the partner was predestined by Divinity\nTolerance develops with patience – with discipline heart opens, love grows – understanding\n4. In the West, the emphasis is on equality, not on equalness – there should be interdependence\nQualities of man and woman – mother moulds the child – complementary to each other\nWe don’t like to face our faults or weaknesses\n5. Not having acceptance, we are less tolerant, less patient\nComparison of persons living in the East with those in the Western society\nFreedom and independence of young people – dangers of going wild – leads to degeneration\n6. Parents’ responsibility to help their children to be responsible\nSearch for love – love is an experience – mental projection of one’s ideal\nReasons why a woman doesn’t marry – not prepared to accept lesser than her ideal\nRare few people looking for spiritual awakening within – cannot find a match to suit\nA few women are totally self-contained – not marrying - could benefit humanity greatly\n7. In a householder’s life, one can remain single and self-contained through meditation\nNot an ill or an evil for a person to remain single\nWe are bound by conventions (sixty percent) – A ‘Drop Out’ defies traditions – man-made\n8. Reasons for staying single: social conventions or an ideology or family opposition\nNeed to become less egocentric – willing to compromise – an offering\nPerson not willing to compromise needs meditation – awareness expands to see"}, {"ref": "UK79-26", "summary": "2. The meaning of ‘Lead me not into temptation’ and how can evil exist\nGururaj comments about avoiding interpreting religious beliefs\n‘Our Father’ is the Divine force or power – we feel His living presence by the life-force within us\n‘Lead me’, this is a form of begging – emphasis on ‘Me’ – centred around me – Thy will be done\nRealise the power of the Father, then temptation ceases – cannot be lead into temptation\nAdmittance of one’s weaknesses – prayer has value if deeply felt – yearning develops\n3. Temptation is ego supporting, pleasure seeking, doesn’t lead to the Divinity within\nWe demand but we don’t deserve\nMotivation behind the need? – the temptation could be a moral test\nFinders keepers – putting into activation the law of karma\n4. You only need to be delivered from evil if you have committed evil\nNo need to make any requests if one’s life and actions are a prayer\nWe don’t know what our needs are – always exaggerated – Divinity knows my needs\nThe real meaning of ‘Give us this day our daily bread’ – misunderstanding of prayers\nMany interpretations of this statement – you don’t need to pray, you become the prayer\n5. The concept of evil is entirely of the mind – Divinity is a neutral power\nWhen the scale is heavier on the side of darkness, we perceive evil\nActions not being conducive to the stability of society are regarded to be evil\n6. Concept of evil is similar to the light from the sun being obscured by a cloud\nThe goal of mankind is to go beyond the law of opposites – the three Gunas – the three monkeys\nWith meditation, you use the mind as an instrument to go beyond the mind\n7. How to draw from that source beyond the law of opposites by doing meditation\nDiscipline required – justifications for skipping one’s meditations\nWith deeper understanding, we avoid all temptations"}, {"ref": "UK79-27", "summary": "2. Why does the questioner question?\nThe answer goes beyond the question and reflects what is in the mind of the questioner\nThe depth of the question relates to the real ‘I’ of the person basically asking ‘Who am I?’\n3. The result of integration is vaster awareness – people feel the vibrations\nVibrational link between questioner and answerer\nNot just a verbal answer – draws a certain energy – basis of a Satsang\nSimilar to the gurushakti practice – a link is created – draws the answer\n4. Teaching in silence – at a different level – we need to clarify the mind where no question is left\nHow much the answer is understood is dependent on us – analysis – blockage\n5. Gururaj speaks from the level of experience – using simple words to touch the hearts\nBenefits of listening to a true guru – understanding comes later\nTruth is always there – our need to know the truth\nAfter the question ‘Who am I’ vanishes, you just say ‘I am that I am’\n6. The answer comes from the source – leads one to realisation, assimilation\nA oneness occurs – no answer and no question, just a beautiful silence – self contained"}, {"ref": "UK79-28", "summary": "2. Is it foolish to be wise or wiser to be foolish? The answer to both is yes\nIs it not selfish to be concerned about one’s own enlightenment?\nTypes of foolishness – that of a child may be pure innocence, a kind of wisdom\nDifference between knowledge and wisdom – discrimination needed – assimilation\n3. The mind could be a stumbling block to wisdom – foolishness or innocence\nStory of Ramakrishna sitting down to eat with a dog\nUse meditation to reach the intuitive level, to find out what is foolish and what is wise\n4. Materialism should be enhanced by the spiritual value of life\nGoing beyond the laws of opposites with meditation – enhancing the senses – attitude changes\n5. Man functioning in harmony – joyful – we see the necessity for pain\nAll within a Divine plan – freewill, flowing with the laws of nature – different perspectives\nWith meditation, you enhance the pleasures of life, take the sting out of pain – bundle becomes lighter\n6. Greater areas of the brain are activated – reach a state of bliss – realise that life has a purpose\nBy meditating the path to integration is expedited, but we must try to improve our actions\nSelf help – easier for us to change – altering patternings – drawing gurushakti – being receptive\n7. Changes happen gradually – virtues develop – you become more loving\nStriving for enlightenment can cause a blockage – perform your duties in life and it will come\nThe goal deep in the mind is that I want to reach home\nThe emphasis should be on bettering our lives through meditation – receiving grace\n8. Idea of becoming one with Divinity is not selfish – merging away is selfless\nNo need for man to be unhappy – he has everything he needs to be happy\nPeople are not conscious of what happens in meditation, but some effect is there always"}, {"ref": "UK79-29", "summary": "2. Those who have had no experiences during the Communion Practice have been touched\nStory of man having no experience, yet the benefits from meditation are happening for him\nNo flashy experiences during the practices are needed\n3. During the Communion Practice a great spiritual force is emanated\nQuestion about ‘The Great Invocation’ prayer – is there a Divine plan and how does work?\nUniversal prayer - the purpose that the Masters serve is to bring man to a certain realisation\nAvatars coming down – Masters know the needs – same consciousness\nMasters are born free of all samskaras\n4. Avatar exercises his will because of the magnetic attraction – the need to restore balance\nDivinity takes human form – ‘I am the way’ – service is in promoting the message of love\nMake the best of the present!\nSome of you will understand what I am saying, some of you will not!\n5. Masters bring balance, inspire goodness, devotion and understanding – age-old teachings\nBlessed to be in the presence of such a Master – purpose is to bring man to life - Lazarus\nFalse prophets - doing so much harm\n6. There will be no Age of Enlightenment\nOngoing continuum as energies pass – souls from a lower dimension coming to this level\nTrue Masters have a hard time while false prophets amass millions\nHow to recognise a true Master – mundane things have no importance for him\n7. Farewells – ending with the Prayer of St. Francis of Assisi"}, {"ref": "UK79-30", "summary": "2. What part do prayers and religious services play in our spiritual evolution?\nNecessary to condition the mind towards Divinity – deep meaning to every ritual\nRitual takes the mind into a form of contemplation – ritualism can be mood-making – stuck there\nIn meditation, you transcend all moods – in contemplation, the thoughts are directed to an object\n3. Draw energies from the right hemisphere and let them permeate the left side of the brain\nWe reach the core, the heart – reaching the subtle layers of the mind\nIntuition, knowingness – no need to rationalise\nGetting glimpses of the totality of oneself in meditation\nWhen this totality is reached, we function as a whole\n4. Using the conscious mind empowered by the subconscious – personality – experience\nExpansion of awareness is just a step in elementary meditation\nEvery individual because of his past experiences is a unique being\nMeditation brings that absolute value of life so that one could live a life penetrated by Divinity\nHow meditation works – by-passing the grosser layers of the mind\n5. Rituals – Commandments – realisations of the moral values of life\nThe real basis of all religions is ‘Who am I?’\nThrough meditation, we activate the subtle nervous system – direct link with the Divinity in man\nWith rituals or religious injunctions one can better one’s life – requires discipline\n6. Summary of the benefits of meditating – analogy of the rose and thorns\nGuru giving advice to a man squashed in two rooms to take in various animals\nHappiness was there all the time but he had to suffer to realise it"}, {"ref": "UK79-31", "summary": "2. Experiences gained over the years is our personality\nBecause a person cannot express the love within, his awareness is limited – lesser understanding\nMeditation changes the personality – it takes away the hardness, it teaches a person to love\nThe conflicting impressions have to be resolved – don’t analyse the causes – go to the light\nNo choosing of the personality by the soul – there is no difference, you are the soul\n3. What happens to the soul after death – how to resolve conflicts through meditation\nThought word and deed modify the soul – the soul evolves while the spirit is pure, changeless\nProcess is to modify the soul so that it gains its primal purity and merges back into Divinity\nTo change the personality, effort is required – our minds are fragmented\nWe need discipline, self help, self effort and strength to change aspects of our personalities\n4. The strength is gained through meditation and then the effort becomes effortless\nYou flow with nature – the help of the grace of Divinity is there – sayings have deep meanings\nIt’s the essence of the concept that is important\nThe life-force in plants, animals and stones\nThrough practice, we gain the inner strength so that nothing affects us\n5. We choose the circumstances to be born into – we have come to learn, for life is a school\nHow can we awaken and cultivate the loving self into our nature?\nReal meaning of love – normally seen as a need – love is a happening – must be spontaneous\nVirtue being the only necessity in the preparation for love – do good, be good\nIf you can’t do a person good, don’t do anyone any harm\n6. We start with the virtues that surround love – key word is understanding – moral standards\nEffort required comes through meditation – ‘I love love’ – you are the focal point\nNeed and dependency disappear – interdependence comes – becoming a unified whole\nTo find love, no need for mental analysis - it’s a happening\n7. Meditation awakens that which is sleeping and dormant\nThe story of a man using a can opener to open a soft drink can."}, {"ref": "UK79-32", "summary": "2. What are the effects of meditation and how does it affect our religious beliefs?\nWith meditation one dives deep into that area of Divine stillness\nThe concept is not contrary to any religion\nMeditation encourages belief, love and devotion – a truth has to be experienced\n3. Man proceeds from a lower truth to a higher truth\nEveryone is unique, so personalised practices are needed – analogy of medicine\nWith the expansion of awareness, greater truths are seen – reading the Bible – meaning dawns\n4. Aim is to combine mind and heart so that a balanced growth comes gradually\nBecoming integrated, we become calmer – the light within permeates our thoughts and actions\nEvery religion or theology is a search for Divinity\nThe various religions teach to find that stability within – their methods differ\nPerspectives change to where opposites cease – one’s quality of life improves\n5. When one realises the Divinity within then one can see the Divinity outside\nConcept of love – it has no qualities, it is beyond analysis – a need being fulfilled\nThrough the integration gained, one opens the heart - helps one to love, to become love\n6. Meditation helps you to enjoy whatever activity you are involved in\nThe secret is in finding non-attachment in attachment – we’re just an instrument, not the doer\nWe are living a patterned life and not realising it\n7. The story of the man using his own can opener to open a soft drink can – everything is built in us\nReligion is binding you back to yourself – we hide the light – Divinity is everywhere\n8. Mind deludes us – like a movie on the screen – become the observer of life\nWork on yourself through meditation – accept life but be responsible for life\nStory about answer to happiness from the guru to the man in crowded room\n9. Young and old souls? – how are souls born – how truth is judged\nPrimal explosion of the Big Bang – motion and sound becoming solid matter\nSouls came from this explosion – the universe functions in cycles\n10. All souls had the same start – one moving faster is older – gathers mind power on the way\nMeditation accelerates the evolutionary process, develops greater awareness\nThe soul gains its individuality because of the mind\n11. Proper action requires discrimination – explanation of Karma Yoga\nFinding the centre within, actions become spontaneous – the Gita says ‘Skill in action’\nExplanation of Jnana Yoga – developing the intellect is a stumbling block\nGo the area of love – meaning of love – you cannot create it, it is an offering"}, {"ref": "UK79-33", "summary": "1. Continuation of question on Tape UK 79/32\nThe flower is offering its beauty to the world\nThe greatness in being able to love\nThe greatest gift is to be able to love and be loved – no one is really alone ever\nThe harmony gained from meditation – emanations from everything\nLove is something that wells up – harmony is love – Persian poem\n2. People with different temperaments merge in the oneness of love\nThe unity in diversity – people having dependencies – not real love\nEnds with the Prayer ‘The Great Invocation"}, {"ref": "UK79-34", "summary": "2. Is the ultimate goal once attained, a final permanent state?\nThere’s no evolution of the spirit – it’s totally evolved – the mind is a barrier and requires evolving\nEvolution is progressive – every experience is a lesson – we’re born with impressions\n3. From the Big Bang, primal atoms shot forth and formulated different existences\nEnergy released - cannot stand still – subtle energy in plants and animals responding to love\nConflicts created in the mind by devolution – this is the concept of Satan in theology\nGood and bad exist on the relative plane – living according to the laws of nature, life is smoother\n4. Evolution is to create harmony, to help one experience who he really is\nNothing in the universe is destructible\nThe mind tries to analyse the question ‘Who am I’ without success\nMind twirling around – meditation helps to go beyond the mind – then the question is no more\nTeachings given in theologies, with commercialism became dogmatic\nStory of Nassrudin and the ‘soup of the soup’ – soup watered down.\n5. Teachings watered down – meditation brings grace and love\nAim of evolution is to find oneself again – all trying to find happiness, mainly through materialism\nFour principles conducive to evolution – Dharma, duty – Arta, economical –\nKama, fulfilment of desires\n6. Fourth, Moksha comes automatically – be in the world but not of the world\nWhat we need is to make our lives run smoother - find harmony, not God realisation\nWe go beyond the mind filled with conflicts – energy within resolves them – light shining through\n7. Trying to control the mind causes greater confusion – it leads to inhibitions, repressions\nDraw from the force within and infuse the mind with light – Raja Yoga\nWith meditation comes grace - then you find you’ve gone nowhere – now here\nIf every moment is well lived, the next moment takes care of itself\n8. Here-ness and now-ness understood by the mind as name and form – all waves on one ocean\nEntire universe is but one atom – you become one with the universe\nBring the abstract to tangible form – infuse the absolute in the relative"}, {"ref": "UK79-35", "summary": "2. How can you love us as you do?\nRequires no explanation – with mental analysis, love ceases – superficial attractions\nMechanics of the functioning of the heart – greatness measured by how deeply one can love\nLoving backed with the force of the universe – when oneness comes, love ceases\n3. If you need to love, there is dependency because of the mind\nLove interdependently – Divinity expresses itself through love\nLove starts at the core of the human personality – no separation exists\n4. Practices are aimed at making a person integrated, then all ills disappear – see with an equal eye\nA Spiritual Master puts you on the path to reach back to Divinity\nBenefits of children being involved with meditation\nEastern custom of how a pregnant mother is cared for\n5. I suffer because I fail to realise the Divinity within – serving man\nNothing exists except love – this is really saying ‘I love you’\nSuffering of the Masters is that their love, which is forever existing, cannot be felt\nNothing apart from you – with meditation, you open up to the universe and become one with it\n6. Everything man is doing, he is doing in love\nStory of the King demanding that his son refer to him as the God\nHe was so attuned to God that the hatred turned to love – God is in hatred also\n7. We are all functioning within the framework of Divinity – good and bad actions – really loving\nProvoking anger – more energy is used up in anger – just a change of attitude needed\nThe flame that lives does not consciously give off light - guru cannot help loving everyone\nWith an open mind and heart from meditating, you feel the love from the guru"}, {"ref": "UK79-36", "summary": "2. Does reaching enlightenment help others in the group?\nForce released by an enlightened man brings peace to hearts and minds of men\nFeeling at ease in the company of a holy man – subtle emanations – benefits of Dharshan\n3. The words a Master speaks on tape are alive – touch your mind and heart – assimilate this truth\nA mark of an enlightened man – he can feel the emanations consciously\nMust be receptive to receive the force of attraction emanated by a Master\n4. Benefits of being in the company of a holy man – receive what you can\nMaster shows the shortest route home – Jesus not being recognised – perception is needed\nJudging an enlightened man – realisations dawn in his company\nThose close to him may be those with a big burden – he puts a hole in the sack of karma\nBooks cannot impart the spiritual spark – learning from different teachers\n5. Talk about guru/chela relationship and enlightenment at the guru’s Ashram in Pomfrit\nBecome one with your guru first and then with the universe – sham gurus\nRead good books for self-betterment – tune in – the link can never be broken\n6. The spark is lit forever, pushing you on until the goal is reached\nBenefits of meditators meeting together – the guru is right there – you can attract that force\nSurrender to Divinity – mergence\n7. Trouble from thinking of ‘Me and mine’ – to reach the stage of ‘Thee and Thine’\nStory of the Temple in Tirupathi – paying to avoid queuing – they’re selling spirituality\n8. Meeting the potter who was an enlightened man – had become one with God\nEnlightenment requires a sincere desire not to find God but yourself\nHelping others by meditating – emanating a force – it is not selfish\nSearching based on selfishness will never end\n9. Motive to help others must be selfless – pursuit of happiness needs conscious effort\nRewards come on their own from selfless work\nEach one has their own dharma in life – helping others"}, {"ref": "UK79-37", "summary": "2. How can BMS avoid corruption through wealth\nThe leader does not require wealth or power – just money for necessities\n3. A spiritual healer does not take on the karma of the sick person\nHe balances the energies of the person by imparting a spiritual force – analogy of a doctor\nA spiritual teacher gives a little push but does not take karma away\n4. People on the spiritual path are paying off their karma in a non-hurtful way\nSpiritual practices help to make life smoother and more harmonious – idea of a credit balance\nIs intellectual achievement in science an impediment to spiritual advancement?\nScience today is verifying today what has been discovered centuries ago\n5. Science is limited by the finite mind – a leap into the unknown will come\nThe Yoga of analysis is never satisfied – emphasis is on the mind, not the heart\nModern inventions, UFO’s – great catastrophe coming – science must be used for good\n6. Are all Avatars the same soul? – concept of pure consciousness\nOrganised religions setting down laws – leads to wars – closed mind of man – dogmatism\n7. Finding the basic truths gives us an open mind – open mindedness is needed\nConsciousness assumes a form to teach eternal truths – to show us the way\nPractising Hatha Yoga helps us to grow quicker – actions attracting karma\nPractices are sufficient and new ones are given when you are ready\n8. Hatha Yoga exercises the inner organs – is valuable for the body\nCommitting an act in innocence is not karmically binding\nCharitable donations – giving is uplifting and unfolding in itself"}, {"ref": "UK79-38", "summary": "2. The nature of evil – universe is in a state of flux – motion keeps it functioning\nThe operation of the three Gunas – light and darkness coexisting\nIf God is omnipresent where does evil come from?\nNot in accordance with the laws of nature – good and evil is a matter for the individual\n3. We don’t analyse evil but replace it with good – evil does exist – it’s an opposing force\nCondemn the vile act and not the perpetrator\nIn the relative field, the forces of good and evil will always exist – example of the clouds\nReaching the middle of the polarities has to be on an individual basis\n4. Superimposition of evil is due to our freewill – the effect of karma\nFear of friction from getting rid of samskaras – man resists which leads to pain\nWe clear the impressions effortlessly through meditation – discriminate between good and evil\n5. Samskaras are dissolved and not allowed to come to the surface\nDetails of how meditation works on samskaras – sublimating the conflicts\nCentring ourselves in the subtle body, then all is good, all is God\nIt’s the nature of the Impersonal God to manifest – subtle energy is heard as sound\n6. Vibrations congealing to produce matter or energy – we see the diversity, not the unity\nWhen we fail to see the unity, we see the good and the bad\nRise above and walk in the path of truth – no loneliness – calmness comes – see no evil\n7. We accept good and evil with a kindly eye – let us love and have good thoughts for others"}, {"ref": "UK79-39", "summary": "2. Explanation of Nirvana, liberation and the void and how they relate to unity\nTo find Nirvana is to be free of all the miseries of life – we’re responsible for the miseries\nBeing totally apart from all attachments, you are liberated from the sufferings of life\n3. To be free, man has to rise above the law of opposites – find the stillness in motion\nEmphasis needs to be shifted to a higher level – greater awareness of the spirit\nBlaming everyone – seeing oneself as the centre of attention – we have to get away from ourselves\n4. Place the emphasis on the real doer – attitudes change and we are liberated\nThrow away the attachments – not hearing the noise, not affected by it\n5. Through integration you find freedom in bondage – still bound but free – liberation\nIn meditation thoughts are there – not mindless – while meditating just watching the thoughts\nExplanation of how to handle thoughts during meditation\nThrough Nirvana the void is reached – that nothingness is here, ‘now here’\nIn Samadhi one experiences nothing else but Divinity – there is no void\n6. Story of chela opening the fruit and finding no seed within – nothing – no mind\nWhy personal Gods are created – universe forms a radiation – subtle energy – the Buddha\nAvatars come to teach, to help one develop love and devotion\n7. Virtues develop, negativities disappear – the bundle of samskaras on the back reduces\nPeople asking about past lives – God-given gift of the ability to forget"}, {"ref": "UK79-40", "summary": "2. Explanation of what conscience is and how it operates\nConscience is our analytical abilities that analyse all our thoughts\nThe worst person has a conscience – we are no better than the worst, we’re all thieves\nConscience has deep origins – a battle rages within to do good\n3. With meditation we allow more of the purity to enhance the conscience\nConscience could be selfishly motivated – remove the dust off the diamond\nThe ego is forever contracting and expanding – we’re not totally good until enlightened\nThe inner voice is your conscience\n4. Mind is an illusion because it is so changeable\nPundit conducting ceremonies and requiring payment – the stones donated are ‘Maya’\nBring reality to illusion because illusion too is real – placing the emphasis where?\nIllusion, bad thoughts result in suffering a bad conscience – never have peace of mind\n5. Conscience can be buried – subtle energy wanting to be for our good\nUniversal prayer – cleansing the conscience and allowing the purity to flow through us\nIs there justification for a monastic way of life?\nYour own special temperament – the ascetic has a hard path in life\n6. Asceticism can be escapism and also a kind of extremism\nKarma Yoga is the path of the householder – try to rise above one’s imperfections\nThe idea is to bypass the mind and let the inner self operate\nDiscipline and austerity help to make one’s life smoother\n7. Meditating with distractions – the Karma Yogi is less selfish than the ascetic"}, {"ref": "UK79-41", "summary": "2. Difference between identity and individuality\nIdentity is your personality – it is composed of the ego self – thoughts and impressions\nUnpleasant personality – acts contrary to the laws of nature – perverted happiness\nSuch a person is insecure, lacking in love – he’s trying to gain attention\n3. The deeper a person loves; the more refined is his ego\nSubtle body is the sum-totality of man’s ego – empowered by the spiritual energy in man\nWrong to think of losing the sense of identity – if the personality is upgraded, awareness is widened\nIf the perception is narrow, we project our clutterings onto others\n4. With increased awareness, go beyond apparent perception – see the purity underlying all impurities\nHeightening the vibrations when meditators are together – it is helping those at a lower level\nThere is a feeling of oneness where so much love pervades\nPersonal God has attributes – seeing through the personality and seeing the universality within\n5. When the identity is purified, it goes closer to the Personal God\nBy becoming closer, we assume the attributes of the Personal God – spontaneously become loving\nOnce the pure love is there, the other virtues follow\nWith identification with the Personal God, you become him – no separation exists\nWe identify totally with him – that is self-realisation – finding oneself – answer to the question\nYou maintain your personal identity and at the same time carry the personality of the Personal God\n6. Refine the personality and through reaching the Personal God, you reach the Impersonal God\nSeparation from the Father causes the misery we feel\nThe duty of the guru is to give whatever he can – never apart from his chelas\nMan is equipped to generate the universal force and it is to be used\n7. There is no coming and no going – it’s here and now, all the time"}, {"ref": "UK80-1", "summary": "2. God is a neutral force and love is a manifestation of that force\nThe neutral force by its own nature solidifies itself into sound form, a vibration which has motion\nFrom the sound, the word, it assumes a grosser form which is love, known as the Personal God\n3. Love requires expression – it has motion because love could never be static\nThe Personal God goes through a process of evolution – it is conscious of itself\nLoving a stone, it will love back – the stone is also love – a manifested force keeping it together\nWhen we see all is love, we find oneness with the universe – we find the totality of love\n4. You need the consciousness to recognise your primal self again, that you are love\nYou lead a person to Divinity by making him realise that there is a greater power than him\nTo find the Kingdom of heaven outside, you have to first find it inside – everyone is Divine\nWe start with ourselves – like attracting butterflies – you develop the good qualities\nA God-given privilege to be able to teach – service is an expression of God\nTo serve humanity is to serve God, and from that you learn to know God\n5. Experience and express love through teaching – we teach to share, like bees with honey\nTake your mind away from your problems by teaching\nBest way to refine yourself is by doing your practices and by teaching"}, {"ref": "UK80-2", "summary": "2. Explanation of awareness and perception\nTo be fully awake, you need total awareness – entirety of the mind is enlivened\nThe senses can deceive you with illusions – with greater awareness you see beyond the illusion\nPerceptions are subjected to illusions all the time\n3. As awareness grows, you become more wakeful, perceive more truthfully – tall building\nPerception, wakefulness and awareness are totally interrelated – need clarity of mind\nPerception and beliefs are based on past experiences – limitations\nOur taste changes but the essence does not\nDwelling on the past is not going to help the present – problems with psychoanalysis\n4. Man’s mind is conditioned by religious precepts – being a sinner\nTo remove sin, draw on inner energy\nLooking to meditation for an instant cure\nOne needs preparation beforehand to avert what’s coming\nTo develop awareness, regular meditation is needed\n5. The more we teach, the more aware we become – rapport and attunement comes\nYou just feel because the awareness has expanded – you know without asking\nA greater spontaneity comes into your life – the giver receives more in return\nMeditation is just a tool for the activation of grace –\nGrace is the goal and the path to Divineness\nYou are the channel for the person to draw the energy through\n6. The benefits from teaching with love – not as a chore – no separation, you are but one\nAfter meditation a greater force enhances the senses\nWith greater awareness, we live in the waking state of life – we are alive, not dead"}, {"ref": "UK80-3", "summary": "2. Explanation of wisdom and knowledge\nKnowledge is something acquired by the mind\nA person with normal intelligence can acquire knowledge\nKnowledge helps to develop the intellect – philosophy is based on acquired knowledge\nIs anyone capable of creating a new thought?\nReal creativity stems from deep within\n3. The intellect and the organs of perception – how they work\nIntellect helps with discrimination but needs the intuitive side to empower it\nYou need the ability to be able to draw from inside, to take the essence of knowledge\nAnalogy of the Hansa bird\n4. When acquired is assimilated, it becomes wisdom – the variety of philosophies\nChoose the direct path – go beyond the mind\nAcquired knowledge depends upon how it is used\nIs knowledge required to get an understanding of life or to make a living?\nThe goal of life is to find the peace within\n5. Gururaj’s guru helped him find the peace he was looking for – direct path through his guru\nLooking for spiritual signposts? – Are you receptive enough to see them?\nFlashy experiences aren’t necessary – every meditation has some effect\n6. Spiritual force sent when a mantra is derived – signs of progress are not necessary\nReactivating that force when you meditate on your mantra\nThe guru’s job is to put you on the path – you are on it just to wash off the dirt"}, {"ref": "UK80-4", "summary": "2. Path of the householder and the path of the spiritual seeker – achieving total integration\nIn spiritual seeking you don’t need to become a recluse – a recluse can become demented\nAccept the responsibility of life – with challenges coming, you don’t become complacent\n3. The sense of acceptance – discipline needed to alter the patterns of the mind\nAttitude of service to one’s family\nCloseness develops then love comes – you become dutiful – you become a karma yogi\nWhile performing your duties, have uplifting thoughts, read good books – words of wisdom\nA spiritual path is not devoid of daily practical living\n4. Meditation only recharges the batteries – conscious effort is needed in daily living\nThe yearning to find that which is within, the totality of one’s life – then enjoy everything in life\n5. Devotion – motivation – how you feel inside – opening the heart - you are healed\n6. Meditational practices are only thirty percent – faith grows as you see the changes\nWith encouragement, you progress faster\nThe real seeker does not feel he is a seeker – enlightenment comes on its own\nWe are on the path, we must reach there as long as we act in the way we should\n7. The balance of good and evil forces – can the situation in the world be improved?\nNo Age of Enlightenment – continuous flow, otherwise stagnation occurs, all will collapse\nThe cycle will continue – incarnations cannot got against the laws of nature\nIndividually we can become enlightened, not collectively\nThe guru will have chelas according to what the guru is like\nJesus had only five hundred devoted chelas\nHow far can I progress in this life?"}, {"ref": "UK80-5", "summary": "2. Christ saying ‘I am the only way’ seemed to dismiss other teachings\nMeaning of Christ – one has to reach that purity of consciousness to reach the absolute\nNo difference between the individual and the universal – becoming one with it\nSufferings are just a creation of thought, which comes from the mind\n3. There is no evil, you make things evil by thinking it is evil – pain and pleasure is but one\nFour states of reality – there’s only one reality, the other three seem just an illusion\nSuperimposition of other states – the Divine state – like water vapour hiding it\nDivine energy permeates every action – man-made laws of right and wrong\n4. The Divine force has no purpose – man is infinite – all part of a cosmic dream\nWe think we are the total reality – difference between reality and actuality\nMan battles for happiness because of his ego self, the small ‘i’ wanting to preserve itself\n5. Consciousness is limited – practices take you there but you discard them – nothing more left\nProcess of evolution – creation and destruction of universes – go beyond it – worship\nPure consciousness can be experienced – we become a witness to it.\nReincarnation is a dream - we are a dream, karma is a dream?\nTrue, because we are a dream of the cosmic mind.\n6. When Christ was on earth, he was everywhere – in the body of Jesus, Krishna or Buddha\nYou suffer hurt because of your sense of waking reality\nFor the present, man’s evolution is necessary to make things smoother\nOur duty is to wake up and become awake in the cosmic state, which is life"}, {"ref": "UK80-6", "summary": "2. Meaning of spiritual names – explanation of the difference to a mantra\nHow to teach and yet look after other duties in life?\n3. Any techniques for bringing peace to the world? – create the peace within yourself first\nTotal unrest in people’s hearts and minds is worse than war\nPeople continuing with their own form of healing is okay – force should be directed as a prayer\n4. Meaning of Guruvar – meditating at a fixed time – sending out good thoughts\nUse of Tarot cards, mediums, developing occult powers etc. are not encouraged\nHow to teach about the spiritual link between guru and chela - a spiritual bond, a closeness\nEmphasise the physical benefits of meditation\n5. Meditation helps but medical help is also needed – not a miracle cure\nGururaj’s help with cardiac patients in hospital\nTears flowing during meditation – resolving guilts – faults are mirrored\n6. Meditation helps to gain insights- through self-help, life improves\nUsing the word gurushakti or grace in teaching? – using an analogy to explain grace\nHow Gururaj derives a mantra – the mantra refines itself until it’s just an impulse\nReason for initiation ceremony – feeling of security\n7. A mantra helps one to evolve by assisting one to become closer to oneself\nAnomaly between Gurushakti flowing spontaneously and yet one invoking the Law of Grace?\nHow much time to give to a new chela? – mental cases should seek expert advice\n8. Help whoever you can – danger with people with mental problems\nAdvice about what practice to give and how to help persons with mental or drug problems\n9. Continuing to teach somebody taking drugs – Forms are confidential\nPreparatory mantra is very beneficial as it helps to steady the mind\n10. Effortless effort in meditation – thoughts during meditation – like monkeys chattering\nGaps during meditation when there is no thought and no mantra"}, {"ref": "UK80-7", "summary": "2. Comments about not being able to spend time with everyone – flow of energy at Satsangs\nAvatar takes thirty years to realise who he is – natural progression for him\n3. Seed within takes time to develop – like a musician taking time to perfect his technique\nAvatar realises he is the universe – he goes beyond name and form to the essence of things\nHe comes to present age-old teachings in a different light\n4. Meaning of relativity – difference between a realised man and an Avatar\nHe teaches from experience to be established in self, then every action is non-binding\nExplanation of Jesus’ relationship with his disciples – actions of an Avatar\n5. We require opening - allow the purity to emerge – the Avatar doesn’t, he is all\nDraw from that which is beyond so that everything we do is good\nMan-made laws are needed for the stability of society\nStory of the alcoholic rehabilitated by making plaster casts of Shiva and Parvati\n6. Having been taught to chant while making the plaster casts helped his recovery\nActions that benefit all are the true actions\n7. Friends resenting changes in one’s lifestyle for betterment – ignore the envy\nDemonstrate your love through words and deeds\n8. Greatest hatreds can be turned into love"}, {"ref": "UK80-8", "summary": "2. ‘Not all of my flock?’ – duty of a teacher is to let the message of love flow to all\nNot to be complacent – like selling books, some browse, may come back\nEncourage a new person to have an open mind – accept what you can of the teachings\n3. When the chela is ready, the Master appears\nTeacher plants the seed – only a true seeker moves away from dogmatic beliefs\nPeople searching for happiness unconsciously – story of the frog in the well\nMomentum set up will perpetuate itself\n4. Dream dynamics – go to sleep with a loving thought – digested knowledge, not wisdom\nMisguided people being misled by gadgetry – experimenting on you\n5. Shortcuts to enlightenment are more damaging\nA teacher’s duty is to put people on the path to God – enlightenment will come\nPeople jumping from movement to movement\n6. Good practice to read a good book before sleeping\nMessiah or spiritual teacher coming? – should we tell who we think you are or keep it a secret?\nPeople must realise by themselves – He has always been here\nFeelings of guilt are in the mind – reasons for feeling guilty\n7. Feeling guilty because of conflict between one’s convictions and actions\nWithout the feeling of guilt, you won’t repent – no sense in moping\nHuman witness before God – this concept has become distorted\nCall upon grace to overcome the bad karma\n8. One can learn from everything, good or bad – how to get rid of guilt\nMeditating during an illness – how to ease pain – how Gururaj relieved his own pain\n9. Getting one’s mind off the trouble spot, diverting attention – wrong not to call a doctor\nGiving spiritual practices to children – the Child Technique\n10. The age for giving a youngster the full mantra practice"}, {"ref": "UK80-9", "summary": "2. The universal soul comprises the universal mind – the soul is the mind\nHelp is needed to combine the individual mind to the universal mind\nMan clings to individuality even though he knows he is universal\nA true Master makes one realise that what you think is you, is not really you\n3. The sense of individuality brings about self preservation – preserving an idea of oneself\nThe true teacher gives an impulse – clinging – become non-attached, then no expectations\n4. Man must make the effort but must infuse the Divine force in every action\nMisguided ideas of one’s abilities – accept one’s limitations\nTrue teacher brings man to realise what he really is at his level – preparation is needed\n5. Jesus met great Masters who gave him the impulse to start his mission\nVery few who can reach enlightenment without the spiritual force imparted by a guru\nThe spiritual link continues after the guru leaves the body – comes in many forms\nManifestor has to assume an energy for the universe to exist – manifestation recreating itself\n6. Creation is self-preservation – reach back to the stillness, to unlearn\nMan reaching self-realisation merges into the Avatar – merged into the personal God – all one\nPrinciples of BMS were not planned but given – tools are given – wake up to the force\nWith the impulse, you just need to think of a thing and it will come to fruition – no selfish motives\n7. Everything is on loan to us – when the ‘i’ disappears, the rewards are indescribable"}, {"ref": "UK80-10", "summary": "2. Explanation of illusion and delusion – illusion depends on perception, delusion on conception\nIllusion can cause a delusion if the intellect decides what is seen is true\nWe are deluded by concepts implanted in our minds – need to study both sides\n3. The spiritual self can never be deluded – pleasure rebounding in pain – go beyond the opposites\nStory of man going to heaven and God saying ‘Why cook a feast for two?’\n4. Illusions can give rise to hallucinations – imagining things – danger of shock treatments\nGreatest danger is being deluded by yourself – stumbling block - sense of Big I\nFacing oneself, one sees the delusions one has gone through\n5. Story of the man wanting to sit on the right hand of God\nDelusions are experiences that created the delusion that ‘I am real’\nInter-relationship of the spiritual practices\nThree aspects to the mantra – sound, present state and range ahead of you\n6. In Tratak, the candle is used to help visualisation – the benefits of the Tratak practice\nPranayama – a revitalising life force permeates every cell – purifying the system\n7. Swirling – activating one chakra – keeping the vibration alive during the day\n8. Practices all function together – Mandala practice is a combination of all three\nPractical aspect is for you to teach others – sharing your joy with someone else"}, {"ref": "UK80-11", "summary": "2. How do we know? – mechanics of knowingness, ability of discrimination\nKnowledge versus knowingness – acquired knowledge is based on the experience of others\nInterpretation can be wrong – assuming without proof\n3. Acquired knowledge lacks completeness – question of awareness\nYou reach the stage of knowingness with spiritual practices, diving deep within\nUsing such a small part of the brain, how can your conceptions be true or real?\n4. With greater awareness, one can see and feel more – there’s only one mind\nUnderlying the individuality given to the body by the various organs is universality\nAllow the energy of the spirit to permeate the mind and body – the three aspects are not separate\nThe mind cannot find the solution to the totality of life or prove the existence of Divinity\n5. With meditation, the heart is opened and the mind is expanded – books lead to more confusion\nUse the direct approach which doesn’t require acquired knowledge – illiterates finding God\nWith meditation, without thinking everything you do is right – flowing with the Laws of Nature\nCircumstances that seem adverse might be what are needed – life becomes spontaneous\n6. Motion is required for the universe to exist – while shifting energies, you are still\nThrough meditation remove the thorns of self limitations we impose upon ourselves\nExperience the Divinity that is within, then life is a joy"}, {"ref": "UK80-12", "summary": "2. The nature of personal reality – we feel that we are real and not part of a dream\nReality can be lost, swallowed up in the environment – not yourself\nPersonal reality is governed by thought processes – things being illusory\n3. Personal identity has to be retained where personal reality can be identified\nWhen you find the stability within, you know the nature of personality reality – a process\nEverything is in a state of flux – knowing nature – stable quality\nNature of personal reality is stability, not affected by polarities – stand firm\n4. You have not changed through getting older – neutralise the karma acquired since childhood\nYou have patterned your mind and this patterning is the suffering – inner self is not affected\nYou identify suffering with your personal reality, which is untrue\nOne has to unlearn, become as innocent as a child – heaven is that bliss\nPersonal reality is that spirit within – the rest is a superimposition\nGet rid of the impositions in the mind by creating conditions where they will leave\n5. Mythical story about Bhima asking for a boon to eat as much as he liked\nYou cannot get rid of karma but you can overcome it, shed it off\nBad karma will be attracted to those of similar karma\nThink right, act right and do your spiritual practices\nPersonal reality is no different to universal reality – then merge into Divinity"}, {"ref": "UK80-13", "summary": "2. Right attitude for spiritual unfoldment? – spirituality permeates everything\nSearch for unfoldment or realising the spirit is not for happiness\nHappiness is entirely dependent on the mind – repatterning the mind brings calmness\nLooking at the turbulence of the mind objectively, it loses its value – go beyond it all\n3. Thinking section of the brain has to be brought under control\nDraw from the intuitive side to quieten the turbulence – infuse it with spiritual energy\nChange one’s attitude by activating that force within to find joy\n4. Strengthen the mind to make thoughts become a reality\nWhen people pray, they try to bargain – one has to act, not just pray\nWhen feeling negative, negative thoughts are attracted to you\nWith conscious effort, if you think correctly attitudes will change\n5. The energies drawn from within clean the conscious mind as well as the subconscious\nTurning a negative thought into a positive thought – unfolding the spirit\nObjectifying thoughts, right thinking, right action - acceptance help change attitudes\nBring about equilibrium which changes attitude and gives fulfilment of life\n6. Life is forever striving, if there was no striving there would be no life\nYou are the master of your own destiny – this comes from analysis\nSurrender the little self to the big self – we have all the tools\n7. Abstinence – observance of life – system becomes more refined\nTamas is more dominant in the grosser foods – eat purer foods\nWe sustain life by consuming life"}, {"ref": "UK80-14", "summary": "2. Highly evolved being may appear outwardly very ordinary – he is beyond his body\nAt a certain stage of evolution, he doesn’t care for the body or the mind\nYou cannot judge a highly evolved man – one’s mind has limitations\n3. Total identification occurs with mind body and spirit\nThere is a purpose behind the way he acts – try to find the purpose\nA matter of understanding, not judging\n4. People are turning inward to find the reality there\nListening to a true guru, the burden is lessened; you feel something – false gurus\nTo the evolved man all opposites are true – he has reached the source\nHe sees the purity of spirit in everyone – judging him is an attitude of scepticism\n5. The doubt is a reflection of yourself – Christ’s disciples doubted him while others despised him\nWith some transformations in our lives, we become fearless – doubts can be useful\nRealisation dawns “I was in the presence of a Master and I feel that presence”\n6. Judge the tree by its fruits – find the basis you’re built on\nHow to stay in the moment – Gururaj calls out the time as it changes on his watch\n7. For every second that has passed, the moment has passed\nWe measure time in a linear fashion – a moment can last a lifetime or an eternity\nOne has to become one with eternity to experience eternity in a moment\nIn Samadhi you become yourself, the God within – experiencing eternity\n8. Human life is so valuable if used to get closer to your Maker\nEverything is celebrating, for life itself is a celebration"}, {"ref": "UK80-15", "summary": "2. How can one discriminate between ego games and guiding intelligence\nEgo in reality is non-existent – thought forms – essence is left behind\nEgo is an illusion and illusions are governed by the laws of opposites, the laws of nature\nGoing beyond the ego, the idea of I, then Divinity can have its full force\n3. Every experience has its opposite counterpart\nThe body is the ego, Divine is the ego and all that contained within the mind is ego\nEgo is filled with that which is good and bad on the relative level, not on the absolute level\nThe power the ego draws from the spiritual force of man is a reflected form – a falsity of the ego\n4. As man grows, he becomes more aware of himself – his consciousness is turned outward\nHe shuts himself off from what he really is – he is responsible for inflicting pain\nYou are the totality of the various forms of existences\n5. Use intuitive force to discriminate between real self and the ego self\nThe Masters not caring for themselves – not being selfish, just selfless, a channel for Divinity\nThe answer to the question ‘Who am I?’ can only be experienced by oneself\n6. We expand the ego to refine it – the awareness expands\nThe entirety of life is in your heart – the spirit remains – merging away into eternity\nMeditation helps to cleanse the ego – brings stillness – be like the spinning top\nPractices which you need to do are like medicines – underlying factor is love"}, {"ref": "UK80-16", "summary": "2. Rapid fire question and answer\nRetaining individuality while in the body\nApplying a credit card system to karma\nMisconception that the evolutionary path is easy – thorns on the way\n3. It’s easy if you flow with the laws of nature – process of expansion and contraction\nThoughts during meditation – short duration – how the mantra works\n4. How to deal with thoughts – meditation is alternation between mantra and thought\nExperiences in dreams – safety valves – hallucinations\nDanger of becoming involved with Siddhis – stumbling blocks along the path\n5. Developing occult powers can only bring misery – side-tracking you\nDangers of hypnosis – hypnotist is imparting his negativity to you\nAppearance of a religious object during meditation – superimposed on your own vibration\n6. Concept of the doctrine of atonement – Christ suffering for our sins misinterpreted\nHe went through sufferings so he could help others – he is an example, a torch – ‘I am the way’\nConsciousness is forever – we can still feel the energy of the great Masters\nHow to discriminate who to help – don’t deny anyone your help\n7. The greatest help is to change the friend’s way of thinking\nThe Avatar leaves his teachings for those who are seekers\nHe revises the message to open hearts leading to greater peace\nDifference between an Enlightened Man and an Avatar\n8. Gurus claiming to be the long-awaited Avatar or Messiah\nThe real Avatar makes no claim – opposition to a great spiritual force – so-called Avatars\nCriticism of a guru teaching tantric practices\nWhere evil rises a balancing factor emerges\n9. Recommendation to meditators to speak to others of the benefits gained\nIf not ready to be healed or have a karmic debt, you won’t be made whole\nDepends on how ready you are to be healed\n10. Glimpses of what is beyond – meeting a close one in the next existence\nActivation of Divine force in karmic partners meeting in this lifetime\n11. Great calamity to happen around the year 2025 – resulting from a power struggle\nCalamity will affect other planets – UFO’s coming to warn us\nInventions for mass destruction – need to change the hearts and minds of men\nThe date of death is not established when a person is born – can postpone death\n12. One can prolong your life by sheer will – done for altruistic purposes, not selfish\nHow to carry the message of meditation to those that are not receptive"}, {"ref": "UK80-17", "summary": "2. The mechanics of self-help – concept is contrary to helping oneself\nAnalysis of one’s thoughts and actions in a difficult situation\nThe mind being patterned, one needs to negate the patterning\n3. To replace the negativities with positivities, effort is required\nWe need to change ourselves if we want to change others – practise self-help\nConscious discipline is needed at first – find self-expression in a disciplined life\nHow to deal with addictions, emotional problems etc\n4. Analyse the situation at work, in friendships etc\nForce of humility penetrates deeply – humility is sincere love\nIn a dilemma use common sense – looking for a job, take any job\n5. Pushing yourself, making an effort – helping yourself in a difficult situation\nStrengthening the thought of self-help – power of attraction – it comes to you\nFeeling poor – develop a burning desire for the opposite, of being rich\nMan has to be brought to the level of positive thinking, not wishful thinking\nMeditation helps pull one together to function in totality\n6. Using visualisation before getting a contract signed\nHelp from the power of positive thought and honesty in business dealings\nIf we believe Divinity underlies everything, then life can be very smooth\nReach back to the simplicity of life – then there is nothing but joy\n7. The Avatar is the totality of the emanation of this infinite universe\nConcept of the Personal God, the manifestation – the Manifestor is the neutral force\nOne learns to realise that both are one\nThe Avatar has nothing to do with the workings of the universe\nReaching the finest level of relativity, the subtlest level"}, {"ref": "UK80-18", "summary": "2. How we can help those who are not meditating\nFreewill, a choice to do what one wishes – underlying freewill is Divine will\nSo many paths – four major ones – transfer loving thoughts through gurushakti\n3. Create an interest using reverse psychology but never force a person – no benefit\nProof of the pudding is in the eating – the friend sees the changes in you\nSceptics can become devoted chelas\nCuriosity turns into devotion – it all happens gradually\n4. The person may be more evolved than the meditator – needs polishing\nParadox between looking for signs and being told about the benefits or meditation\nExpecting to see signposts will stop one’s progress – how do you judge progress?\nNot a paradox – motivation behind the good deed – is it a mood?\nThere can never be signposts – leading to doing good spontaneously\n5. All we do is preparation to reach beyond the law of opposites\nLooking for rewards – think right, act right and the rewards will come\nWe want to reach the certainty of immortality – the spiritual self within\nBe loving and lovable and forget the signposts – you’re on the right path\n6. Through meditation, one reaches ‘home’ automatically\nAn experiential process, not a thought process\nGururaj recites ‘From the Point of Light within the mind of God’"}, {"ref": "UK80-19", "summary": "2. Difference between dharma and karma, action and duty – overcoming negative feelings\nTwo sides of the same coin – good and bad karma – dharma is performance of one’s duties\nCleansing process of dharma – karma leaves impressions\n3. Accumulating good and bad karma – heavens and hells\nNo need to feel guilty for past actions – there is only now – reaching ‘nowhere’\nChange our negative thinking into positivity\nReally hating yourself – one spirit underlying all\n4. Fill the subconscious with light – story of the man in heaven – ‘Why cook for just two of us’\nDuties become spontaneous not laboured – love has to be expressed tangibly\n5. Dharma means your way of life – adapting oneself to live life as it should be lived\nWhat we put into life we get out of it\nExplanation of ancient Sanskrit terms, Dharma (way of life) Artha (economics)\nKarma (fulfilment of desires) and Mochshan (salvation)\n6. Established in dharma, the negativities in life disappear – the light shines through\nReach the stage where you go beyond opposites – become one with the spirit\nOrigin of thought processes – evolution is the primal propulsion – vibration\nCondensed into what is called the mind – origins of the primal thought\n7. What is creation – creation in Scripture is symbolic\nUniverses are being created and dissolved – scheme of creation\nLife-force is there to keep continuity\nThoughts vary because of experiences gained – originally only one thought, one will\nMind is a collection of impressions, expressed as thoughts\n8. There is no new thought in the universe – no creative writing\nSynthesised different thoughts together – an illusion – seed containing the totality of the tree\nWe assume we have an individual mind because of the veils covering it\nEveryone is trying to express oneself\nSections of the brain – one part analysing, symbolising, the other part intuitive\n9. Nature of thought is the fine current that came from the primal creation of the universe\nGiven the tool of freewill whereby we can attune ourselves to Divine will\nMeditation leads to a concentrated mind and then to contemplation\nOne has to go beyond rationalisation to experience the origin of oneself\n10. Peace is gained in the region beyond thought\nEvery thought is Divine, only distortion has taken place – our porous nature\nThe difference between understanding and realising – no separation, thoughts vanish\nRewards of meditating will be harmony, experience pure joy, transcending polarities"}, {"ref": "UK80-20", "summary": "2. Moral standards being adapted to the times\nReasons for permissiveness – child’s exposure to violence and sex in the media\nFragmentation arises from this degeneration – three aspects working together – totality\n3. Society is degrading people – exposure to violence is not a cure for it\nSolution is to take one from lust to love – restructuring of values\nWill not come about because of commercialism – the sexual side\nWe allow animal instincts to control us – we should maintain the purity of mind and body\n4. Drinking, drug-taking, disobedience to parents and teachers is all rife\nThe need for mutual trust - comparison leading to dissatisfaction\nThrough meditation allow the purity to pervade mind and body\nChildren of meditators will have higher values in life\n5. Rise beyond good and bad to the level of pure joy\nThe path to Divinity is to preserve one’s personal dignity\nWholeness in man – heal yourself – peace descends – see beauty not misery\n6. The past has passed on and no one should suffer guilt\nFullness of the ‘now’ lies in joy\nGreatest gift is the ability to forget – accept our lot and live responsibly\nThe nature of God – transcendent or immanent – it’s neutral energy pervading every atom\nExplanation of the Manifestor, manifestation, incarnation, Impersonal God\n7. Primal manifestation was vibration, sound – always in motion\nCreation of the universe – transformation into matter – radio waves\nDescription of the evolution from mineral to plant to animal, to man\nMan’s ability to think\n8. Man’s misuse of his powers of discrimination – going against the laws of nature\nIdea of self-preservation – sense of ‘me and mine’ develops – selfishness\nEverything is vibrating, is in motion and emanating all the time\nAttributes of the Person God – approaching the Personal God\n9. Through meditation we open up to the subtlest energies – action become good\nWhen evil rises pure consciousness becomes solidified in human form, an incarnation\nSee the Divine spark in others – knowing the essence of oneself which is Divine\n10. We have to uncover the Personal God in ourselves first, then merge away into the Impersonal\nBy refinement we enhance the value of life\nFinding God in everything, a oneness\n11. Story of the man wanting to sit on the right hand side of God in Heaven\nMotto of ‘Life, Love and Laughter’"}, {"ref": "UK80-21", "summary": "2. How to overcome negative feelings towards others and how not to lose patience\nHelp provided by meditation in analysing and objectifying thoughts and feelings\nMind is a storehouse of positive and negative thoughts and emotions\nMeditation is just an energising factor\n3. Feeling hatred shows one is not established in one’s meditations yet\nThe energy in feeling irritable could be used positively – use your mantra or swirling\nNever allow yourself to become impatient – symptoms of a deeper imbalance\nBe angry with anger and not with the person who is angry towards you\n4. Objectify every happening that happens inside us\nHow Gururaj reacts – never irritable or angry\nThe imbalances we see in the world are created by ourselves\nEverything in life is a guru – everyone teaches\nWe see more badness in the world because we are bad\n5. Man needs to unlearn preconceived ideas\nCultivate the quality of acceptance – feel responsible to yourself to accept\nPatience, tolerance etc will follow – emanations in a house when one enters\n6. A friend swearing at one should be taken as positive, not negative – everything is positive\nOvercome the laws of polarities by centring oneself\nEverything is a celebration, even death – stealing is a negative act\n7. Greed of mankind – who are we to judge a man’s action\nWe learn to forgive, to be compassionate, with Divine energy flowing through our minds\nOne’s perception changes and you see God in everything\n8. Hatred is just a distortion of fact, of truth\nSmiling as an exercise for the face"}, {"ref": "UK80-22", "summary": "2. No difference between Chit (mind stuff) and Sat (a truth or existence)\nCombined with Ananda – intertwined – with life-force constitutes existence\nSatchitananda are the qualities of the Personal God\nWith spiritual practices we awaken dormant sections of the mind stuff\n3. Going deeper, one develops knowingness, the greater part of awareness\nNo analysis, no rationalising required – you spontaneously know, like love\nExpansion of consciousness gives a greater view – permanency of bliss\n4. Everyone has temporary glimpses of Divinity – we want it to be permanent\nThese moments are most joyous – source of abstract painting, poetry etc\nThe Impersonal God is a neutral energy – indefinable – manifests to the Personal God\n5. Giving attributes to God, we are defining the Personal God\nMeaning of ‘Knock and it shall be opened’ – you are expanding, unveiling\nMeditation is allowing the life-force to work during the day\nBecoming totally unconscious of time leads to timelessness\n6. Example of looking at a watch – the time is constantly changing\nAs the awareness expands, we reach the area of light and timelessness\nWe want the stillness but we need to make the effort\n7. Significance of Easter – the Gunas – balance and imbalance is the same everywhere\nIn Pralaya, fine currents are moving – explanation of evolution\n8. Associating with people one likes to be with – loving all\nAversion or revulsion for people comes about because of patternings\nAssociation of ideas – person emanating an aura\nAversion can be overcome by meditation, going beyond the mind – no difference\n9. Weakness of astrology – feelings of insecurity and inadequacy\nStory of an astrologer giving advice to a couple in Cape Town and the results\n10. Meeting a person from a previous incarnation\nPerson with a disability learning to mediate\nGururaj’s help in hospitals – story of his own spastic child\nA person approaching death, seeing past, present and future coexisting\n11. Ramakrishna’s worship of Mother Kali bringing her alive"}, {"ref": "UK80-23", "summary": "s\n2. What we can do for our guru?\nI do nothing – Divinity is forever flowing – Divinity does everything\nWhy a guru doesn’t cure himself – thinking of himself, the Divine energy flowing will stop\nHe is fulfilling his mission without any expectations\n3. He sows the seed to awaken the latent Divinity in man\nThe truth sets the example – live a life which is totally unselfish\nOur miseries exist because we move away from godliness, i.e. simplicity\nJoyousness can only come about by reaching the innocence of a child\nSo simple to be happy but so difficult to be simple\n4. I take away complexities and give you simplicities – taking is real giving\nView everything at its simplest value, basic value\nVile acts and harsh words have a lasting affect – because of the animalness in us\n5. What can you do for your guru? – nothing\nStory about the learned man not wanting to beg from beggars\nLet your consciousness tell you what to do for your guru – he will never ask\nLove him or help him in his work\nLife is made to give and not to take – what do you possess that you can give\nWhat you can do for your guru, that you should know yourself"}, {"ref": "UK80-24", "summary": "2. When did you realise your role as a guru? – a person doesn’t - his actions are those of a teacher\nKnowing the word of God – he knows God and then he is fit to teach\nA true guru has a direct link to the superconscious level – always absorbed in Divinity\n3. The ability of the guru to identify with his chelas – they feel the ‘presence’\nThe man of God emanates a spiritual force – the effect of Dharshan –attending Courses\nNo realisation that he is a guru – keeps unfolding to find permanency\nHe is beyond the laws of change – he brings about balance to imbalance\n4. A true guru is a doctor of the spirit – cannot take your karma away\nHe has the ability to send forth healing energies – you have to be receptive to receive\n5. Sceptics keep the world turning around\nWhen the disciple is ready, the master appears\nEveryone is affected by the guru to a greater or a lesser degree – help towards integration\nA true guru just starts teaching without preplanning – creative intelligence\n6. A teacher should be an example of his teachings – true guru can’t help helping\nThe work he has to do is a joy – the divine finger is pushing him on\nGururaj’s experience as a householder and in business – can help others in many areas\n7. His heart operation – how he started teaching\nHaving found integration, he wanted to share it with others\n8. Business gurus and spiritual gurus\nExplanation of prana and its assimilation\nEntire universe consists of prana or life force – a rhythmic pattern\nPractising pranayama – absorbing the vital force in the breath\n9. Being involved in this rhythm, the mind becomes quietened\nAttuning oneself to the universal rhythm – water contains prana\nForms of pranayama – benefits – Siddhis linked to prana"}, {"ref": "UK80-25", "summary": "1. Communion Practice\nWhy be poor, lonely and lost - poverty is in the hearts\nThe joy of travelling through the universe – conception of time\nThe assumption of being poor and lonely is created by the mind\nThe conflict of distortion has pushed one on the path of evolution\nThe goal is in sight, is near, over the hill\n2. A great force has been imparted; something within every one of you has been touched\nForget past experiences by going beyond them\nBe intent on the goal, for that intentness brings peace\nMessage – do not be guilty of anything – do not repent\nTrue repentance lies in changing one’s lifestyle to try to overcome weaknesses\nDraw on the spiritual forces within to strengthen your resolve\nOpen the book of life and enjoy that which is within you\nDon’t dwell on weaknesses but strengthen one’s strengths"}, {"ref": "UK80-26", "summary": "2. Rapid fire question and answer\nAdoption - In not choosing our parents what happens with an adopted child\nWhat can we do for you – all I ask is for your love – if it is there\n3. Conservation is necessary – choose the smaller evil for greater good\nConsciousness of the planet – famines and floods – we draw these forces\nPsychotic versus mystical experiences – no comparison\nToo much emphasis is put on mundane matters\n4. Our actions affecting another persons karma – just helping the person\nGururaj jokes about cooking chops\nBenefits of dancing for recreation\n5. Krishna ‘Rassa’ dance – loosens one up and gets the mind away\nIs there a link between meditation and Tai Chi?\nThe body is brought into a rhythm – it strengthens the mind\n6. One should never ever mix up mantras – the reasons why\nThe essence of the mantra – how it can change but not its essence\nSeed mantras are said to represent various Goddesses\n7. Mythological Goddesses – nine aspects to them\nMantras picked out of a book – system is totally commercialised\nMeditation organisation amassing millions – handing out mantras"}, {"ref": "UK80-27", "summary": "2. To reap what one sows is not necessarily a reward for effort\nPerfection cannot be gained by satisfying all one’s desires\nViolence on TV doesn’t improve society – impulses implanted will erupt again\nThe more we give vent to desires, the more we strengthen those desires\n3. Pure motivations behind the desire will always bear good fruit – selfless desire\nA desire motivated by impurity will create greater impurity\nDesire breeds expectation which is the forerunner of disappointment\nThe story of the man planting the mango tree selflessly\nHave desires motivated by goodness – imbalanced person not responsible for actions\n4. Try to find the opposite of a desire not conducive to nature – analyse the desire\nEvery desire can be sublimated by the simple process of analysis\nDesires are governed by motivation and intuition\n5. Every wrong desire will breed another desire which is stronger\nDiscriminate – discrimination depends on the awareness developed\nBy objectifying the desire, one can sublimate the wrongness in it\nNothing is done on the spur of the moment – seeds are in the mind\nRise above good and bad – with knowingness only good can come about\n6. Concept of fulfilling desires to find satisfaction is wrong\nGo beyond desires and ideas of satisfaction to contentment\nDesires become less and less – acceptance of one’s lot\nJesus went on planting the seed, working for the sake of work\nFarewell message is to meditate, meditate – therein is the path to harmony\nSatsang ends with the Prayer ‘From the Point of Light’."}, {"ref": "UK80-31", "summary": "2. Is there a need for an outer guru or can one find the inner guru by oneself?\nThe outer guru can be used to draw forth knowledge, wisdom and spiritual force\nThe greatness of a true guru is in what he symbolises\n‘What he says, does it make sense to me?’\nCriteria for judging – people think they have found the inner voice\nYou can’t judge for yourself, you need a mirror\nA true guru doesn’t want dependency or worship, only love, devotion and friendship\n3. To become a master of yourself, you have to know what discipleship is\nThe way to find the inner guru is through humility – story about Mahavir\nTo impart the human impulse to another, you need a human\nThose who experience the power of Divinity know how to guide and teach\nOuter guru may need to use cruel methods – the story about a chela being burnt\n4. Actions of real Masters cannot be understood at face value\nTo find the inner guru is a difficult path – path of heroes\n5. Not even a true guru can go against the laws of nature\nThe guru shines the light on the path – preparation is needed\nTo find the happiness, the joy within, seek someone who can help\nMan surrenders his little self to his bigger self\n6. Search everywhere and read everything – accept the ups and downs\nThe real ‘I’ can never suffer – just observe the small ‘i’\nGoing beyond the Law of Retribution – part of the Law of Karma\nOffer the fruits of action to Divinity – energy is redirected\n7. You can change the flow of a river - self effort and self help required\nDrawing Grace, you won’t feel the full impact of retribution\nGood thoughts will attract good thoughts – discretion\nStrengthening the impression and not discarding it\n8. Being established in self, no action leaves any impression\nCan never predict what the reaction to any action will be\n9. How to get rid of guilt and fear – positive attitude\nSurrender is where you unite your freewill to Divine will\nHow to take the sting out of the Law of Retribution\n10. Activating the two parts of the brain – using the intuitive side\nJudging the actions of another – spirit knows neither good nor bad\n‘Law of Love’ – if you think you love, you’re not loving – love needs to be spontaneous\nThi
