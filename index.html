  .empty-state{

hen an imbalance occurs\nRelationship of ego to sensitivity - Jesus weeping out of compassion\nThe qualities of a realised man - his compassion and love\n9. Understanding of harmony can be imparted to a child\nThe search for happiness is in everyone - different interpretations of it\n10. Choosing to come back - man wants to return home to bliss\nA unique mantra for each individual - setting a person on the right path\n11. Mechanics of how Gururaj derives a mantra\nThe quality of the intellect is not important in order to practise meditation\n12. Going from belief, to faith and then to knowingness - everyone wanting to be loved\nWhy can’t we remember past lives?\n13. The greatest gift given to man is the ability to forget\nOur responsibility for our actions in past lives - the purpose is to enjoy life\nThere is no need to believe in past lives to find happiness\n14. Ever increasing number of souls on earth - concept of progressive evolution\n15. Scientific advancement is no proof of spiritual evolution - the same vices are still here\nPeople seeking self realisation are tired of groping externally\nKarma Yoga, each man performing his duties properly"}, {"ref": "UK76-9", "summary": "2. The purpose of meditation is to bring about self-integration\nThe harmony within has to be interpreted with actions in the waking state\nOne must have the sincerity to achieve self-betterment\n3. Self-integration and self-realisation\nThrough meditational practices, we can activate the subtle powers of the mind\n4. Man has to find the co-ordinating factor\nComparison with TM Techniques\nPractising meditation doesn’t require any particular kind of belief\nMeditational practices are aimed at knowingness\n5. The mind is the cause of our suffering\nWe need to repattern the mind to its primal simplicity\nWhere does recognition occur?\n6. The self realised man functions from the heart level\nMeditation broadens the awareness of the mind and expands the heart\nThen we don’t analyse, we experience\nOne identifies with one self through this integration\n7. We can only infer to that which is beyond our minds\nHow to experience that which is beyond the conscious mind\n8. How to avoid future suffering or accidents\nOur perspective to the idea of suffering changes\nThrough meditation we become stronger and more harmonious\n9. Gururaj’s tradition and life history\n10. His searching for God and meeting Guru after Guru\n11. The true guru is the Divinity within you\nGururaj’s guru told him his duty was to be a Spiritual Teacher to teach householders\n12. Can a family with children be joyful all the time?\nAre there any benefits in spiritual development from astral travel?\n13. Mystical powers and Siddhis\nGaining these powers could result in losing one’s stability\nThe different forms of healing\n14. Meditation brings one face to face with one’s problems – not escapism\nGururaj’s teachings embrace all traditions\n15. Meditation gives us the strength to change our perspectives\nArrangements to teach Gururaj’s practices"}, {"ref": "UK76-10", "summary": "2. Great Spiritual Masters dying and not healing themselves\nThe body is subject to the workings of nature\n3. Enlightened beings seem to neglect their bodies and live on a higher plane\nThe workings of nature are transient, while life in the spirit is permanent\nThe operation of the three Gunas\nEnlightened beings don’t suffer - they have reached Divinity, they live in Divinity\n4. They have gone beyond the laws of opposites\nThe universe will never end because its composition is love\n5. Creation is beginless and endless and so is the totality of all universes\nChanges are forever taking place in the entirety of all existence\n6. The necessity for rest to help cleanse and purify the body\nGururaj’s system of meditation incorporates all the Yogas, - Raja Yoga, the practices,\nKarma Yoga, the way of living, and Jnana Yoga, the Yoga of wisdom\n7. The practices help a person to reach back to Divinity faster\nThere is only one heart - unity instead of diversity exists\nIs there a lesson to be learnt from suffering – is there a karmic debt to pay?\n8. Man is not born to suffer - the part of man that suffers is the mind and body\nThe conditioned mind has to be re-patterned\nMan suffers because of the imbalances caused by happenings\nMeditational practices help to go beyond the dormant mind to reach the benefits\n9. We feel the suffering because of our conditioning\nThrough meditation we draw a sustaining energy from within\nSometimes the mind tries to uncondition itself causing more complications\nTrying to escape from suffering is not the answer\n10. Necessary to work off karma - through doing good deeds etc.\nThere’s always a message of hope\nGururaj is nothing special – just a channel for a person to draw upon the universal forces\n11. The self-realised man has no suffering\nA true Spiritual Master can show the easier path to reach the divinity within\nGururaj embraces all traditions\nThe Emblem is a symbol of the harmony that should exist between all traditions\n12. The story of the elephant and the three blind men\n13. Gururaj has come to share the love and bliss which he has experienced."}, {"ref": "UK76-11", "summary": "2. Explains Gong meditation. The big 'I' observing the small 'i'.\nExperiencing meditation innocently, and as a daily activity.\n3 Our attitude and our ego.\nTranscending.\n'Sinking' during meditation.\n4. Feeling light, 'dizzy', during meditation\n5. Going through the 'roughness' of growth.\n6 Are troubles in life a sign of growth?\nChoosing which of two paths.\nIs meditation not working if we have no problems?\n7. Self examination. We are at fault, not our environment.\n8. Questions on counselling.\nSeeking help.\n9. Spouses opposed to meditation.\nCan other's negative thoughts, about us, be damaging?\n10. Influence of others.\nActing on thoughts received during meditation.\n11. Loving thoughts affecting others.\nShould we control our negative thoughts?\nObjectifying our thoughts - the only correct process.\n12. Can others use any mantra against us?\nDo colours affect us?\nChant - the universal pulsation.\nChant - benefits.\nChant - 7 rounds (on audio tape)."}, {"ref": "UK76-12", "summary": "2. Explanation of the benefits of chanting\nEffort is required to meditate although the practice is effortless\n3. Is the end of the world imminent?- worrying about the past and future - enjoy the present\nThe mind is composed of churning thoughts and association of ideas - due to conditioning\nThe greatest gift given to man is the ability to forget\nBy objectifying a thought, the quality of emotion is taken out of it\n4. The secret of living in the present is to absorb ourselves in what we were doing\nWith meditation we develop the ability of standing aside like during chanting\n5. Dissolution and recreation and ongoing changes in the universe - like waves in the ocean\nExplanation of the workings of the three Gunas\n6. Continuous change, continuous transformation of name and form - nothing is destroyed\nMatter disintegrates and goes back to its original finer elements\nLink between creativity and neurosis and its effect on us\nAn artist tries to perfect himself by expression - neurosis acts as a stimulus\n7. The perfected man does not create, he reflects\nHow to deal with the seemingly negativity of people around us\nWe get afflicted and inflicted by ourselves - we have to face up to the negativity\nWe shouldn’t try to escape from problems, but just face them\n8. We become strong through our practices and are not affected\nComments on Pyramid energy, flying saucers, UFO’s and Atlantis\nGururaj’s experience of meditating in the Pyramids\n9. Secrets of the Pyramids - evidence of a highly evolved civilisation\nGoing beyond the limits of the mind - drawing knowledge from other parts of the universe\n10. Qualities of a good teacher (adept) - he shows you one step at a time\nThe heart is the core of the human personality - to function, cleansing of the mind is needed\n11. The Big ‘I’ and Christ consciousness\nDifferent paths and methods to progress to self realisation - sincerity of purpose is required\nConcept of Kundalini - also a path - clearing the chakras -\n12. Explanation of Gururaj’s practices - nothing to do with theology\nNature of evil - can a person be possessed by an evil spirit\n13. The question of evil existing - do’s and don’ts - so-called evil – in reality there is no evil\nExorcism, schizophrenia – personality from a past life is brought into the present existence\n14. Gururaj sending spiritual energy and helping a girl supposed to be possessed"}, {"ref": "UK76-13", "summary": "2. Possession by a foreign entity is impossible\nGururaj’s Biography - evaluation should be made after a man has completed his mission\n3. Explanation of dharma\nOne’s duty is to follow some specific spiritual path\nThe difference between BMS mantras and mantras given by other Movements\n4. The mantra is based on the individual’s personal vibration, the present state of evolution\nand future development\nMantra is a gross expression of the subtle form\n5. The mantra is harmonious – a person will be meditating on his/her own vibration\nEmotions cannot overcome one suddenly\n6. Objectify the emotion i.e. the thought behind it\nCurb the emotions but don’t repress them\nGreater integration helps understand the negative emotions\n7. The expression of the real man within is through love\nThe tendency to blame others for our own weaknesses\n8. Divinity doesn’t create but manifests, like heat is the manifestation of fire\nGod exists because I exist and I exist because God exists\nThe nature of good and evil\nReach the state of no discrimination where there is no good and no evil\n9. Comments on prana, mediums, Siddhis and channelling of writings\n10. Dharmic partners – sharing dutifully\n11. Love pouring through into an action\nNothing happens in the world by accident\nDeep love attracts two people together in this lifetime\nClassmates - no soul mates – all are here to learn\n12. To function as a totality in every facet of life - the break-up of marriages\n13. Partners compete in a marriage thus causing break-ups - wives going out to work\n14. Qualities of a woman to bring up children\n15. Comments regarding future BMS Courses."}, {"ref": "UK77-1", "summary": "1. The Prayer – ‘The Great Invocation’\nWhere does evil come from?\nEvil is a force which is non-evolutionary and is a conception of the mind\n2. Divinity is beyond good and evil\nOne has to go beyond the laws of opposites\nProgress from participation to observation and then back to participation at a higher level.\nRecognise Divinity in everything around us\n3. When thoughts become more refined, actions also become more refined\nWe will see the goodness in everything\nThrough meditation we attune ourselves to a higher vibration\nNo such thing as overcoming evil\n4. Story about God looking for somewhere to hide\nThe search is inward to find the three part harmony within\n5. Removal of chakric blockages\nSelection of personal practices to suit the individual\nIs there a New Age or an Age of Enlightenment?\n6. Theory of evolution – within relativity, all conflicts will not cease\nThere is a balance which is always required\nCannot foresee an age when the whole of humanity will be enlightened.\nCan foresee that we are reaching a stage of calamity\n7. Individual progress on the path to enlightenment to better the world\nAvoiding the forthcoming catastrophe through love.\nHow to dive deep within through meditation\n8. Develop the heart quality and expand the awareness\nStart on the meditational path of your natural tendency\n9. The question of time and timelessness\nFrom the angle of the absolute, there is no time – the relative aspect is measured in time.\n10. Relationship between the mind, body and spirit – it just is\nYou will know intuitively that the mind, body and spirit is all but one\n11. Predetermination indicates a certain tendency\nFreewill can be joined up to Divine will\n12. Predetermination and tendencies\nMan is master of his destiny."}, {"ref": "UK77-2", "summary": "1. Those who are not interested in finding the Kingdom of Heaven, can they forfeit their souls?\nWhere does the soul reside? – man is the soul\nWith a limited instrument, the mind, we try to analyse, intellectualise things\n2. We are trying to find the subtlest level within ourselves\nThere is no question of forfeiting the soul because it is us\nThrough meditation, we refine the grosser levels so that pure consciousness shines through.\nIllumination can suddenly dawn – all else is preparation\n3. Undergoing the cleaning process, we think we suffer\nEvolution is in a circle and not a straight line\nThe process of progress through the various stages of existences\nEvolution occurs only in the relative sense\n4. The nothingness that is everything\nThe universe is forever proceeding in cycles\nNo thought or action is ever destroyed\nHappiness, bliss and joy is our inherent nature\n5. Man should be hopeful because his nature is Divine\nIf there is a lot of dirt, you have to scrub hard\nExplanation of the test for the Mandala practice\n6. Progress since Gururaj’s last visit\nActions should be spontaneous during the test\n7. Gita talks about the three couples\nCouple’s background and how they met"}, {"ref": "UK77-3", "summary": "1. Explanation of the meditation practices\nPurpose of the chant is to feel the separation between the small ‘i’ and the Big ‘I’\nWe chant in a grosser form and experience the chant at a subtler level\nNine syllables in the chant – nine is regarded to be an eternal number\nExhaling all the time – toning up the physical system\n2. If a thought is bothering us, do the chant\nSubtle body lifts to a higher vibration and one can witness oneself chanting\nChanting has maximum effect if done in a group\nPersonalised techniques – to fit the proper technique to the person\nGong meditation – reverberation goes back to the primal sound, like OM\nSound of the gong (from outside) helps mantra to reach its finer levels (inside)\n3. Gururaj’s meditation has a scientific basis and nothing to do with formal religion\nKnowledge is not a prerequisite to experience that which is really us\nState of no mind where you allow the heart to feel\nTo find our true selves, we have to become innocent as a child\n4. A person starts from where he is at\nWhen you go to ‘nowhere’, you reach the state of no mind\nThrough love one can also reach Divinity – Bhakti Yoga\nRaja Yoga combines all three aspects of the three Yogas\nWe combine the aspects consciously of living good, being good, and doing good\n5. When reasoning is mixed with love everything is enhanced with the heart\nOne is orientated with the mind\nKnowledge and philosophy is not a requisite for spiritual development.\nMechanics of subtle communication\nOne mind only and the extent of the mind is the extent of the universe\n6. The development of psychic abilities\nWhere there is greater love, more communication takes place\nIt is within the scope of everyone to reach enlightenment\n7. We commonly confuse pleasure with joy\nThe greater the pleasure, the greater the pain that can be experienced\nLove is beyond pleasure and pain\nThe mind cannot recognise love but the heart can feel love\n8. One person affecting the spiritual development of another person?\nThe teacher is just a guide who helps to stimulate the appetite\nThe pupil must be willing to learn, to be helped\n9. Many reasons for starting on the spiritual path\nThe reason for suffering is due to misplaced values"}, {"ref": "UK77-4", "summary": "2. Is there a turning point in one’s life or do we go plodding on\nThe choice is ours whether to turn or plod on\nShould we escape from what is ahead\n3. Troubles might seem insuperable\nEscapism causes psychosis and neurosis\nDetermination and acceptance\nAll problems have been caused by us\n4. Problems stemming from the subconscious mind\nEffects of positive affirmations\n5. Turning points are under our own control, not external\nNo need to suffer – assistance is there from Gururaj\nStart with oneself – measure strengths and weaknesses\n6. Innocence of a child\nMan evolving to find peace and happiness\nInnocence of a child is superficial\n7. Tendencies and samskaras are all there in the child\nDisciplining a child\n8. Competition – that with others is not conducive to growth\nCompetition within is created by conflicts – forces of good and evil\nReal competition is good – depending on the motivation\n9. Meaning of the soul – pure spirit or consciousness\nHow individuality is created\n10. Through meditational practices we merge back into Divinity."}, {"ref": "UK77-5", "summary": "2. Living by inhaling Prana\nDeveloping Siddhis\n3. Not to become involved in developing these mental powers\nInterest in accumulating material wealth\n4. Succumbing to temptations through using Siddhis\nThe goal of evolution is to become ourselves again\nStory about finding a ‘Happy Man’\n5. Acquiring the ability to draw from the sun’s energy\nStory about Bima from the Mahabaratha\n6. Facing one’s weaknesses\nEmotional release of tears during meditation\n7. With proper realisation a burden is lifted\nCleansing of the heart\n8/9 Amrit’s involvement with BMS\nLiving tomorrow today"}, {"ref": "UK77-6", "summary": "2. Anger – whether to suppress it or express it\nAnalyse the anger – do not suppress it\n3. The basis of anger is normally fear, due to insecurity\nSuppressing anger leads to inhibitions\n4. When you analyse the cause the impact is lost\nThe true meaning of the teachings of all religions have been lost\n5. The nature of negative thoughts\nWith analysis, the negativity loses its sting\nNegativity is replaced with positivity – weakness with strength\nAnalogy of the jug of dirty water\n6. Seeing our faults – not living by habit\nBuilding up positive credits\n7. Direct the mind towards positivity, shakti\n8. Jesus expressing anger in the Temple – was eager to teach\nAnger was not real – using drastic methods\nHow to live in the present\n9. How the practices make you aware of the present\nLiving tomorrow today\n10. Live today as it should be lived\n11. Thy Will Be Done"}, {"ref": "UK77-7", "summary": "2. ‘Guruvar’ - Thursday as a day of fasting\nAccepting one’s fate\nSpontaneity – expression should be free of tendencies\nUnpredictability of the future\n3. Living life artfully – spontaneity increases\nGoal of all actions takes us there spontaneously\n4. Fate – a momentum has been created but we can change direction\nStory of the ox cart and the driver\nAstrology and prediction\n5. Fearing the future\nIncreased power where a group sends out healing thoughts\nHow to send out a healing force\n6. Observing celibacy to achieve self realisation\nActing harmoniously is the way to reach Nirvana\n7/8 Burying the good in ourselves and emphasising the bad\nEntire universe is an expression of Godly good\nActing naturally, you become one with nature\n9. Promises in marriage"}, {"ref": "UK77-8", "summary": "2. Mechanics of healing energies\nAll beings are connected by subtle energy\n3. Interaction between different forms of light\nHealing is the ability to manipulate subtle forces\nOne has to learn how to heighten these energies\nAnalogy of going to a doctor – you cure yourself\n4. Holy people radiating a healing energy\nConcept of Darshan – vibrations are heightened\n5. Meditator having doubts and losing faith\nDoubt arising from the mind and not the heart\nSteps to eradicate doubts – to come back to face it\n6. Gururaj’s search to find ‘Who am I?’ – gave away all in his search\nEvery word he speaks comes from personal experience\nStart with doubt which will change to belief, develop to faith and then to knowingness.\n7. Male and female sexuality\n8. Why more male gurus than female gurus\nMale characteristics more suitable to go forward to teach"}, {"ref": "UK77-9", "summary": "2. Integration achieved through meditation has a beneficial effect on the body\nMeditation affects every aspect of our lives\n3. Progress report on other meditation centres\n4. Effects of abortion on the soul\nEvaluation – choosing the lesser evil\n5. Lessons in life to be learned from coincidences\nNo such thing as coincidences\n6. Assanas – stimulate the inner organs of the body\n7. Concept of freewill\nFusion between freewill and Divine will through meditational practices\nThe various paths of Yoga\n8. Karma influencing events in one’s life\nA person going through life unstressed is not free from Karma\nKarma is a natural law which helps us to grow\nMisuse of science and technology\n9. Through science one can be brought to God"}, {"ref": "UK77-10", "summary": "2. Concept of celibacy\nSuppressing sexual urges can lead to inhibitions\nHow to adhere to moral values\n3. Meditation helps to guard against permissiveness\nConcept of love – moral values which have been lost\n4. Taking on another person’s karma\nDraining spiritual energy – the drain is on the mind\nMental conflicts\n5. Moral values in the society and time in which we live\nCommercial interests in permissiveness\n6. Do the sins of the parents rest on their children?\nTendencies are there before birth\nTaking guidance to find the path most suitable\nUplifting the vibrations through chanting\n7. Uniting with a higher power\nHumility is spontaneous and doesn’t need cognising\nA humble person is one who can really love\n8. One existence or many?\nReincarnation exists only in relative terms\n9. At the grosser level there are many incarnations\nCircle - from silence we come and to silence we return\n10. Comments about advanced practice"}, {"ref": "UK77-11", "summary": "2. Self-expression through activity\nOne’s aim in life is to unfold the changeless quality underlying all activity\n3. By conscious effort we change the form of what is there\nUsing the power of discrimination\nLosing the sense of separation\n4. Looking for guidance\nThrough refinement one’s perspective changes\nLearning the lessons in life – the mechanics of loving\nThe infinite cannot be defined but can be experienced\n5. The aspects of surrendering the ego to the ideal\nThe many ways of approaching Divinity\nPositive affirmations – you are what you think\nThe easiest path is through the concrete to the abstract\n6. Truths have to be expressed in an understandable manner\nContribution to refinement of the body from Hatha Yoga\nThe body can be tuned to the greater harmony of the mind\n7. Serving humanity – motivation behind it?\nSelfless service\nDeveloping supernatural powers or Siddhis\n8. Understanding the workings of the subtle laws\nAs the awareness develops, regard the beauty to be God’s beauty\n9. Unusual supernormal experiences during meditation – enjoy them\nPointers on the way home"}, {"ref": "UK77-12", "summary": "2. Choice between helping a human or an animal.\nDon’t discriminate – no need to separate energy – both creatures are one\nHealing energies are never depleted\n3. Sincere kindness is a healing itself\nBecoming loving, we become loveable\nSeeing good in everything, do we become unresponsive to people’s needs?\nPositive thoughts - always helpful?\nWith motivated love, the little self is involved – therefore not true love\n4. Positive thinking should not be allowed to produce impracticality – neglect of family\nDeserve first and then demand – all your needs are then provided for\nPositive thinking needs positive action – story of the young doctor\n5. Taking teachings from other Masters, like Rajneesh - Hansa bird\nEverything in life is a teacher, a Guru – depends on what we grasp\nTry to find the truth in every teaching – don’t discard it – put it aside for a while\nYou might disagree with a teaching but don’t condemn it\n6. How to decide which as aspects of teachings to apply in our lives\nEverything is true – we progress from a lower truth to a higher truth\nWhen the chela is ready, the Master appears\nWhat motivates the search? - What am I seeking?\nNo untruth – a matter of perspective – Judging, who are we to judge?\nMeditation provides greater perception, greater awareness, greater expansion\n7. Understanding our position in the social order\nWe are here to become better human beings – to be helpful to the environment\n8. Divinity wants man to evolve himself, to find his own salvation\nSin against the Holy Spirit – sin disrupts the stability of society\nSin is profane while the Spirit is profound - all the ‘Shalt Nots’\nEffects rebound on the sinner - we are the judges, the punishers, ourselves\n9. Divinity is beyond judging because sin cannot touch the Holy Spirit\nTo find happiness, we avoid acts that rebound on us\nIf we open ourselves, Divinity floods our lives and we become sinless."}, {"ref": "UK77-13", "summary": "2. Dimensions of time and space\nAttaining self realisation in this lifetime\n3. Every experience is for the purpose of evolution\nEvolution is always progressive\nEvery being is a realised being within himself\n4. Qualities of a realised man\nWorking on our own weaknesses\n5. Importance of realising a weakness in ourselves\nFacing oneself to eradicate one’s weakness\nSelf realisation is to know and experience the Divinity that is already within\nRealising there is no such thing as sin, there is only God - contradiction\n6. Need to express this realisation through thought, word and deed\nTotal non-attachment to the action, yet enjoying the action\nTheologies have promises they cannot prove to exist\nCharlatans preying on the gullibility of human beings\n7. Face ourselves with courage\nThere are always ups and downs to face\nStrength gained through meditational practices\n‘Lead me on one step at a time’"}, {"ref": "UK77-14", "summary": "2. Group meditational experiences\n3. Examples of healing – Gururaj is just a channel\nTaking on another’s karma through healing\n4. Explanation of how healing works – tapping into the source\nThe flow of energy from the Divine reservoir\nBy surrender and pure actions we become a channel for Divine grace\n5. Personal and Impersonal God\nBe in holy company – radiation from that presence helps us\nUniversal being cannot be explained using the finite mind\n6. All analysis is limited in explaining the limitless\nDivinity and Divine laws can be experienced\nMeditation starts where the mind stops\nHeart quality, the purity within\n7. Feeling is of the mind – experience is of the heart\nStill the mind and allow the purity of the heart to flow through all actions\nChoosing the path of the lesser evil\n8. Everything has life – become more refined through meditating\nPersonal refinement – eating more refined foods\n9. People with incurable diseases – choices in ending their lives\nTerminal diseases – conditions\n10. Escaping from karma – suicide\nDivinity symbolised as a Protector\n11. Affirmations after meditating"}, {"ref": "UK77-15", "summary": "– Teachers’ Questions & Comments\n2. Twitches during meditation\nNegative influences of magnetic healing\n3. Twitching due to a sound foreign to their own vibration (mantra)\nDangers of meditating on any sound\nTwitching may be due to suppressed emotions\n4. Unstressing – healing creates a balance\nMisuse of drugs causing problems in the subtle body\n5. Cannabis can stay in the system for seven years\nAffects of drugs on the subtle body\n6. Activation of the chakras by meditational practices\nMeditating and continuing to take drugs\nNo effect without effort\n7. The more effort, the more meditation (which is effortless) helps\nTuning into the shakti channel - the intuition dawns\n8. Excuses for not practising self-help\nMantra being most harmonious – the sum totality of a person\nReason for not divulging a mantra\n9. Discussion regarding using mantras\n10. People’s negativities on Courses\nNeed to be tough when teaching\n11. Ramakrishna’s story about the good physician\nNew meditator looking for miracles\n12. ‘Leading one person to salvation’\n13. Questions and comments about the Tratak Practice\n14. Opening the third eye for inner perception\nReason for choosing a flame\nVisualisation is not necessary\n15. Pineal Gland – research on its secretions\n16. No visualisation or it getting worse\nVisualisation can never disappear – may need a rest period\n17. Gap between thought and mantra – centred\nQuestions about experiences while doing the practices\n18. Visualising while healing"}, {"ref": "UK77-16", "summary": "2. Meaning of promises to another\nPromises have to be made with sincere feeling and should be spontaneous\n3. Self promises are filled with expectations\nDuty and dependency\n4. Remembering previous lives\nSpiritual pride – a stumbling block on the path\nGreatest gift to humanity is the gift of forgetfulness\nWe are the sum totality of our past lives\n5. Select what is good out of the philosophies imparted\nAll is preparation on the path to illumination\nThe past is still guiding our present tendencies\n6. Processes of purification\nFacing oneself in the mirror to find the problem within\n7. Life is a school in which to purify ourselves\nConflicts in the mind cause the suffering\nIncreasing and decreasing the conflicts, both achieve the same result\nHow meditation helps\n8. Might the techniques influence future karma?\nBy functioning in harmony, we enrich our lives\n9. Reincarnation – mystics don’t talk about it, why?\nThe Big Bang theory of evolution\n10. One born in happy circumstances, another in unhappy circumstances\nOnly in the relative is reincarnation necessary\n11. The mind asking the “Why of existence”\nTranscend the mind and silence is awaiting to be experienced\nThe answer to the question ‘Who am I’?"}, {"ref": "UK77-17", "summary": "2. Various types of fear\nProblems and inadequacies are based on fear\nAll fears are baseless – tricks of the mind\n3. The mind is the analyser, carrier of impressions and storehouse of impressions\nStrengthen the mind to reject impressions\nThe ego fears losing itself\nFears are based on the ego self\n4. Meditation cleanses the carrier of impressions\nFearlessness is love – story of Gururaj meeting the tiger\n5. Fear in a crisis generates a large amount of energy\nTo overcome fears of situations, quieten the mind and meditate\n6. Impressions are forever changing – they are not real\nUnderstanding is needed – the immortal self is untouched\nOpinions of others not affecting me\nWhen man accepts himself, he can accept everything around him\n7/8 When the ego is refined, it becomes more uncluttered and the light shines through\nAs the turbulence of the impressions becomes calmer, fear disappears"}, {"ref": "UK77-18", "summary": "2. Choosing the circumstances of one’s next life before being born\nThere is no death, there is only life\nExplanation of the difference between the subtle body and the grosser body\n3. Subtle body is a mass of experiences – needs the grosser body\nOne takes birth for refinement of the subtle body, with the help of the grosser body\nParents not choosing their children\n4. Period of evaluation not of evolution (before birth)\nJudgement - the real judge is ourselves – being honest to ourselves\nIn the subtle realm, no attachment, therefore real honesty and sincerity\n5. In meditation every moment you transcend, you have died – twice born\nShape and colour of the subtle body – diseases can be seen from the aura\nExercise of closing off the senses – experience the subtle body in colour form\n6. With refinement, greater luminosity is perceived – concept of light\nLaw of repayments – by increments\n7. Only by standing still can you evaluate\nChoosing the physical form in which to right wrongs, do things etc.\nInvolved in the propulsion of evolution – cannot step off the wheel of karma\n8. Nature of the soul – awareness is never lost\nMemories of past lives remain in the consciousness – everyone can know them\n9. Spiritual path should be guided by a Guru\nChoosing a particular form of meditation\nSelection made according to one’s tendencies\n10. Difficulty in recognising Divinity\nThe quest to find the real truth – open the eyes and see\nWe have to be at the right stage to recognise Him"}, {"ref": "UK77-19", "summary": "2. Role of Personal Gods, Angels, Gurus, and Teachers\nRelationship between man and the God he worships\nHuman mind cannot conceive of the abstract\nConcept of revelation – human mind in communion with the abstract\nThe intangible abstract has to concretise itself – deities formulated\n3. Abstract God becoming a personalised God\nMan needs an ideal greater than himself to identify with\nPersonified God – human form, yet retains the realisation of the abstract form\nWith devotion to that being, a communication takes place\n4. Devotion opens up the heart\nThrough the personalised ideal, we can become one with Divinity\nExplanation of the concept of a Personal God\n5. The abstract which is nothing, is everything – story of opening up the seed\nThe existence of God in everything\n6. How to deal with and accept negativity coming to the fore from within\nAcceptance is facing the problem\n7. Alcoholic’s acceptance and surrender to a higher power\n8. Whatever the adverse circumstance, there is always a way\nWhere there’s a will there’s a way – not my will but Thy will."}, {"ref": "UK77-20", "summary": "2. Any form of negativity is perpetuated by itself\nAll the work of Divinity – Divine will\nHow to use freewill positively\n3. Having fears because of personal inadequacies\nFears stem from ourselves and not from the environment\nThe ego wants to be the centre of attention\n4. Centring ourselves, we lose the identity of ego\nWhen individuality ceases, the ego is subdued\nNo separation – nothing to fear\n5. With integration, we can eradicate the fears\nFlashes of telepathy and intuition\n6. The mind of man is a universal mind\nBeing centred – a sense of knowingness\nNon-verbal communication\n7. Finer levels of existence\nMisuse of thought forces, leading to mental imbalance\nSiddhis or mental powers can be stumbling blocks\n8. The story of the chela walking on water – devolution\nReal goal is to find the Divinity within, not Siddhis\nTrue proper healing – motivation behind it\n9. Justification for any action – for using mental powers\nTapping into subtle layers of the mind\nTratak – develop concentration not miraculous powers"}, {"ref": "UK77-21", "summary": "1. Summary of content of pages\n2. Types of laughter – so close to tears?\nSpontaneous laughter – laughter from alertness or dullness?\n3. Laughter is a joyous communication – a sharing of joy\nMechanics of spontaneous laughter – motivation behind the laughter\nAbility to laugh at oneself – an element of suffering is contained in it\nTears and laughter – expression of the law of opposites existing everywhere\n4. Preserving tranquillity, while we accept tears and laughter equally\nAnalogy of a poet – he reaches the highest heights and the deepest depths\nSadistic type of laughter\n5. God having knowledge of future events?\nFuture based on one’s assumptions which may not work out\nAll promises are based on expectations\n6. When expectations don’t come about, disappointment and suffering result\nWork for the sake of work and not for the reward\nIdea based on the ‘I’ of myself – “I’m expecting this”\n7. Life should be lived within a plan but with free expression"}, {"ref": "UK77-22", "summary": "2. Christ and Gururaj – their teachings – same eternal truths\nDifference is a matter of presentation\nAvatar – realised being who takes birth by choice to enlighten mankind\n3. Avatar will never say “I am that” – recognition must come from those around him\nPeople recognise the Incarnation later – never at the time\nTeacher leads you to know what truth is, what Divinity is – knowingness\n4. Difference between knowledge (acquired) and wisdom (sense of knowingness)\nStudy and intellectuality can lead one to confusion\nMan must be judged by what he really is\n5. Christ saves by ‘showing you’ how to take away your sins – not taking them away\nGuidance as to how to make choices which are conflicting - based on individual egos\nIf one chooses the lesser of two evils, (lesser hurt), the karmic debt is less\n6. Because of relativity we cannot escape from our own doings\nSometimes we have to hurt to produce the greater good\n7. Visibility of subtle bodies\nIn a group, subtle bodies interact to increase the brightness\nBenefits from attending Courses – Guru emanates love\n8. Why people move from Guru to Guru\nGuru is showing you the way to create harmony within yourself\nActions of the true teacher – Ramakrishna’s story about the physician\n9. Amrit speaks about his life, his honeymoon, meeting Doug McConnell etc."}, {"ref": "UK77-23", "summary": "2. Must all wishes be fulfilled? – nature of the wish\nA wish becoming a desire and then an affirmation\nDesire strengthened by yearning, becomes a burning desire\nBurning desire - the basic principle of success or failure\n3. Believing ‘I Am Possible’ - all impossibility ceases\nContrary wishes – indecision, cannot make up one’s mind which wish to select\nEveryone has good in them – hence the yearning for spiritual wealth\n4. How to combine two contrary wishes to form a third wish\nThrowing away riches is not the way to Divinity\nHave everything but infuse Divinity in it and enjoy it more\nChanging forms are an integral part of that which is changeless\n5. How to turn wishful thinking into a strong sustaining desire\nChildren’s responsibilities to their parents\nParents are responsible for themselves and not for their children\n6. Children doing parents a favour – creating a sense of responsibility to assist evolution\nLife is composed mostly of duties\nNo expectations of children – then no disappointments\n7. Parents trying to superimpose their ideas upon children\nBy being involved and with no superimposition, children don’t rebel\nPraying for the departed souls – helped by sincere prayer\n8/9 Absent healing – sending positive thoughts makes the path smoother\nHow long to pray for a departed one after death?\nNever forget departed ones – true remembrance, true love\nComments regarding the chant"}, {"ref": "UK77-24", "summary": "2. What carries impressions from one incarnation to another?\nThe soul is the spiritual self which is perfect\nThe subtle body perpetuates itself – made up of impressions (itself)\n3. The mind is just a bundle of impressions – carries the samskaras\nThe binding factor is the spirit or soul\nThe subtle body has to become more refined\nNo destruction, only transformation of matter\n4. After it reaches its finest level, the subtle body goes back to its original elements\nThe pure spirit is left alone – one spirit – God\nEvery experience gained is evolution\nPreparation for enlightenment\n5. If the goal is joy, the path must be joyous\nMind is nothing but whirling thoughts, association of ideas\nPlanting cruelty in a child’s mind – even through nursery rhymes\nEducation – conditions minds towards cruelty\n6. If we have harmony within, we radiate that harmony\nImbalances will always remain – go beyond them\nUse discrimination to find what is real and unreal\nGo beyond the limits of acquired knowledge and find wisdom\n7. Go from belief, to faith, to knowingness – spiritual awareness\nFuture catastrophe – the world has always been in a mess\nWe only see surface values, not the reality\nDevelop the awareness to see beyond the dirt, then all is clean\nMy deception creates these illusions in me – major factor is ‘Me’\nFind the beauty within, then all is Divine\n8. The ideal of goodness within all of us – spurs us on"}, {"ref": "UK77-25", "summary": "2. Chanting in a group, number of rounds, odd number etc.?\n3. Transcending the ‘Meaning’ of the mantra\nUndulating waves in the rhythm of the chant\n4. Money causing problems, yet we cannot do without it?\nHow can we let go of its hold and recognise we will be taken care of?\nPaying for the air we breathe\n5. Exchange and barter in the past – now everything is based on economics\nWanting to give but not having the money, has its own spiritual value\n6. Giving with doubt and not with love – not really giving\nThose that have should give, if they feel it in their hearts to give\n7. Giving – an offering made for the benefit of others\nGiving, so that BMS have their own Centre instead of paying rent\nAppeal for funds, not for Gururaj’s benefit\nWhen serving man, we are serving Divinity\n8. The best way to benefit from Gururaj’s advice\nWhat Gururaj has given is love – to his capacity\nHe is just a channel for this love to flow\nRamakrishna – “Taking one person to realisation, my mission is fulfilled”\n9. Communication through letters – sending out prayers\nSharing the love – everything is contained in love\nWhen we become love, we become everything"}, {"ref": "UK77-26", "summary": "2. Why children don’t continue meditating? – if parents meditate, the child will follow\nChild requires pushing – parent joining in the practice – see it as a play not drudgery\n3. Child’s attitude towards meditation – arduous or enjoyable?\nA sense of participation – togetherness in activities\nParticipation is the basis of communication of oneness\n4. The greatest gift you can give to children is meditation\nThere should be scope but with guidance\n5. Can a realised man recall the process of being born?\nBirth is not traumatic – a child feels the loss of security\nChild is born with a dependent security – has to become independent\nMother’s knowledge is instinctive and not gained from books\n6. Cultivate the instinctual intuitive ability\nYears five to seven are most important in a child’s upbringing – being moulded\nCustom among Hindu people before the child is born\nHare Krishna chant\n7. Acceptance of other gurus – imparting some truths\nVarious types of consciousness – all are but one\n8. Comments on visit to Stonehenge\nMeditators’ experiences of doing their practices\n9. General conversation and discussion\n10. Comments regarding doing the Tratak Practice\nSounds experienced during and coming out of meditation\n11. Discussion on experiences of the group members\nPsychic experience in meditation not necessary for a person’s evolution\nExtra-sensory perceptions – some born with them – activated in others\n12. No experience and therefore feeling meditation is not working – why?\nGururaj’s story about a Meditator – no experiences yet many improvements in life\n13. Not the one hour or flashy experiences is important, but the rest of the day\nIs our daily life improving, or is it not?"}, {"ref": "UK77-27", "summary": "2. Leylines and lines of spiritual energy\nGururaj’s experience at Stonehenge\n3. Temple with a fire, symbol of Divine light\nExample of a universal culture practised in many areas\nKnowledge being cognised at the same time in different locations\nNon-verbal communication - inventions\nMagnetic points in the world where vibrational forces can be felt\n4. Going beyond the grosser level of the conscious mind to the subtler level\nTuning into thoughts – perceive the minds and motives of people\nChanges in technology – come about through probing the deeper levels of the mind\nVibrations at a deep level are very refined – radiation stretches out\nStones positioned for sun worship – symbolic of Divinity\n5. Geographical layout in ancient times helped with communication\nAwareness of people – they make the centres high energy points\nReincarnating into other worlds\n6. Forms of civilisation depend on the intelligence of man\nAbility to experience other worlds\nCivilisations with no stumbling blocks, phobias or inadequacies\nFunctioning as a whole – not dependent on anything\n7. The need within produces insecurity and then dependence\nLosing the sense of dependence – losing the sense of ‘I-ness’\nDependence – interdependence – non-dependence\n8. Process of evolution can be accelerated through meditation\nOn reaching a certain level of consciousness, do you lose it at birth?\nNo retrogression – consciousness is always retained\n9. Details of the test for the Mandala Practice – closing off the senses"}, {"ref": "UK77-28", "summary": "2. How can the forthcoming catastrophe be averted\nThe heart quality is lacking today – heart quality can help to balance the mind\nOnce the subtler levels of the mind is activated, the energy has to be used\nUsing the subtler levels of the mind gives rise to inventions – using subtler laws\nNew discoveries are all for destructive purposes, neutron bomb etc.\n3. Only way to avert this destruction is by heart expansion\nReason for attending Courses – unfoldment of the core of human personality\n4. Gururaj’s sorrow at seeing how humans live\nBy heart expansion – living according to God’s will\nImportance of the Preparatory Teacher – vital link\nBenefits from teaching – working for yourself, unfolding yourself\n5. We don’t want numbers – don’t want to push the teachings, not necessary\nNot charging any fees – donations to cover BMS expenses\nYou’re not a teacher if you don’t teach\n6. Difference between worship and devotion\nGurus with auras – personality cults – worship God, not false idols\nGurus hiding the truth or putting forth a distorted truth\n7. Real devotion comes from the ability to love, generated at heart level\nHeart expansion, love and devotion all go together\n8. True gurus don’t need worship – they are there to serve, to communicate\nFalse worship – false idols are the incarnation of the devil\nReal love and openness of the heart comes without motive\nNever develop a sense of worship to a guru - it is not necessary\n9. Martyrs – called so by us because of their supreme sacrifices\nEgo involved in saying ‘I am sacrificing’\nParents sacrificing themselves for their children\n10. Self-proclaiming martyrs – know nothing about faith\nWhen faith is developed, we do things spontaneously"}, {"ref": "UK77-29", "summary": "2. Can the speed of thought energy be measured and how is such energy received?\nSuch a machine is beyond the realms of science\n3. Expressions on a person’s face can tell their feelings, what is in the mind\nThought patterns are connected to the Pineal gland\nDescription of the Pineal gland and the operation of the Ajna Chakra\n4. Not disclosing mysteries to people who would misuse them\nThoughts can be picked up, but of what use is this facility?\nIf I am strong within myself, let the other person think what they may\nNegative thoughts having no affect – rebounding back on the sender\n5. Many things we want to know but there is no logical answer\nThe mind can only tell us about a thing and not what it is\nReaching the stage where the mind does not question,\nThen illumination dawns and everything is known\n6. Acquired knowledge does not make you wiser or happier\nWisdom is already there – unfoldment brings you face to face with it\nJivanmukta – act as you like but the actions are non-binding\n7. Mind is forever enquiring - Jnana Yoga\nOne reaches the stage of no question\nJust experience God – the wholeness within itself – no question left\nKarma Yoga saying ‘Do good be good’ – how to do it naturally\nHow to reach the stage of spontaneity – use effort and discrimination\n8. Forces may override one’s discriminatory factor – need to wake up – stone in the groove\nWrong action only comes from a kind of imbalance, a form of insanity\n9. A guru can show you how to reverse wrong action\nTo do good, conscious effort is required at the start\nReaping can be made easier by invoking the Law of Grace\nAfter attending a Course, one will find their insight deepened and greater love and joy permeating"}, {"ref": "UK77-30", "summary": "2. Validity of Ahimsa or non-violence\nNon-violence mean starting off with oneself – conflicts within oneself\n3. Violence existing everywhere - flux taking place at subtler levels\nDefending oneself can lead to greater violence\nTo become totally non-violent is against the principles of nature\nNon-violence can fail collectively but succeed on an individual basis\n4. Comments about Gandhi, his nationalism – artificial barriers\nTo practise non-violence is an impossibility\nConcept of one world, one family, not separate nations\nRelativity cannot exist without counter-forces i.e. non-violence and violence\n5. Transcend the opposing forces\nRefining the mind – leading it from grossness to refinement\nOperations of the mind – carrier of impressions, then judging, and then on to the ego self\nThe more refined, the more light of Divinity shines through\n6. The mind is a superimposition on reality – which is unreal\nThe mind itself must be used to refine itself\nWe need to recognise the Divinity within, that ‘I am Divine’\nPositive affirmations – help to make us stronger\n7. The mind is beginless and endless – cannot be destroyed\nThe whole of existence not viewed in time or space but in a moment\nEnemies – provide an opportunity for growth\n8. Loving one’s enemies – the ones most difficult to love\nNature creates conditions for us to face our weaknesses\nThe basis of all pride is the ego sense – the ego feels the hurt\n9. Opportunity in every diversity\nAnalysis without letting the emotions become involved\nObjectifying the criticism\nExpanding the awareness – looking at a thing in its real true form"}, {"ref": "UK77-31", "summary": "2. Mechanics of sleep – mind and body require sleep\nQuieten the mind so that the spiritual energies can permeate the body\nAs the mind becomes more refined, less and less sleep is required\n3. Analysis of dreams and comparison with meditation\nIn the dream state there is a release of tension\nReliving an impression in a dream is eradicating the samskara\n4. Nightmares allow deep impressions to come to the fore\nYogic mind seldom dreams\n5. In meditation you are aware – realm where awareness exists by itself\nPeople draining energy from us – we drain ourselves\n6. The art of how not to be drained\n7. Taking on the negative karma of others\nGuru not taking karma away – showing how to eradicate the karma\nJesus came to show us how to help ourselves\nThe Law of Grace affecting the Law of karma?\n8. Invoking the Law of Grace"}, {"ref": "UK77-32", "summary": "2. General discussion about the Concert\nDivine will and free will operating simultaneously\n3. Functioning according to Divine will - predestination\nDivine will and freewill – patterns set in a person’s life\nThe extent to which Divine will influences freewill\nFreedom of Divine will reflects to us as freewill – freedom of choice\nThrough the power of expression, man is allowed freewill to reach the essence of himself\n4. Man deludes himself thinking every action is done by himself\nAllowing freewill to merge into Divine will\nMaking a choice of a path to take – still the mind and then make the choice\nLet the inner voice speak and then we intuitively know\nYou make progress on the path, even though there are hurdles\n5. Past actions also influence freewill\nWhen freewill is attuned to Divine will, you find real peace and happiness\nYou can manipulate Divine will for betterment\nFinding great spiritual upliftment in listening to music\nComparison of Western and Eastern music – systematic v. improvisation\n6. Everything in life is music – harmony\nIndividual preferences – what we attune to\nCelestial music – the sky is filled with music\n7. The real meaning of Communion – experiencing the Divinity within\n8. Music bringing relaxation\nMantra meditation – when one attunes to one’s vibration, you go deeper\n9. Music providing mood making?"}, {"ref": "UK77-33", "summary": "2. Attitudes and beliefs – we can bring a belief to a reality\nMind must be consumed by belief for it to materialise\n3. Belief in love – real belief goes beyond the power of thought\nThought can have many motives\nTo bring belief to reality is done through integration\n4. Belief as a path of devotion – Bhakti Yoga\nTrue belief – grace is always there\nUsing thoughts to become more integrated – play very small part\n5. Being non-attached to the fruits of action is very difficult?\nActions are then non-binding\nDetachment is escapism – with non-attachment, the results are non-binding\n6. There is no work which will go unrewarded\nMisery stems from expecting reward\nReminder of our duties in life\n7. There are no mechanics of enlightenment – enlightened men making mistakes?\nSelf realised man is free from the laws of opposites, non-attached, entirely free\nStages in man’s evolution – involved in the Gunas\n8. The refinement of the mind – going from darkness to light\nEnlightened man needs to shed the body to achieve total unity\n9. Who are we to judge what a mistake the living free makes?\nThe ‘play’ of the enlightened man\nAvatars coming from the vastness to this little world\n10. Avatar has come to teach, to lift man from oppression – to share the truth\nGreat world teachers start teaching after their thirties."}, {"ref": "UK77-35", "summary": "2. The concept of knowing – how can one know?\nKnowingness – indefinable because the mind cannot understand it\nThe real ‘I’ within, is knowingness itself\n3. Using sense perceptions, mind, intellect combined with the ego\nEvidence can be contradictory\nPhysical senses are a reflection of the knowingness\n4. We use meditation to reach the state of pure consciousness, knowingness\nQuest mixed with yearning to find the answers\n5. Why one has a reduced desire to reach enlightenment?\nProgress from desire to bewilderment, to a refined desire\nDeveloping the sense of non-attachment\n6. Not being bound by desire, we reach the state of desirelessness\nIn the knowingness area, you just know – no separation\nThe confusion which arises is due to mixing up perfection with imperfection\nEvolutionary processes according to needs – only in the relative\n7. The many paths - knowledge, devotion, doing good etc.\nRaja Yoga – the royal path combining all the Yogas\n8. Spiritual link between Guru and Chela is never broken\nAwakening and expansion of mind and heart"}, {"ref": "UK78-1", "summary": "1. Crime and punishment.\nSociology based on preserving stability in society.\nIs punishment fair?\n2. Rehabilitation rather than jail.\nMany policemen and criminals are expressing childhood oppression.\nTendencies from our evolution.\nSome of us are dominated by our lower nature.\n3. Overcome tendencies through self-help.\nUplift our vibrations. Show others understanding.\nWho am I to judge you?\nLove can be 'walled up'.\n4. Do not think in terms of punishment.\nBe practical.\n5. How do you (Gururaj) defend that you could be a tool for Satan?\nDoubters are seekers. Believers do not know.\nSo much built on faith but not knowledge.\nProve God to me! Satan & God are in the mind of man.\n6. Allow Sattva (light) to dominate.\nTruth known only in the heart, not in the mind.\nTruth is not utterable.\nExperience synonymous with realisation.\n7. Edited (unclear) film track."}, {"ref": "UK78-2", "summary": "2. The nature of time – time as a concept cannot be self existent\nTime is measured by comparison – use the mind as the measuring instrument\nMan’s worries about time – passing him by\n3. In the absolute sphere there is no time\nWe become attached to time – want to get the maximum benefit of time\nTime always has boundaries – man wants to be free\nTo realise the meaning of timelessness, we have to go beyond time\n4. How to discover freedom in bondage – bound by conditionings\nWe have created our own environment, internal and external\nIn the movement of time and space, I can be still\nIn the stillness find the meaning of timelessness\nEternity is timeless and boundless – through meditation we are led there\n‘Lead me from mortality to immortality’\n5. Ego has the perception of time thinking it can find permanence\nPreserving the ego yet finding that which is egoless\n6. Opportunities for growth through stress – for thought, through relaxed living\nProgress from concentration to contemplation to meditation\nOpportunities are there in everything to learn, to evolve\nThe greatest suffering in life is in our mind\n7. Question of attitude towards adversities\nUse the affirmation “What can harm me?” – greatest opportunity"}, {"ref": "UK78-3", "summary": "2. The mechanics of Raja Yoga – Royal path to Divine union\nPath of Yoga is the path of heroes – wanting to be in touch with the Maker\nRaja Yoga combines all the other Yogas, right action, devotion and analysis\n3. The eight limbs of Raja Yoga\nYama and Niyama – Yama or Ahimsa – non aggression to ourselves and all around us\nSatya – truthfulness – acting truthfully\nAstya – non-stealing – contains non-violence and truth – not stealing a person’s peace\nYama – Brahmacharya, to walk in the path of Divinity – not just celibacy\n4. Forms of control over oneself – all aspects merge into one\nAparigraha – rejection of all ties and imbalanced attachments\nDetachment is escapism – practised by Ascetics and Saddhus\n5. Mankind’s greatest curse is ‘Me and mine’ – we belong to the Almighty\nNiyama – five aspects – inner and outer cleanliness, right thinking\nContentment – contented in acceptance of my lot in life\nWith Niyama, kindness, compassion and a sense of service all follow\nPain and pleasure viewed objectively – not having a binding effect\n6. Tapas – austerity – indifference to extremes\nSelf-study, self-analysis – the study of the Scriptures\n7. Evaluation of the day’s activities – credit balance\nSelf surrender to Divinity – ‘Thy Will be Done’\nLoving the incarnations of the Absolute"}, {"ref": "UK78-4", "summary": "2. Yama and Niyama – ethical and moral precepts of how to lead a good life\nThird limb is Assana – part of Hatha Yoga – exercises for the body\nDevelop co-ordination between mind, body and spirit – leaves the spirit free\n3. Total purification or cleansing – preserving the subtle energy of the breath\nPranayama – tuning into the universal rhythm of the universe\n4. Pratyahara – withdrawing the senses\nDharana – developing concentration by doing Tratak\nDeveloping contemplation – pouring oil from one vessel to another\n5. Sarvikalpa Samadhi – Samadhi with form, necessitates thought\nConcept of Divinity with form – object of focus\nNirvikalpa Samadhi – Samadhi without form – ability to withdraw from the senses\n6. Going beyond all form to reach the Absolute\nIn retrospection all these existences are just a dream – non-existent\nStilling the mind, you may think you have reached the Absolute\n7. Our daily living must be filled with effort\nDevelop the awareness so that you see everything filled with life\nExperience ‘What is’ – to know ‘I am that I am’ – very word becomes alive\nAll merge, no separation – you exist in your ‘Isness’, in essence\n8. Gururaj’s form of meditation is the essence of all Yogas, Patanjali’s, Vedanta,\nHe presents all his teachings in a simple form which can be practised in these modern times\nThe teachings will last for over two thousand years"}, {"ref": "UK78-5", "summary": "Handing out blessed objects\nGururaj says the Prayer ‘From the Point of Light’\nCourse ending – Gururaj’s comment ‘How valuable this life, and how well it is to be used’\n2. Robert appointed the new National Leader of BMS\nComment about Amrit and Gita going to America – in the service of humanity\n3. Expressions of gratitude for what they have done for BMS\n4. Poem written by Gita for Gururaj’s Birthday\n5. Amrit’s request for support for BMS and the new Leader\nComments on BMS progress to-date.\n6. Robert expressing gratitude to Gururaj and to Amrit and Gita"}, {"ref": "UK78-7", "summary": "2. Glimpses of what one is capable of being – just let go\nMental analysis is a post mortem – live every moment as if it’s new\nEnjoy the experiences, don’t analyse them – or else we lose the value of them\n3. The limiting factor in enjoying the experience is the mind\nWhirling thoughts, association of ideas, are all tricks of the mind\nEgo self of me is keeping me from my own reality\n4. Stop trying to save one’s self from experiencing the real self\nYou have identified yourself with unreality – what is real has become real to you\nAll pleasures and pains are temporary because they are of the mind\n5. Reality is not known by the mind but by itself\nHave the experience for the experience itself – then the ego starts fading away\nThe external guru merges away into the internal guru\n6. When an intense feeling arises, go with it – you will never lose yourself\nRise from dependency to independency – dependency implies surrender\nSurrender the heart to the truth, to the teachings\n7. Have an open mind to acquire that which is truthful – non-conditioned"}, {"ref": "UK78-8", "summary": "2. Why is it so difficult to change attitudes, ways of living, etc.?\nWe cling to transitory things because we find security\nNeed to change that which is forever changing into changelessness\nFear is a sign of instability, lack of faith, disbelief of Divinity\nReasons for not changing – our minds are the product of conditioning\nGreatest achievements are made by taking a leap\n3. People who change – those at rock bottom and those who see the futility of the present life\nWake up from the sleep that is causing all the suffering\n4. Our awareness is broadened – attune to that which is higher in us – the ‘permanent’\nMan has the thinking power to discriminate\nThe real absolute, the changeless is our real essence\nWith meditation, we reach a balance between the polarities\n5. The universe is in a continuing state of flux\nThe three Gunas cannot be destroyed, they make the mind function\nGo beyond inertia and reach the light – more enjoyable\nMisuse of a position of authority? – because of imbalance\n6. Proper understanding of the work and demands is necessary\nSpiritual authority – a person should have humility and compassion\nMeditators tending towards vegetarianism?\n7. Population explosion? – balanced out with floods, calamities etc.\nLife existent beyond this earth – various stages of evolution – cycles\nA cycle is just a flicker – nature can never hold you down\nYou have the ability to transcend"}, {"ref": "UK78-9", "summary": "2. How can we judge spiritual unfoldment and should we?\nFinding the environment non-separate from oneself is a sign\nUnfolding – removing the veils of attachment – spiritual upliftment\n3. Qualities and characteristics of the unfolded man – humility, surrender etc\nNature of the quest for knowledge\nSearch to find the answer to “Who am I?”\n4. Enquiring ability – destructive trends – inventions misused\nGo beyond knowledge (accumulation of facts) to wisdom\n5. Honesty and sincerity required in the search – excess knowledge is dangerous\nAcquiring knowledge for itself is not helping anyone\n6. The story of the young doctor – how the mind is turned after acquiring knowledge\nExpansion of the heart – love for others – how knowledge is put to good use\n7. No ultimate purpose in anything? Life is useless, pointless, purposeless?\nFrom the point of narrow analysis, all is pointless\nWe are searching for a purpose in life – the answer to ‘Who am I?’\n8. Precision existing everywhere in nature\nTo find one’s essence – that is the purpose of life\nDivinity being perfection doesn’t need expression\nEvil is a conception of one’s mind – good and evil coexist\n9/10 The purpose in life is to make it more integrated\nThe ultimate goal is to re-experience the silence – Divinity\nIn the ultimate, everything dissolves in a dream – we have not reached there yet"}, {"ref": "UK78-10", "summary": "2. The right to remain questioning?\nThe difference between worship and devotion\nDuty of the teacher is to impart – recipient to take whatever wisdom he can\nThe more enlightened the teacher, the more profound the wisdom\nGururaj’s talks aimed at opening up the heart and expanding the mind\n3. The Guru speaks from a deeper level – has a direct effect on the heart\nGururaj just can’t stop helping – can’t stop the love that wells up\nTrue teacher – his teachings are universal\nEssence of truth contained in all the teachings of all religions\n4. Accept what is conducive to you now, but be critical – do not just accept\nDevotion, then acceptance leads to expansion of the heart\nThe search for truth will never end once you have started on the path\n5. Understanding expands and one can appreciate more\n‘There are many sheep but not all of my flock’\nEncourage belief – never shatter a person’s faith\nLaws of morality and ethics - happiness producing\nBreaking these laws leads to guilt\nInterested in what can make us happy – self help – self awareness\n6. No need to worship a guru but you can have devotion to him\nBelief leads to faith and faith leads to knowingness\nThe truth that is spoken, the essence that is studied will live on\nThe guru lends a helping hand on the path\n7. Gururaj’s short poem about ‘Friendship’"}, {"ref": "UK78-11", "summary": "2. Concept of the illusion of Maya – significance of dreams\nWhen the mind is put to rest, the subconscious can capture past experiences\nFormation of dreams – before sleep – ability to forget\n3. The mind is the memory box of all impressions over many lifetimes\nDreams help to eradicate an experience – quieten the turbulence\nDreams are a great release – nightmares even moreso\n4. Not necessary to re-live all past experiences – can be resolved by meditation\nUsing positive affirmations to eradicate what is negative\nFeeling the presence of a chosen ideal – the light flashes through momentarily\n5. Types of dreams – meanings – psychic dreams – releasing samskaras\nMeaning of the various experiences during meditation\nExploring the dormant areas – where the samskaras are\nOur minds contain the entirety of the universe\n6. Visions in meditation – ecstasy and bliss – going beyond the mind\nUnity can only be experienced when you transcend the mind\n7. Fairies, nature spirits and guardian angels\nAuric quality of nature – the carrier, the sap of the tree, the link between gross/subtle\nSubtle body of a leaf being hurt – has emotions and feelings\n8. A guardian angel is the higher self within us – good impressions in the mind\nMythologies – war of gods with demons\nTry to live one’s life according to moral and ethical precepts\nLet the good impressions dominate"}, {"ref": "UK78-12", "summary": "2. To be able to love is to be able to love in totality\nWhen one truly loves, there is no need, no separation\nA Sage can’t help loving because he is love – wants nothing in return\n3. When one starts analysing love, love ceases – love is beyond analysis\nTo love without needing reward – you love for the sake of love\n4. Immersed in the ego, we think we are the centre of the world\nIncompatibilities between couples due to lack of surrender\nMarried couples – superficial love at first then move to a more enduring love\n5. Through meditation we function as total human beings\nTastes keep changing – these are from the mind not from the heart\nThe contributory factors to good family life\n6. No marriage need fail if both work at it\nVeneration of relics of saints and blessed objects?\nNot the relic but the faith of the person imparts the force, the power\n7. Many religions are based on devotion, Bhakti Yoga\nFaith cannot be imparted, must develop in the person\nPlace of pilgrimage – higher vibrations – some people can be healed there\n8. The guru giving a chela an extra push through shakti\nThe guru cannot evolve you, one has to evolve oneself"}, {"ref": "UK78-13", "summary": "2. Purpose of all Scriptures is to help us to follow the spiritual path\nUsing discrimination with the Scriptures, according to one’s understanding\nScriptural injunctions – need to understand them properly\n3. Purpose of Scripture is to show us the truth in its varied forms\nNeed to transcend the boundaries of dogma – ‘My way is right’\nScriptures have been totally misinterpreted – has led to many ‘holy’ wars\n4. Need to be onepointed in the quest to find the Father\nNerve centres needing to be activated by a subtler force\n5. Activating the chakras to allow the light of Divinity to shine through\nDescription of the chakras – concept of shakti reaching Shiva\n6. The universe is a reflection of Divinity – shakti makes the universe function\nKundalini Yoga – heightening the chakras to allow the energy a free flow"}, {"ref": "UK78-15", "summary": "2. Prayer of St. Francis of Assisi\nMeaning of self forgetfulness, harmlessness and right speech\nTeachers’ mission – life is not lived for one self only\nIn sharing, one benefits the most – it is in giving that we receive the most\n3. Self-forgetfulness – become more aware of oneself – lack of pride\nOnly when we know ourselves, can we become aware of the needs of others\nThe sense of importance is created by the ego – centre of the world\nTeaching – opportunity to refine the ego – service\n4. Spiritual pride is devolutionary – imparting an impulse to a chela\nHarmlessness – right thinking – conditioning by samskaras\nOne negative quality carries with it all the others\n5. Negative thoughts gather momentum\nMeditation brings alertness – checking ourselves constantly – right thinking\n6. Teaching, serving, helping, opens us up to the fragrance of Divinity\nTeaching with purity, Divine energy flows through us – heart opens up\nStory of Bhima from the Mahabharata\n7. Experiences or karma we had in our first incarnation, if any?\nDescription of the creation of the universe and the effect of the gunas\n8. Reaching the stage of man in the first incarnation, you’re not karma free\nKarma is non-binding because of not having a thinking ability\nTendencies are carried over – awareness of the physical self – latent karma\nMemories – trying to find the source of the blissful silence – happiness\n9. Progression continues until we find the true self within us\nNothingness is everything – called nothing because we don’t understand it\nReincarnating to a lower level? – evolution is progressive"}, {"ref": "UK78-16", "summary": "2. Several questions being submitted by teachers regarding the practices\nGururaj asked to give a welcoming talk explaining meditation for new meditators\n3. Gururaj gives a detailed explanation of the mechanics of the Preparatory Technique\nLying down in Savassana posture to assist relaxation – description of technique & benefits\nTaking the attention to the breathing – breathing slowing down – becoming more relaxed etc.\n4. Thoughts coming and going – don’t try to control them – observe them\nTo get away from thoughts, introduce the Prep. Mantra, ‘Ananda’\nWhen thought is directed to pure consciousness (Guru), purity rebounds back – creating a link\n5. The link to the guru does not require any belief or faith\nThe new meditator needs to be receptive – have an open mind - experience and then know\nOpening up the channel for Divine energy to flow – to enrich our lives\nThe same Shakti is in you as in the guru – just needs a boost to activate it\n6. Discussion about the Prep Talk which Gururaj has just given and about Forms\n7. Discussion about using ‘Ananda’ as the mantra in the Prep Technique\nWhether to use ‘Gururaj Ananda’ or ‘Ananda’ as the Prep Mantra?\n8. Gururaj’s reasons for using ‘Gururaj Ananda’ - the longer mantra\nDiscussions on the connection with Gururaj - the vibratory link\nNot a personality cult, just tuning oneself to consciousness\n9. Discussions on using the Preparatory Technique tape\nUsing the word ‘channel’ instead of ‘link’?\nFurther discussions about using ‘Gururaj Ananda’ or ‘Ananda’ as a Prep. Mantra\nPreference for Ananda as it is a neutral word?\n10. Concern about being seen to be worshipping a guru –\nPeople using the name of a guru they don’t know\nDifference between worship and using the guru as a focal point\n11. Discussing offering a choice of a number of mantras to new meditators\nDecision about which mantra to be left to the teacher to decide?\n12. Further discussion about teachers playing Introductory tapes\nPicture of Gururaj on the wall – where he hangs? – showing the photo around to new people\nHearing Gururaj’s voice - standardising the mantra used – using a neutral sound?\nFurther discussions on which mantra should be used\nPercentage of meditators who have fallen away because of using the mantra ‘Gururaj Ananda’?\n13. Further discussions on a variety of Prep Mantras which could be used\n14. Take the light which we have (Gururaj) and allow people to see the light -\nReasons for using Gururaj Ananda as the Prep Mantra\nBringing the concept of the link in gradually – not hiding the concept of spirituality for people\n15. Whole idea is to tune into the universal forces through doing Gurushakti\nSystem is based on 70% Gurushakti and 30% activating Gurushakti\nA bird on the mast of a ship – the ship eventually reaches the shore\nExplanation of Tratak\n16. Opening of the third eye – details of the Pineal gland and its secretions\nNo visualisation? - forces are still set in motion that activate the Pineal gland\nA person being allergic to candles? – no visualisation or it not returning?\n17. Visualisation never goes away, may take a rest\nUsing a candle or flame leaves an after image – difference between imagining and visualising\n18. The other practices enhance the mantra practice\n19. Unpleasant feelings or experiences when doing Tratak may be due to strain\nLooking at a blue light before or during while doing a healing"}, {"ref": "UK78-17", "summary": "2. Introductions of newly appointed Prep Teachers\nPrep Teachers indicating towns or areas where they’re are from\nPrep Teachers telling how they started meditating\n3. Prep Teacher Introductions continue\n4. More Introductions\n5. More Introductions\n6. Introduction of Full Counsellors to the Group present\nResponsibility of teachers for new meditators – some not accepting the teachings\nThe size of the flock is not important – it’s the quality – benefits accruing\nThe whole idea is to extend the teachings of the Master – if we do not, it is selfish\n7. Teacher to verify the truth of the teaching for himself and then pass it on\nThe criteria of feeling the truth is to experience that spiritual truth\nEssential truths in all religions – one goal – to find the Divinity within\n8. How can a teacher learn? First quality is obedience, then he has to have authority\nHumility, not pride required – love and tender care\n9. Keeping the flock together is preserving the sense of a family\n‘The Kingdom of Heaven within’ is the experience of love\nHas BMS got a group soul and the role of National Leaders?\nSoul is the subtle body – mental body mixed with the spirit\n10. Individuals are attracted together by Divine power (like iron filings to a magnet)\nReasons for entering on the spiritual path – distress, real seeker, etc.\nYou’ve got to share happiness or else it will stagnate – have to give, give\n11. Everyone is radiating, pulsating – a universe in himself\nWhy a Group needs to get together – helps the one radiating less joy – greater harmony\nSpiritual teacher radiates – Darshan – oneness – love is shared\n12. Benefits from attending Courses and weekly Satsangs\nGreater attunement – uplifting vibrations, common purpose\n“Togetherness” of the entire world – movement will grow\n13. Everyone can be reached – BMS increasing in numbers"}, {"ref": "UK78-18", "summary": "2. Amrit speaking about the Mandala practice\nHow to handle the Mandala – not letting anyone see it\n3. Covering the Mandala when not in use\nCarrying the Mandala without damaging it\n4. Derivation of the mantra – your entirety in sound value\nAt the point of separation of the Atman from Brahman there’s motion – sound\nThe mantra takes into account the present state of a person’s evolution\nExperience the mantra in a subtler form with ongoing practice\nThe essence won’t change but the structure of audible level will\nOn reaching the subtler levels, bring back the power and joy of the deeper level\n5. Every time you meditate, you make progress\nCannot reach the transcendental state in three or four sessions – needs practice\nMantra not suitable for some people due to mental imbalance\n6. How meditation affects our daily lives\nTurbulence in the mind can be brought to the fore – skeletons\nDissolve the samskaras with gurushakti – a glow, a calmness develops\nVibration from your meditation is permeating you all day\n7. Effects of activating chakras which are sluggish\nExplanation of the Tratak practice\nVisualisation – bring thoughts to a focal point – become the flame\n8. Ajna Chakra – Pineal Gland – benefits of Tratak\nUsing a flame – no damage to the eyes from looking at it\n9. Pranayama explained – attuning the individual self to the universal\nPrana – vital force – receiving the benefits of this life force\n10. Types of pranayama – Bastric – Chanting\nThe whole system gets purified\nThe heightened vibrations of the chakras start dissolving the samskaras"}, {"ref": "UK78-19", "summary": "2. Gururaj explains the gurushakti practice\nThe integrated state needed - plus a guiding factor\nUniversal force is existent everywhere – attune oneself to receive shakti\n3. To avail of grace or shakti, you need the human touch\nGurushakti cannot be explained, only experienced\nTo receive the benefits of shakti, open yourself up to it – fresh air coming in\nThe picture is used as a focal point to bring the shakti into a direct flow\n4. The practice acts as a lever to tackle any problem\nMany qualities are developed – love, sincerity, earnestness, honesty\nInner guru is awakened – outer and inner guru is the same\n5. The turbulence is there but we don’t let it affect us\nHow will BMS develop in the future?\nIt will snowball until the message of peace and love is heard by all\n6. Opening up hearts to Divine Grace – awareness expands – perspective changes\nNo Age of Enlightenment – no Master could enlighten the world - Lazarus\n7. Developing understanding, we can’t
